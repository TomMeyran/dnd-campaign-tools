function openDropdown(terms, matches) {
  const dd    = document.getElementById('searchDropdown');
  const input = document.getElementById('npcSearchInput');
  dd.innerHTML = '';
  focusedDdIndex = -1;

  if (matches.length === 0) {
    dd.innerHTML = `<div class="dd-empty">No results match "${escHtml(terms.join(' '))}"</div>`;
    dd.classList.add('open');
    input.classList.remove('has-results');
    input.classList.add('no-results');
    return;
  }

  input.classList.remove('no-results');
  input.classList.add('has-results');

  matches.forEach((match, i) => {
    const item = document.createElement('div');
    item.className = 'dd-item';
    item.dataset.index = i;
    if (match.type === 'house') {
      const h = match.house;
      item.innerHTML = `
        <span class="race-badge loc-badge">LOC</span>
        <span class="dd-name">${highlightTerms(h.name, terms)}</span>
        ${IS_DM ? `<span class="dd-sub">${npcCountLabel(h)}</span>` : ''}
        ${IS_DM ? `<span class="dd-house">#${escHtml(h.id)}</span>` : ''}`;
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        selectHouseFromSearch(h);
        input.value = h.name;
        closeDropdown();
      });
    } else if (match.type === 'loc') {
      const loc = match.loc;
      item.innerHTML = `
        <span class="race-badge" style="background:#2a1e08;color:#a08040;font-size:0.58rem;letter-spacing:0.06em">AREA</span>
        <span class="dd-name">${highlightTerms(loc.name, terms)}</span>`;
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        selectLocFromSearch(loc);
        input.value = loc.name;
        closeDropdown();
      });
    } else {
      const { npc, house } = match;
      item.innerHTML = `
        <span class="race-badge ${raceClass(npc.race)}">${escHtml(raceLabel(npc.race))}</span>
        <span class="dd-name">${highlightTerms(npc.name, terms)}</span>
        <span class="dd-sub">${escHtml(npc.profession || '')}</span>
        ${IS_DM ? `<span class="dd-house">${house.virtual ? escHtml(house.name) : '#' + escHtml(house.id)}</span>` : ''}`;
      item.addEventListener('mousedown', e => {
        e.preventDefault();
        selectNpc(npc, house);
        input.value = npc.name;
        closeDropdown();
      });
    }
    dd.appendChild(item);
  });

  dd.classList.add('open');
}

function updateFocusedItem(newIndex) {
  const items = document.querySelectorAll('.dd-item');
  if (!items.length) return;
  items.forEach(item => item.classList.remove('focused'));
  focusedDdIndex = Math.max(0, Math.min(newIndex, items.length - 1));
  items[focusedDdIndex]?.classList.add('focused');
  items[focusedDdIndex]?.scrollIntoView({ block: 'nearest' });
}

function initSearch() {
  npcIndex = buildNpcIndex();
  const input = document.getElementById('npcSearchInput');

  function doSearch() {
    const terms = input.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    input.classList.remove('has-results', 'no-results');
    clearSelection();
    if (!terms.length) { closeDropdown(); return; }
    const housesToSearch = visibleHouses();
    const houseMatches = housesToSearch
      .filter(h => terms.every(t => h.name.toLowerCase().includes(t)))
      .map(h => ({ type: 'house', house: h }));
    const npcMatches = npcIndex
      .filter(({ npc }) => npcMatchesQuery(npc, terms))
      .map(x => ({ type: 'npc', ...x }));
    const locMatches = (typeof TOWN_LOCATIONS !== 'undefined' ? TOWN_LOCATIONS : [])
      .filter(l => terms.every(t => l.name.toLowerCase().includes(t)))
      .map(l => ({ type: 'loc', loc: l }));
    openDropdown(terms, [...houseMatches, ...npcMatches, ...locMatches]);
  }

  input.addEventListener('input', doSearch);
  input.addEventListener('focus', () => { if (input.value.trim()) doSearch(); });

  input.addEventListener('keydown', e => {
    const items = document.querySelectorAll('.dd-item');
    if (e.key === 'ArrowDown') { e.preventDefault(); updateFocusedItem(focusedDdIndex + 1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); updateFocusedItem(focusedDdIndex - 1); }
    else if (e.key === 'Enter') {
      e.preventDefault();
      if (focusedDdIndex >= 0 && items[focusedDdIndex]) {
        items[focusedDdIndex].dispatchEvent(new MouseEvent('mousedown'));
      }
    } else if (e.key === 'Escape') {
      input.value = '';
      input.classList.remove('has-results', 'no-results');
      closeDropdown();
      clearSelection();
    }
  });

  document.addEventListener('mousedown', e => {
    const wrapper = document.getElementById('searchWrapper');
    if (wrapper && !wrapper.contains(e.target)) closeDropdown();
  });
}

// ─── MAP RENDERING ───────────────────────────────────────────────────────────
function buildMap() {
  const mapFrame = document.getElementById('mapFrame');
  applyMapImage();
  const existingGhost = mapFrame.querySelector('.map-marker.ghost');
  mapFrame.innerHTML = '';
  mountHexGrid();   // hex overlay first (under markers); re-added after the frame is cleared
  if (existingGhost) mapFrame.appendChild(existingGhost);
  if (partyMarkerEl) { mapFrame.appendChild(partyMarkerEl); renderPartyMarker(); }

  const houses = visibleHouses();
  const mapTip = document.getElementById('map-tooltip');

  houses.forEach(h => {
    const pos = HOUSE_MAP[h.id];
    if (!pos) return;

    const marker = document.createElement('button');
    marker.className = 'map-marker';
    marker.type = 'button';
    marker.dataset.houseId = h.id;
    marker.style.left = `${pos.x}%`;
    marker.style.top  = `${pos.y}%`;

    if (IS_DM && !isHouseVisible(h.id)) marker.classList.add('mk-hidden');

    marker.onclick = () => { if (!mapEditMode) selectHouseOnMap(h.id, true); };

    marker.onpointerdown = event => {
      if (!mapEditMode || event.button !== 0) return;
      event.preventDefault();
      activeDrag = { houseId: h.id, marker, start: { x: pos.x, y: pos.y }, current: { x: pos.x, y: pos.y }, pointerId: event.pointerId };
      marker.classList.add('dragging');
    };

    if (mapEditMode) marker.classList.add('editable');

    const label = document.createElement('span');
    label.className = 'map-label';
    label.textContent = h.name;
    if (mapLabelsVisible) label.classList.add('visible');
    marker.appendChild(label);
    marker.addEventListener('mouseenter', e => {
      if (!mapTip) return;
      mapTip.textContent = IS_DM ? `#${h.id} · ${h.name}` : h.name;
      mapTip.style.left = (e.clientX + 14) + 'px';
      mapTip.style.top  = (e.clientY - 32) + 'px';
      mapTip.classList.add('visible');
    });
    marker.addEventListener('mousemove', e => {
      if (!mapTip) return;
      mapTip.style.left = (e.clientX + 14) + 'px';
      mapTip.style.top  = (e.clientY - 32) + 'px';
    });
    marker.addEventListener('mouseleave', () => {
      mapTip?.classList.remove('visible');
    });

    mapFrame.appendChild(marker);
  });

  // Town location labels (districts, streets, landmarks)
  if (typeof TOWN_LOCATIONS !== 'undefined') {
    TOWN_LOCATIONS.forEach((loc, idx) => {
      const hasPos = LOC_MAP[loc.id];
      if (!hasPos && !mapEditMode) return;

      const label = document.createElement('div');
      label.className = 'map-loc-label';
      label.textContent = loc.name;
      label.dataset.locId = loc.id;

      if (hasPos) {
        label.style.left = `${hasPos.x}%`;
        label.style.top  = `${hasPos.y}%`;
      } else {
        // In edit mode, stack unpositioned labels at the left edge
        label.style.left = '3%';
        label.style.top  = `${4 + idx * 4}%`;
        label.classList.add('unpositioned');
      }

      if (mapEditMode) {
        label.classList.add('editable');
        label.onpointerdown = event => {
          if (event.button !== 0) return;
          event.preventDefault();
          const pos = LOC_MAP[loc.id] || { x: 3, y: 4 + idx * 4 };
          activeDrag = { locId: loc.id, marker: label, start: { ...pos }, current: { ...pos }, pointerId: event.pointerId };
          label.classList.add('dragging');
        };
      }

      mapFrame.appendChild(label);
    });
  }
  renderTokens();   // token instances sit above markers/labels
}

function goToMapAndSelectHouse(houseId) {
  const mapPanel = document.getElementById('mapPanel');
  if (mapPanel) mapPanel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  selectHouseOnMap(houseId, false);
}

function selectHouseOnMap(houseId, scrollHouse = false) {
  document.querySelectorAll('.map-marker').forEach(marker => {
    marker.classList.toggle('active', marker.dataset.houseId === String(houseId));
  });
  const houseCard = document.getElementById('house-' + houseId);
  expandHouseCard(houseCard);
  if (scrollHouse) {
    if (houseCard) setTimeout(() => houseCard.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
  }
}

function setMapLabelsVisible(visible) {
  mapLabelsVisible = visible;
  document.querySelectorAll('.map-label').forEach(l => {
    const marker = l.closest('.map-marker');
    const hidden = marker && marker.classList.contains('disabled');
    l.classList.toggle('visible', visible && !hidden);
  });
  const btn = document.getElementById('mapLabelsBtn');
  if (btn) btn.textContent = visible ? 'Hide locations' : 'Show locations';
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────
function buildSidebar() {
  const sb = document.getElementById('sidebar');

  const houses = visibleHouses();

  houses.forEach(h => {
    if (h.virtual) return; // virtual households are DM-only and have no map marker
    const row = document.createElement('div');
    row.className = 'sb-row';
    row.dataset.sbHouseId = h.id;

    const btn = document.createElement('button');
    btn.className = 'house-btn';
    btn.id = 'sbtn-' + h.id;
    btn.dataset.houseId = h.id;
    if (IS_DM && !isHouseVisible(h.id)) btn.classList.add('sb-hidden');
    btn.innerHTML = `
      ${IS_DM ? `<span class="hb-num">#${escHtml(h.id)}</span>` : ''}
      <span class="hb-info">
        <span class="hb-name">${escHtml(h.name)}</span>
        ${IS_DM ? `<span class="hb-detail">${npcCountLabel(h)}</span>` : ''}
      </span>`;
    btn.onclick = () => {
      document.querySelectorAll('.house-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      selectHouseOnMap(h.id, false);
      setTimeout(() => document.getElementById('house-' + h.id)?.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
    };
    row.appendChild(btn);

    if (IS_DM) {
      row.appendChild(_buildMigrateDropdown('house', h.id, h.name));
    }

    sb.appendChild(row);
  });

  if (typeof TOWN_LOCATIONS !== 'undefined' && TOWN_LOCATIONS.length > 0) {
    const sec = document.createElement('div');
    sec.className = 'sidebar-section sb-loc-section';
    sec.textContent = 'Locations';
    sb.appendChild(sec);

    TOWN_LOCATIONS.forEach(loc => {
      const item = document.createElement('div');
      item.className = 'loc-sb-item';
      item.id = 'sbloc-' + loc.id;
      item.innerHTML = `<span class="ls-name">${escHtml(loc.name)}</span>`;
      item.addEventListener('click', () => goToMapLabel(loc.id));
      if (IS_DM) {
        item.appendChild(_buildMigrateDropdown('label', loc.id, loc.name));
      }
      sb.appendChild(item);
    });
  }
}

// ─── NPC NOTES (shared with the NPC tool) ────────────────────────────────────
// Inline attachment preview: image → click to zoom; PDF → open in a new tab.
function renderMapAttachment(row, att, onRemove) {
  row.innerHTML = '';
  if (!att || !att.url) return;
  row.style.marginTop = '0.35rem';
  if (att.type === 'image') {
    const img = document.createElement('img');
    img.src = att.url; img.title = att.name || '';
    img.style.cssText = 'max-height:88px;max-width:150px;border-radius:4px;border:1px solid var(--parchment3);cursor:zoom-in;display:block';
    img.onclick = e => { e.stopPropagation(); openNpcZoomModal(att.url, att.name || 'Attachment'); };
    row.appendChild(img);
  } else {
    const a = document.createElement('a');
    if (/^(https?:\/\/|\/)/.test(att.url)) a.href = att.url;
    a.target = '_blank'; a.rel = 'noopener';
    a.textContent = '📄 ' + (att.name || 'Open PDF');
    a.style.cssText = "font-family:'Cinzel',serif;font-size:0.72rem;color:#a33;text-decoration:none;border:1px solid rgba(180,40,40,0.35);border-radius:3px;padding:3px 8px;display:inline-block";
    a.onclick = e => e.stopPropagation();
    row.appendChild(a);
  }
  if (onRemove) {
    const rm = document.createElement('button');
    rm.type = 'button'; rm.textContent = 'Remove file';
    rm.style.cssText = "margin-left:0.5rem;font-family:'Cinzel',serif;font-size:0.58rem;background:none;border:1px solid transparent;color:var(--ink3);cursor:pointer";
    rm.onclick = e => { e.stopPropagation(); onRemove(); };
    row.appendChild(rm);
  }
}

function buildPlayerNotesSection(notes) {
  const sec = document.createElement('div');
  sec.className = 'npc-player-notes-section';
  sec.style.cssText = 'padding:0.2rem 0.9rem 0.7rem;border-top:1px solid var(--parchment3)';
  const head = document.createElement('div');
  head.style.cssText = "font-family:'Cinzel',serif;font-size:0.6rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--ink3);margin:0.5rem 0 0.4rem";
  head.textContent = 'DM Notes';
  sec.appendChild(head);
  notes.forEach(n => {
    const item = document.createElement('div');
    item.style.marginBottom = '0.55rem';
    item.innerHTML = `<strong style="font-size:0.75rem;color:var(--ink2)">${escHtml(n.label)}</strong>`
      + `<div style="font-size:0.82rem;color:var(--ink2);line-height:1.5;margin-top:2px;white-space:pre-wrap">${escHtml(n.value)}</div>`;
    const attRow = document.createElement('div');
    renderMapAttachment(attRow, n.attachment, null);
    item.appendChild(attRow);
    sec.appendChild(item);
  });
  return sec;
}

function pickMapAttachment(npcId, note, repaint, afterSave) {
  const input = document.createElement('input');
  input.type = 'file'; input.accept = 'image/*,application/pdf';
  input.onchange = () => {
    const file = input.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      fetch(`/api/npc-sheet/${npcId}/note-attachment`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ noteId: note.id, dataUrl: reader.result, filename: file.name })
      }).then(r => r.json()).then(d => {
        if (d && d.ok && d.attachment) { note.attachment = d.attachment; repaint(); afterSave(); }
        else if (d && d.error) alert('Attachment failed: ' + d.error);
      }).catch(() => {});
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function deleteMapAttachment(npcId, url) {
  if (!url) return;
  fetch(`/api/npc-sheet/${npcId}/note-attachment-delete`, {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ url })
  }).catch(() => {});
}

// One NPC's notes — the SAME notes as the NPC tool. Rendered split across the
// card's Player View (shared notes) and DM Only (hidden notes) sections; each
// note's toggle moves it between them. Lazy-loads the sheet notes on first expand.
function makeNotesController(npc) {
  let notes = null, loaded = false, saveTimer = null, dirty = false;
  const areas = { player: null, dm: null };   // { wrap, list, addBtn, loadingEl }

  function save(immediate) {
    dirty = true;
    const doSave = () => {
      saveTimer = null;
      fetch(`/api/npc-sheet/${npc.npcId}/notes`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes })
      }).then(() => { dirty = false; }).catch(() => {});
    };
    clearTimeout(saveTimer);
    if (immediate) doSave(); else saveTimer = setTimeout(doSave, 500);
  }

  // Re-place every note under its section (shared → player, hidden → dm).
  function renderAll() {
    if (!notes) return;
    ['player', 'dm'].forEach(k => { if (areas[k]) areas[k].list.innerHTML = ''; });
    notes.forEach(note => {
      const k = note.shared ? 'player' : 'dm';
      if (areas[k]) areas[k].list.appendChild(makeRow(note));
    });
  }

  // Rendered in the same style as the NPC fields (no box, small-caps label,
  // transparent textarea) with a share toggle, a picture button and remove.
  function makeRow(note) {
    if (note.attachment === undefined) note.attachment = null;
    const item = document.createElement('div');
    item.className = 'nne-row';
    item.style.cssText = 'margin-bottom:0.6rem';
    item.innerHTML = `
      <div style="display:flex;gap:0.35rem;align-items:center">
        <input class="npc-field-label nne-label" type="text" value="${escHtml(note.label || '')}" style="flex:1;width:auto;min-height:0;height:1.7em">
        <button type="button" class="nne-share" style="font-family:'Cinzel',serif;font-size:0.56rem;letter-spacing:0.04em;padding:2px 7px;border-radius:2px;cursor:pointer;white-space:nowrap"></button>
        <button type="button" class="nne-pic" title="Attach image / PDF" style="font-size:0.72rem;background:none;border:1px solid transparent;border-radius:3px;cursor:pointer;color:var(--ink3);padding:1px 5px">🖼</button>
        <button type="button" class="npc-field-remove nne-remove" title="Remove note" style="margin-top:0;align-self:center">✕</button>
      </div>
      <textarea class="npc-edit-field nne-value">${escHtml(note.value || '')}</textarea>
      <div class="nne-att" style="margin-top:0.3rem"></div>`;
    const labelEl = item.querySelector('.nne-label');
    const valueEl = item.querySelector('.nne-value');
    const shareEl = item.querySelector('.nne-share');
    const picEl   = item.querySelector('.nne-pic');
    const removeEl = item.querySelector('.nne-remove');
    const attEl = item.querySelector('.nne-att');

    function paintShare() {   // Hidden = red, Shared = green
      shareEl.textContent = note.shared ? '● Shared' : '○ Hidden';
      shareEl.style.border = '1px solid ' + (note.shared ? 'rgba(60,160,80,0.8)' : 'rgba(180,60,60,0.6)');
      shareEl.style.background = note.shared ? 'rgba(60,160,80,0.22)' : 'rgba(180,60,60,0.14)';
      shareEl.style.color = note.shared ? '#3f8f57' : '#c85a5a';
    }
    function paintAtt() {
      attEl.innerHTML = '';
      if (note.attachment && note.attachment.url) {
        renderMapAttachment(attEl, note.attachment, () => {
          const url = note.attachment.url;
          note.attachment = null; paintAtt();
          deleteMapAttachment(npc.npcId, url); save(true);
        });
      }
    }
    paintShare(); paintAtt();

    labelEl.oninput = () => { note.label = labelEl.value; save(); };
    valueEl.oninput = () => { note.value = valueEl.value; save(); };
    // Toggle moves the note between the Player View and DM Only sections.
    shareEl.onclick = e => { e.stopPropagation(); note.shared = !note.shared; save(true); renderAll(); };
    picEl.onclick   = e => { e.stopPropagation(); pickMapAttachment(npc.npcId, note, paintAtt, () => save(true)); };
    removeEl.onclick = e => {
      e.stopPropagation();
      if (note.attachment && note.attachment.url) deleteMapAttachment(npc.npcId, note.attachment.url);
      notes = notes.filter(n => n !== note);
      save(true); renderAll();
    };
    return item;
  }

  function addNote(shared) {
    if (!loaded) return;
    notes.push({ id: Date.now() + Math.floor(Math.random() * 1000), label: 'New Note', value: '', shared, attachment: null });
    save(true); renderAll();
  }

  // Notes sub-area appended inside a card section (player = shared, dm = hidden).
  function buildArea(sectionKey) {
    const wrap = document.createElement('div');
    wrap.className = 'npc-notes-area';
    wrap.style.cssText = 'margin-top:0.5rem';
    const list = document.createElement('div');
    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.textContent = sectionKey === 'player' ? '+ Add shared note' : '+ Add hidden note';
    addBtn.style.cssText = "display:none;font-family:'Cinzel',serif;font-size:0.6rem;padding:3px 9px;border-radius:3px;cursor:pointer;border:1px dashed var(--parchment3);background:rgba(255,248,235,0.4);color:var(--ink3)";
    addBtn.onclick = e => { e.stopPropagation(); addNote(sectionKey === 'player'); };
    const loadingEl = document.createElement('div');
    loadingEl.textContent = 'Loading notes…';
    loadingEl.style.cssText = 'font-size:0.72rem;color:var(--ink3);font-style:italic';
    wrap.appendChild(list); wrap.appendChild(addBtn); wrap.appendChild(loadingEl);
    wrap.addEventListener('click', e => e.stopPropagation());
    areas[sectionKey] = { wrap, list, addBtn, loadingEl };
    return wrap;
  }

  function mapNotes(list) {
    return (Array.isArray(list) ? list : []).map(n => {
      if (n.shared === undefined) n.shared = !!n.sentToPlayers;
      delete n.sentToPlayers;
      if (n.attachment === undefined) n.attachment = null;
      return n;
    });
  }

  function load() {
    if (loaded) return;
    loaded = true;
    fetch(`/api/npc-sheet/${npc.npcId}`).then(r => r.json()).then(d => {
      notes = mapNotes(d && d.sheet && d.sheet.notes);
      ['player', 'dm'].forEach(k => { if (areas[k]) { areas[k].loadingEl.style.display = 'none'; areas[k].addBtn.style.display = ''; } });
      renderAll();
    }).catch(() => { loaded = false; ['player', 'dm'].forEach(k => { if (areas[k]) areas[k].loadingEl.textContent = 'Failed to load notes.'; }); });
  }

  // Live-refresh from the server after a change made in the other tool.
  function refresh() {
    if (!loaded) return;
    fetch(`/api/npc-sheet/${npc.npcId}`).then(r => r.json()).then(d => {
      if (d && d.sheet && Array.isArray(d.sheet.notes)) { notes = mapNotes(d.sheet.notes); renderAll(); }
    }).catch(() => {});
  }

  function flush() {
    if (!dirty || notes === null) return;
    clearTimeout(saveTimer); saveTimer = null;
    dirty = false;
    navigator.sendBeacon(
      `/api/npc-sheet/${npc.npcId}/notes`,
      new Blob([JSON.stringify({ notes })], { type: 'application/json' })
    );
  }

  const ctl = { buildArea, load, refresh, flush };
  activeNotesControllers.add(ctl);
  return ctl;
}

// ─── NPC + HOUSE BUILDERS ────────────────────────────────────────────────────
function buildNPC(npc, houseId, isVirtualHouse) {
  const div = document.createElement('div');
  div.className = 'npc-card';
  div.dataset.npcName = npc.name;
  if (IS_DM && !isVirtualHouse && !isNpcVisible(houseId, npc.name)) div.classList.add('dm-hidden');

  // Sections now hold only notes (shared → Player View, hidden → DM Only).
  // The old per-NPC fields have been folded into the notes system.
  function makeSection(sectionKey, sectionLabel) {
    const sec = document.createElement('div');
    sec.className = 'npc-section ' + (sectionKey === 'player' ? 'player-section' : 'dm-section');
    const hdr = document.createElement('div');
    hdr.className = 'npc-section-label';
    hdr.textContent = sectionLabel;
    sec.appendChild(hdr);
    if (IS_DM && notesCtl) sec.appendChild(notesCtl.buildArea(sectionKey));
    return sec;
  }

  const slug = npcSlug(npc.name);
  const noteData = npcPlayerNotes[slug];

  div.innerHTML = `
    <div class="npc-card-header">
      <span class="race-badge ${raceClass(npc.race)}">${escHtml(raceLabel(npc.race))}</span>
      <span class="npc-name-block">
        <span class="npc-name">${escHtml(npc.name)}</span>
        <span class="npc-role"${IS_DM && !isVirtualHouse ? ' contenteditable="true" title="Click to edit profession"' : ''}>${escHtml(npc.profession ?? '')}</span>
      </span>
      <span class="npc-age">${npc.age != null ? escHtml(String(npc.age)) : '—'}</span>
      <span class="npc-toggle" style="margin-left:6px;font-size:0.7rem;color:var(--ink3)">▼</span>
    </div>`;

  if (IS_DM && !isVirtualHouse) {
    const roleEl = div.querySelector('.npc-role');
    roleEl.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); roleEl.blur(); } });
    roleEl.addEventListener('blur', () => {
      const val = roleEl.textContent.trim();
      if (val === (npc.profession ?? '')) return;
      npc.profession = val || undefined;
      saveTownContentToServer();
    });
    roleEl.addEventListener('click', e => e.stopPropagation());
  }

  const body = document.createElement('div');
  body.className = 'npc-card-body';

  // DM notes live inside the sections below — shared notes under Player View,
  // hidden notes under DM Only — the same notes as the NPC tool. Each note's
  // toggle moves it between the two. Players see the shared subset read-only.
  // Fall back to the name→id map when the town content defined the NPC without an id.
  if (!npc.npcId && npcIdByName[npc.name]) npc.npcId = npcIdByName[npc.name];
  const notesCtl = (IS_DM && npc.npcId) ? makeNotesController(npc) : null;

  if (IS_DM) {
    body.appendChild(makeSection('player', 'Player View'));
    body.appendChild(makeSection('dm', 'DM Only'));
  }
  // Players: shared notes are shown read-only in buildPlayerNotesSection below.

  div.appendChild(body);

  if (!IS_DM && noteData && noteData.notes && noteData.notes.length > 0) {
    div.appendChild(buildPlayerNotesSection(noteData.notes));
  }

  const header = div.querySelector('.npc-card-header');

  // DM sees portrait for any NPC with an image; players only see portraits sent via button.
  const portraitSrc = IS_DM ? (npcImages[slug] || null) : (noteData?.image || null);
  if (portraitSrc) {
    const thumb = document.createElement('img');
    thumb.className = 'npc-portrait-thumb';
    thumb.src = portraitSrc;
    thumb.alt = '';
    thumb.title = 'View portrait';
    thumb.onclick = e => { e.stopPropagation(); openNpcZoomModal(portraitSrc, npc.name); };
    const nameBlock = header.querySelector('.npc-name-block');
    header.insertBefore(thumb, nameBlock);
  }

  header.onclick = () => {
    body.classList.toggle('open');
    div.querySelector('.npc-toggle').textContent = body.classList.contains('open') ? '▲' : '▼';
    if (body.classList.contains('open')) {
      body.querySelectorAll('textarea.npc-edit-field, textarea.npc-field-label').forEach(ta => { if (ta._resize) ta._resize(); });
      if (notesCtl) notesCtl.load();
    }
  };

  // DM-only: button to open NPC sheet in new tab
  if (IS_DM) {
    const sheetBtn = document.createElement('button');
    sheetBtn.type = 'button';
    sheetBtn.className = 'house-map-btn';
    sheetBtn.textContent = 'Sheet';
    sheetBtn.title = 'Open NPC sheet';
    sheetBtn.onclick = e => {
      e.stopPropagation();
      window.open(npcToolUrl({ npc: npc.name, town: TOWN_SLUG_API }), '_blank');
    };
    header.insertBefore(sheetBtn, div.querySelector('.npc-toggle'));
  }

  if (IS_DM && !isVirtualHouse) {
    const visBtn = document.createElement('button');
    visBtn.type = 'button';
    visBtn.className = 'show-player-btn npc-player-btn';
    const houseHidden = !isHouseVisible(houseId);
    const vis = isNpcVisible(houseId, npc.name);
    visBtn.textContent = vis ? '● Revealed' : '○ Hidden';
    if (vis) visBtn.classList.add('is-visible');
    visBtn.disabled = houseHidden;
    visBtn.onclick = e => { e.stopPropagation(); toggleNpcVisibility(houseId, npc.name); };
    header.insertBefore(visBtn, div.querySelector('.npc-toggle'));
  }

  return div;
}

function buildHouse(h) {
  const card = document.createElement('div');
  card.className = 'house-card';
  card.id = 'house-' + h.id;
  if (h.virtual) card.dataset.virtual = 'true';
  if (IS_DM && !h.virtual && !isHouseVisible(h.id)) card.classList.add('dm-hidden');

  const header = document.createElement('div');
  header.className = 'house-header';
  header.innerHTML = `
    ${IS_DM ? `<span class="hh-num">${h.virtual ? '' : '#' + escHtml(h.id)}</span>` : ''}
    <span class="hh-name">${escHtml(h.name)}</span>
    ${IS_DM ? `<span class="hh-count">${npcCountLabel(h)}</span>` : ''}
    <span class="hh-toggle">▼</span>`;

  if (!h.virtual) {
    // Map button
    const mapBtn = document.createElement('button');
    mapBtn.className = 'house-map-btn';
    mapBtn.type = 'button';
    mapBtn.textContent = 'Map';
    mapBtn.onclick = e => { e.stopPropagation(); goToMapAndSelectHouse(h.id); };
    header.insertBefore(mapBtn, header.querySelector('.hh-toggle'));

    // DM mode: Show Player toggle
    if (IS_DM) {
      const visBtn = document.createElement('button');
      visBtn.className = 'show-player-btn house-player-btn';
      const vis = isHouseVisible(h.id);
      visBtn.textContent = vis ? '● Visible to Players' : '○ Hidden from Players';
      if (vis) visBtn.classList.add('is-visible');
      visBtn.onclick = e => { e.stopPropagation(); toggleHouseVisibility(h.id); };
      header.insertBefore(visBtn, header.querySelector('.hh-toggle'));
    }
  }

  const body = document.createElement('div');
  body.className = IS_DM ? 'house-body' : 'house-body open';

  const desc = document.createElement('p');
  desc.className = 'house-desc';
  desc.textContent = h.desc;

  const grid = document.createElement('div');
  grid.className = 'npc-grid';

  // In player mode, only show visible NPCs
  const npcsToShow = IS_DM
    ? h.npcs
    : h.npcs.filter(n => isNpcVisible(h.id, n.name));
  npcsToShow.forEach(npc => grid.appendChild(buildNPC(npc, h.id, h.virtual)));

  body.appendChild(desc);
  body.appendChild(grid);

  header.onclick = () => {
    body.classList.toggle('open');
    header.querySelector('.hh-toggle').textContent = body.classList.contains('open') ? '▲' : '▼';
  };

  card.appendChild(header);
  card.appendChild(body);
  return card;
}

// ─── FILTER + CONTENT REBUILD ────────────────────────────────────────────────
function applyFilters() {
  const filters = [...selectedRaces];
  const showAll  = filters.length === 0;

  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active',
      btn.dataset.race === '__all__' ? showAll : selectedRaces.has(btn.dataset.race));
  });

  document.querySelectorAll('.npc-card').forEach(card => {
    const badge = card.querySelector('.race-badge');
    const match  = showAll || filters.some(r => badge && badge.classList.contains(raceClass(r)));
    card.style.display = match ? '' : 'none';
  });

  document.querySelectorAll('.house-card').forEach(house => {
    const hid = house.id.replace('house-', '');
    const cards = [...house.querySelectorAll('.npc-card')];
    const isVirtual = house.dataset.virtual === 'true';
    let anyVisible;
    if (IS_DM) {
      // DM: always show premises (even empty ones); filter by race only when a filter is active
      anyVisible = showAll || cards.some(c => c.style.display !== 'none');
      // Virtual households (unplaced NPCs) always visible to DM; skip the vis filter
      if (!isVirtual && anyVisible && visFilter !== 'all') {
        const revealed = isHouseVisible(hid);
        if (visFilter === 'shown')  anyVisible = revealed;
        if (visFilter === 'hidden') anyVisible = !revealed;
      }
    } else {
      // Player: rebuildContent already filtered to visible houses only.
      // Show with no filter; with a race filter, hide if no NPC cards match.
      anyVisible = showAll || cards.some(c => c.style.display !== 'none');
    }
    house.style.display = anyVisible ? '' : 'none';
    const sbRow = document.querySelector(`.sb-row[data-sb-house-id="${hid}"]`);
    if (sbRow) sbRow.style.display = anyVisible ? '' : 'none';
    const marker = document.querySelector(`.map-marker[data-house-id="${hid}"]`);
    if (marker) { marker.classList.toggle('disabled', !anyVisible); marker.disabled = !anyVisible; }
  });
}

function updateHeaderStats() {
  if (IS_DM) {
    document.getElementById('statHomes').textContent     = TOWN_TOTAL_HOMES;
    document.getElementById('statResidents').textContent = TOWN_TOTAL_RESIDENTS;
    document.getElementById('statLogged').textContent    = HOUSEHOLDS.filter(h => !h.virtual).length;
  } else {
    const houses = visibleHouses();
    const visibleResidents = houses
      .flatMap(h => h.npcs.filter(n => isNpcVisible(h.id, n.name))).length;
    document.getElementById('statHomes').textContent     = houses.length;
    document.getElementById('statResidents').textContent = visibleResidents;
    document.getElementById('statHomesLabel').textContent     = 'Known';
    document.getElementById('statResidentsLabel').textContent = 'Residents';
    document.getElementById('statLoggedWrap').style.display   = 'none';
  }
}

// Light in-place update for players when only NPC field values changed (not visibility).
// Updates .npc-value spans without rebuilding the DOM, so scroll position is preserved.
// Update player-note sections and portrait thumbnails without a full rebuild.
function updateNpcPlayerNoteCards() {
  document.querySelectorAll('.npc-card').forEach(card => {
    const name = card.dataset.npcName;
    const slug = npcSlug(name);
    const noteData = npcPlayerNotes[slug];
    const header = card.querySelector('.npc-card-header');

    if (!header) return;

    // Portrait thumbnail — DM sees all NPC images; players only see button-sent ones.
    const portraitSrc = IS_DM ? (npcImages[slug] || null) : (noteData?.image || null);
    let thumb = header.querySelector('.npc-portrait-thumb');
    if (portraitSrc) {
      if (!thumb) {
        thumb = document.createElement('img');
        thumb.className = 'npc-portrait-thumb';
        thumb.alt = '';
        thumb.title = 'View portrait';
        const nameBlock = header.querySelector('.npc-name-block');
        if (nameBlock) header.insertBefore(thumb, nameBlock);
        else header.appendChild(thumb);
      }
      thumb.src = portraitSrc;
      thumb.onclick = e => { e.stopPropagation(); openNpcZoomModal(portraitSrc, name); };
    } else if (thumb) {
      thumb.remove();
    }

    // Notes section
    let section = card.querySelector('.npc-player-notes-section');
    if (!noteData || !noteData.notes || noteData.notes.length === 0) {
      if (section) section.remove();
      return;
    }
    const newSection = buildPlayerNotesSection(noteData.notes);
    if (section) {
      section.replaceWith(newSection);
    } else {
      const body = card.querySelector('.npc-card-body');
      if (body && body.classList.contains('open')) body.after(newSection);
      else card.appendChild(newSection);
    }
  });
}

// Structural signature of the town content — households + NPC membership + all extra map data.
// Note changes don't alter this, so we can tell a note-only update from a rename/move.
function contentSig(content) {
  return JSON.stringify({
    houses:    (content && content.households || []).map(h => ({
      id: h.id, name: h.name, npcs: (h.npcs || []).map(n => n.name)
    })),
    extraMaps: (content && content.extraMaps || []).map(m => ({
      url:  m.url,
      hh:   JSON.stringify((m.households || []).map(h => ({ id: h.id, name: h.name }))),
      ll:   JSON.stringify((m.townLocations || []).map(l => ({ id: l.id, name: l.name }))),
      vis:  JSON.stringify(m.playerVis   || {}),
      hpos: JSON.stringify(m.housePositions || {}),
      lpos: JSON.stringify(m.locPositions   || {})
    }))
  });
}
let lastContentSig = '';

function rebuildContent() {
  if (activeMapIndex > EXTRA_MAPS.length) {
    activeMapIndex = 0;
    mapImageLoading = false;
  }
  // Flush pending note saves before destroying controllers so unload beacon covers them.
  activeNotesControllers.forEach(c => c.flush?.());
  activeNotesControllers.clear();
  lastContentSig = contentSig({ households: (typeof HOUSEHOLDS !== 'undefined' ? HOUSEHOLDS : []), extraMaps: EXTRA_MAPS });
  // Sidebar house buttons
  document.getElementById('sidebar').innerHTML = '';
  buildSidebar();

  // Race filter bar — keep valid selectedRaces, rebuild buttons
  const allNpcs = IS_DM
    ? HOUSEHOLDS.flatMap(h => h.npcs)
    : visibleHouses().flatMap(h => h.npcs.filter(n => isNpcVisible(h.id, n.name)));
  const races = [...new Set(allNpcs.map(n => n.race))].sort();
  [...selectedRaces].forEach(r => { if (!races.includes(r)) selectedRaces.delete(r); });

  const fb = document.getElementById('filterBar');
  fb.innerHTML = '';
  const allBtn = document.createElement('button');
  allBtn.className = 'filter-btn';
  allBtn.dataset.race = '__all__';
  allBtn.textContent = 'All';
  allBtn.onclick = () => { selectedRaces.clear(); applyFilters(); };
  fb.appendChild(allBtn);
  races.forEach(r => {
    const b = document.createElement('button');
    b.className = 'filter-btn';
    b.textContent = raceLabel(r);
    b.dataset.race = r;
    b.onclick = () => { if (selectedRaces.has(r)) selectedRaces.delete(r); else selectedRaces.add(r); applyFilters(); };
    fb.appendChild(b);
  });

  // House list
  const list = document.getElementById('houseList');
  list.innerHTML = '';
  const housesToBuild = visibleHouses();
  housesToBuild.forEach(h => list.appendChild(buildHouse(h)));

  // Map markers and NPC search index
  buildMap();
  npcIndex = buildNpcIndex();

  applyFilters();
  updateHeaderStats();
  updateMapTitleUI();
}

// ─── SECONDARY MAPS ──────────────────────────────────────────────────────────
function switchToMap(index) {
  if (index === activeMapIndex) return;
  _flushCurrentMapData();
  activeMapIndex = index;
  mapImageLoading = false;
  if (index === 0) {
    _loadMainMapGlobals();
  } else {
    const em = EXTRA_MAPS[index - 1];
    if (em) {
      _loadExtraMapGlobals(index);
      _replaceObj(HOUSE_MAP, em.housePositions || {});
      _replaceObj(LOC_MAP,   em.locPositions   || {});
      playerVisibility = em.playerVis || { houses: {}, npcs: {} };
    }
  }
  if (typeof loadHexGridFromState === 'function') loadHexGridFromState();   // this map's own grid
  applyMapImage();
  updateMapTitleUI();
  rebuildContent();
  const dd = document.getElementById('mapSwitchDropdown');
  if (dd) dd.style.display = 'none';
}

function updateMapTitleUI() {
  const titleEl    = document.getElementById('mapTitle');
  const switchWrap = document.getElementById('mapSwitchWrap');
  if (!titleEl || !switchWrap) return;
  const allMaps = [{ label: `${TOWN_NAME} Map` }, ...EXTRA_MAPS.map(m => ({ label: m.label }))];
  titleEl.textContent = allMaps[activeMapIndex]?.label || `${TOWN_NAME} Map`;
  const dd = document.getElementById('mapSwitchDropdown');
  dd.innerHTML = '';
  if (IS_DM) {
    switchWrap.style.display = '';
    if (allMaps.length > 1) {
      _appendMapSwitchItems(dd, allMaps);
      const sep = document.createElement('div');
      sep.style.cssText = 'height:1px;background:var(--parchment3);margin:4px 6px;';
      dd.appendChild(sep);
    }
    const hasImg = !!getActiveMapUrl();
    if (hasImg) {
      const rmBtn = document.createElement('button');
      rmBtn.type = 'button'; rmBtn.className = 'map-action-menu-item';
      rmBtn.textContent = 'Remove image';
      rmBtn.addEventListener('click', () => { dd.style.display = 'none'; removeActiveMapImage(); });
      dd.appendChild(rmBtn);
    }
    const replBtn = document.createElement('button');
    replBtn.type = 'button'; replBtn.className = 'map-action-menu-item';
    replBtn.textContent = hasImg ? 'Replace image' : 'Add image';
    replBtn.addEventListener('click', () => { dd.style.display = 'none'; replaceActiveMapImage(); });
    dd.appendChild(replBtn);
    // Delete map — only for extra maps (never the main town map)
    if (activeMapIndex > 0) {
      const delBtn = document.createElement('button');
      delBtn.type = 'button'; delBtn.className = 'map-action-menu-item';
      delBtn.textContent = 'Delete map';
      delBtn.style.color = 'var(--red)';
      delBtn.addEventListener('click', () => { dd.style.display = 'none'; deleteActiveMap(); });
      dd.appendChild(delBtn);
    }
  } else {
    if (allMaps.length > 1) {
      switchWrap.style.display = '';
      _appendMapSwitchItems(dd, allMaps);
    } else {
      switchWrap.style.display = 'none';
      dd.style.display = 'none';
    }
  }
}

// Append a clickable switch-to entry for each map into the dropdown.
function _appendMapSwitchItems(dd, allMaps) {
  allMaps.forEach((m, i) => {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'map-action-menu-item';
    item.textContent = m.label;
    if (i === activeMapIndex) item.style.color = 'var(--gold)';
    item.addEventListener('click', () => { dd.style.display = 'none'; switchToMap(i); });
    dd.appendChild(item);
  });
}

async function removeActiveMapImage() {
  if (!confirm('Remove the map image? All location data (premises, labels, characters) will be kept.')) return;
  if (activeMapIndex === 0) {
    window.MAP_IMAGE_FILENAME = '';
  } else {
    const em = EXTRA_MAPS[activeMapIndex - 1];
    if (em) em.url = '';
  }
  applyMapImage();
  buildMap();
  updateMapTitleUI();
  await saveTownContentToServer();
}

async function deleteActiveMap() {
  if (activeMapIndex === 0) return; // main town map cannot be deleted
  const idx = activeMapIndex - 1;
  const em  = EXTRA_MAPS[idx];
  const label = em ? (em.label || 'this map') : 'this map';
  if (!confirm(`Delete "${label}"? This removes its image and all of its premises, labels, and characters. Other maps in this location are not affected.`)) return;
  // Load the main town map into the live globals WITHOUT flushing the doomed map,
  // so its live data is simply discarded.
  activeMapIndex = 0;
  mapImageLoading = false;
  _loadMainMapGlobals();
  // Remove the extra map entry entirely.
  EXTRA_MAPS.splice(idx, 1);
  applyMapImage();
  updateMapTitleUI();
  rebuildContent();
  await saveTownContentToServer();
}

// Read a file as a data URL and POST it to the extra-map endpoint (content-hash
// deduped server-side). Returns the parsed { url } / { error } response.
function _uploadMapImage(file, label) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      const body = { dataUrl: reader.result, filename: file.name };
      if (label != null) body.label = label;
      fetch(`/api/town/${TOWN_SLUG_API}/extra-map`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      }).then(r => r.json()).then(resolve).catch(reject);
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Open a file picker for images, returning the chosen File (or null if cancelled).
function _pickImageFile() {
  return new Promise(resolve => {
    const input = document.createElement('input');
    input.type = 'file'; input.accept = 'image/*';
    input.onchange = () => resolve(input.files[0] || null);
    input.click();
  });
}

async function replaceActiveMapImage() {
  const file = await _pickImageFile();
  if (!file) return;
  try {
    const d = await _uploadMapImage(file, null);
    if (d && d.url) {
      if (activeMapIndex === 0) {
        window.MAP_IMAGE_FILENAME = d.url;
      } else {
        const em = EXTRA_MAPS[activeMapIndex - 1];
        if (em) em.url = d.url;
      }
      applyMapImage();
      updateMapTitleUI();
      await saveTownContentToServer();
    } else {
      alert('Upload failed: ' + (d && d.error ? d.error : 'Unknown error'));
    }
  } catch(e) { alert('Upload failed'); }
}

async function addExtraMap() {
  const file = await _pickImageFile();
  if (!file) return;
  const label = (prompt('Map label:') || '').trim();
  if (!label) return;
  try {
    const d = await _uploadMapImage(file, label);
    if (d && d.url) {
      EXTRA_MAPS.push({ url: d.url, label });
      await saveTownContentToServer();
      updateMapTitleUI();
      switchToMap(EXTRA_MAPS.length);
    } else {
      alert('Upload failed: ' + (d && d.error ? d.error : 'Unknown error'));
    }
  } catch(e) { alert('Upload failed'); }
}

// ─── PREMISES CREATION ───────────────────────────────────────────────────────
async function removePremises(houseId, houseName) {
  if (!confirm(`Remove "${houseName}"? Its NPCs will move to the unassigned list.`)) return;
  // Clear premises on any npc_sheets NPCs that live here (main map only)
  if (activeMapIndex === 0) {
    await fetch(`/api/town/${TOWN_SLUG_API}/remove-premises`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ houseName })
    }).catch(() => {});
  }
  // Remove from local state
  const idx = HOUSEHOLDS.findIndex(h => h.id === houseId);
  if (idx !== -1) HOUSEHOLDS.splice(idx, 1);
  delete HOUSE_MAP[houseId];
  // Persist and refresh
  await saveTownContentToServer();
  saveHouseMap();
  rebuildContent();
}

function saveTownContentToServer() {
  _flushCurrentMapData();
  return fetch(`/api/town/${TOWN_SLUG_API}/content`, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify({
      name:            TOWN_NAME,
      mapImage:        MAP_IMAGE_FILENAME,
      totalHomes:      TOWN_TOTAL_HOMES  || 0,
      totalResidents:  TOWN_TOTAL_RESIDENTS || 0,
      households:      (_mainMapSnap.households || []).filter(h => !h.virtual),
      townLocations:   _mainMapSnap.townLocations  || [],
      houseMapDefault: _mainMapSnap.houseMapDefault || {},
      extraMaps:       EXTRA_MAPS || []
    })
  }).catch(() => {});
}

async function addPremises() {
  const name = (prompt('Premises name:') || '').trim();
  if (!name) return;
  const realHouses = HOUSEHOLDS.filter(h => !h.virtual);
  const nextId = realHouses.reduce((m, h) => Math.max(m, Number(h.id) || 0), 0) + 1;
  HOUSEHOLDS.push({ id: nextId, name, residents: 0, npcs: [], desc: '' });
  await saveTownContentToServer();
  rebuildContent();
  setTimeout(() => {
    document.getElementById('mapPanel').scrollIntoView({ behavior: 'smooth', block: 'start' });
    enterPremisesPlacementMode(name, nextId);
  }, 80);
}

function enterPremisesPlacementMode(name, id) {
  if (premisesPlacementMode) exitPremisesPlacementMode();
  premisesPlacementMode = true;
  premisesPlacementId   = id;
  document.getElementById('mapPanel').classList.add('placement-mode');
  document.getElementById('placement-banner').textContent =
    `Click on the map to place "${name}"  ·  Esc to cancel`;
  ghostMarker = document.createElement('button');
  ghostMarker.className = 'map-marker ghost';
  ghostMarker.type = 'button';
  const lbl = document.createElement('span');
  lbl.className = 'map-label visible';
  lbl.textContent = name;
  ghostMarker.appendChild(lbl);
  const mapFrame = document.getElementById('mapFrame');
  mapFrame.appendChild(ghostMarker);
  // Initialise ghost at last known cursor position, or map centre
  const rect = mapFrame.getBoundingClientRect();
  if (rect.width > 0 && lastPointerX !== null) {
    const gx = Math.max(0, Math.min(100, ((lastPointerX - rect.left) / rect.width)  * 100));
    const gy = Math.max(0, Math.min(100, ((lastPointerY - rect.top)  / rect.height) * 100));
    ghostMarker.style.left = `${gx}%`;
    ghostMarker.style.top  = `${gy}%`;
  } else {
    ghostMarker.style.left = '50%';
    ghostMarker.style.top  = '50%';
  }
}

function exitPremisesPlacementMode() {
  premisesPlacementMode = false;
  premisesPlacementId   = null;
  if (ghostMarker) { ghostMarker.remove(); ghostMarker = null; }
  document.getElementById('mapPanel').classList.remove('placement-mode');
  document.getElementById('placement-banner').textContent = '';
}

function finalizePremisesPlacement(x, y) {
  const id = premisesPlacementId;
  exitPremisesPlacementMode();
  HOUSE_MAP[id] = { x, y };
  saveHouseMap();
  buildMap();
  setTimeout(() => selectHouseOnMap(id, false), 50);
}

// ─── PARTY MARKER ──────────────────────────────────────────────────────────
function getPartyPos() {
  const p = LOC_MAP['__party__'];
  return (p && Number.isFinite(p.x) && Number.isFinite(p.y)) ? p : null;
}

function renderPartyMarker() {
  if (!partyMarkerEl) return;

        <line class="oct-line" x1="32.02" y1="32.02" x2="3"     y2="20"   />
        <line class="oct-line" x1="20"    y1="37"    x2="7.98"  y2="7.98" />
        <line class="oct-line" x1="7.98"  y1="32.02" x2="20"    y2="3"    />
        <line class="oct-line" x1="3"     y1="20"    x2="32.02" y2="7.98" />

      partyMarkerEl.classList.add('dragging');
      partyMarkerEl.setPointerCapture(ev.pointerId);
    });
    // Right-click removes the party marker from this map (DM).
    partyMarkerEl.addEventListener('contextmenu', ev => {
      ev.preventDefault();
      if (confirm('Remove the party marker from this map?')) removePartyMarker();
    });
  }
  document.getElementById('mapFrame').appendChild(partyMarkerEl);
  renderPartyMarker();
}

// Remove the party marker from the current map (DM). Deletes its position so it hides + isn't
// restored, then persists + broadcasts via the existing loc-map save.
function removePartyMarker() {
  if (!IS_DM) return;
  delete LOC_MAP['__party__'];
  renderPartyMarker();
  saveLocMap();
}

// ─── HEX GRID (imported from the atlas; DM-controlled, synced to players) ──────
// PER-MAP: each map (main + every extra map) keeps its own grid state under that map's
// loc positions, in LOC_MAP['__hexgrid__'] = { on, scale }. LOC_MAP is swapped whenever the
// active map changes, so switching maps loads that map's grid automatically. saveLocMap()
// already persists LOC_MAP to the correct DB store (town_state for the main map, the
// extra_maps JSON in town_content for extra maps) and broadcasts via the existing pipeline.
// The overlay SVG is a child of #mapFrame, re-appended after every buildMap() (which clears
// the frame), just like the party marker. scale = cell size in px.
let hexGrid = { on: false, scale: 112 };
let hexGridEl = null;
let _hexSaveTimer = null;

function hexPatternSvg() {
  // Two pointy-top hexagons per tile (34.641 × 60) tiling into a seamless honeycomb.
  return '<svg id="hex-grid-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">' +
    '<defs><pattern id="hex-pattern" width="34.641" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(3.2)">' +
    '<path fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round" ' +
    'd="M17.3205 0L34.641 10L34.641 30L17.3205 40L0 30L0 10Z M0 30L17.3205 40L17.3205 60L0 70L-17.3205 60L-17.3205 40Z"/>' +
    '</pattern></defs><rect width="100%" height="100%" fill="url(#hex-pattern)"/></svg>';
}

// Insert (or move) the overlay into the current #mapFrame, beneath the markers. Called
// from buildMap so it survives the frame being cleared.
function mountHexGrid() {
  const frame = document.getElementById('mapFrame');
  if (!frame) return;
  let el = frame.querySelector('#hex-grid-overlay');
  if (!el) {
    const tmp = document.createElement('div');
    tmp.innerHTML = hexPatternSvg();
    el = tmp.firstChild;
    // keep it as the first child so it sits under markers (which are appended after)
    frame.insertBefore(el, frame.firstChild);
  }
  hexGridEl = el;
  applyHexGrid();
}

function applyHexGrid() {
  if (hexGridEl) {
    hexGridEl.classList.toggle('hidden', !hexGrid.on);
    const pattern = hexGridEl.querySelector('#hex-pattern');
    if (pattern) pattern.setAttribute('patternTransform', 'scale(' + (hexGrid.scale / 34.641) + ')');
    // Anchor the grid overlay to the DISPLAYED image box (not the whole frame), so the pattern's
    // (0,0) origin is the image's top-left pixel and the grid never spills into the letterbox.
    // Tokens use the same box (see hexToPct), so grid + tokens share one coordinate system.
    const box = (typeof mapImageBox === 'function') ? mapImageBox() : null;
    if (box) {
      hexGridEl.style.left   = box.left + 'px';
      hexGridEl.style.top    = box.top + 'px';
      hexGridEl.style.width  = box.w + 'px';
      hexGridEl.style.height = box.h + 'px';
    }
  }
  const btn = document.getElementById('hexGridBtn');
  if (btn) btn.classList.toggle('hexgrid-on', hexGrid.on);
  const inp = document.getElementById('hexGridScale');
  if (inp && document.activeElement !== inp) inp.value = hexGrid.scale;
  // The grid cells just moved/resized → re-snap every token onto the new cell positions and
  // update their size (sizeHexes × the new cell width). Keeps tokens locked to the grid.
  if (typeof renderTokens === 'function') renderTokens();
}

// Read the CURRENT map's grid state (LOC_MAP is the active map's loc positions). A map
// with no saved grid defaults to off / 112px cell size.
function loadHexGridFromState() {
  const g = LOC_MAP['__hexgrid__'];
  if (g && typeof g === 'object') {
    hexGrid.on = !!g.on;
    hexGrid.scale = (Number.isFinite(g.scale) && g.scale > 0) ? Math.min(2000, Math.max(10, g.scale)) : 112;
  } else {
    hexGrid.on = false; hexGrid.scale = 112;   // no per-map state yet
  }
  applyHexGrid();
}

// DM only — persist the CURRENT map's grid + broadcast so players update. saveLocMap()
// routes to the right DB store for the active map (main vs extra).
function saveHexGrid() {
  if (!IS_DM) return;
  LOC_MAP['__hexgrid__'] = { on: hexGrid.on, scale: hexGrid.scale };
  saveLocMap();
}

function toggleHexGrid() {
  if (!IS_DM) return;
  hexGrid.on = !hexGrid.on;
  applyHexGrid();
  saveHexGrid();
}

function setHexScale(px) {
  if (!IS_DM) return;
  const n = parseFloat(px);
  if (!Number.isFinite(n) || n <= 0) return;
  hexGrid.scale = Math.max(10, Math.min(2000, Math.round(n)));
  applyHexGrid();
  clearTimeout(_hexSaveTimer);
  _hexSaveTimer = setTimeout(saveHexGrid, 300);   // debounce while scrubbing
}

function placeParty() {
  LOC_MAP['__party__'] = { x: 50, y: 50 };
  renderPartyMarker();
  saveLocMap();
}

// ─── MAP TOKENS ───────────────────────────────────────────────────────────────
// A GLOBAL pool of token definitions (from sheets) + PER-MAP instances. Instances live
// in the current map's LOC_MAP['__tokens__'] = [{poolId,q,r,sizeHexes}]. Movement uses the
// translate-glide model: the mover drags locally (no network); on drop we snap to a hex
// cell and POST /api/tokens/move once; other viewers animate a single GPU transform.
let tokenPool = [];                 // [{id,npcId,name,image,defaultSizeHexes}]
let _myCharacterId = '';            // this player's assigned character npcId ('' for DM/anon)

// Slugify an id the same way the server does (npcIds are already slugs, but we normalise
// both sides so comparisons never fail on case/spacing).
function slug(raw) { return String(raw || '').toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g, '_').replace(/^_|_$/g, ''); }

function mapTokens() {
  if (!Array.isArray(LOC_MAP['__tokens__'])) LOC_MAP['__tokens__'] = [];
  return LOC_MAP['__tokens__'];
}
function poolToken(id) { return tokenPool.find(t => t.id === id) || null; }
// A player controls a token iff it was made from THEIR assigned character sheet — the same
// per-character mechanism that lets them edit that sheet. The server enforces this too.
function canControlToken(pt) {
  return IS_DM || (!!pt && !!_myCharacterId && slug(pt.npcId || '') === slug(_myCharacterId));
}

// Load the global token pool + this player's assigned character (for the control check),
// then render.
function loadTokenPool() {
  fetch('/api/whoami').then(r => r.json()).then(a => { _myCharacterId = (a.player && a.player.characterId) || ''; renderTokens(); }).catch(() => {});
  fetch('/api/tokens').then(r => r.json()).then(d => { tokenPool = Array.isArray(d.pool) ? d.pool : []; renderTokens(); }).catch(() => {});
  ensureFrameResizeObserver();
}

// Tokens are positioned as a % of the frame, which is only correct once the frame has laid out
// to the image's aspect ratio. The image loads async, so the FIRST buildMap() renders tokens
// against a stale frame size → they land off the grid. A ResizeObserver re-snaps every token the
// moment the frame settles to its real size (and on any later window resize), so a token always
// sits on its grid cell regardless of layout timing. Cheap: only fires on actual box changes.
let _frameResizeObs = null;
function ensureFrameResizeObserver() {
  if (_frameResizeObs || typeof ResizeObserver === 'undefined') return;
  const frame = document.getElementById('mapFrame');
  if (!frame) return;
  let raf = 0;
  _frameResizeObs = new ResizeObserver(() => {
    // Coalesce bursts of resize callbacks into one render on the next frame.
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; renderTokens(); });
  });
  _frameResizeObs.observe(frame);
}

// ── Token picker (DM): choose a sheet → create/reuse a pool token → place it on this map. ──
let _tkpSheets = null;   // cached sheet list + player assignments for the picker
function openTokenPicker() {
  if (!IS_DM) return;
  document.getElementById('tokenPickerModal').style.display = 'flex';
  document.getElementById('tkpSearch').value = '';
  Promise.all([
    fetch('/api/npc-sheets').then(r => r.json()).catch(() => ({ sheets: [] })),
    fetch('/api/players').then(r => r.json()).catch(() => ({ players: [] }))
  ]).then(([s, p]) => {
    _tkpSheets = { sheets: (s.sheets || []), players: (p.players || []) };
    renderTokenPickerList('');
  });
  setTimeout(() => document.getElementById('tkpSearch').focus(), 40);
}
function closeTokenPicker() { document.getElementById('tokenPickerModal').style.display = 'none'; }

function renderTokenPickerList(q) {
  const list = document.getElementById('tkpList');
  if (!list || !_tkpSheets) return;
  q = (q || '').toLowerCase().trim();
  const placed = new Set(mapTokens().map(t => (poolToken(t.poolId) || {}).npcId).filter(Boolean));
  list.innerHTML = '';
  _tkpSheets.sheets
    .filter(sh => !q || (sh.name || '').toLowerCase().includes(q))
    .slice(0, 200)
    .forEach(sh => {
      const item = document.createElement('div');
      item.className = 'tkp-item' + (placed.has(sh.npcId) ? ' placed' : '');
      const owner = _tkpSheets.players.find(pl => slug(pl.characterId || '') === slug(sh.npcId));
      item.innerHTML =
        (sh.image ? `<img src="${sh.image.replace(/"/g, '&quot;')}" alt="">` : `<div class="tkp-noimg">${escHtml((sh.name || '?').charAt(0))}</div>`) +
        `<div><div class="tkp-item-name">${escHtml(sh.name || '(unnamed)')}</div>` +
        `<div class="tkp-item-sub">${sh.type === 'monster' ? 'Monster' : 'Character'}${owner ? ' · ' + escHtml(owner.name) : ''}</div></div>`;
      item.addEventListener('click', () => placeTokenFromSheet(sh));
      list.appendChild(item);
    });
  if (!list.children.length) list.innerHTML = '<div class="tkp-hint">No matching sheet.</div>';
}

// Create the pool token for this sheet (if new) + drop an instance at the map centre.
// Control isn't stored on the token — it's derived live from the sheet's player assignment
// (canControlToken/canEditCharacter), so re-assigning a character updates control automatically.
function placeTokenFromSheet(sh) {
  // Find or make the pool token keyed by source sheet npcId.
  let pt = tokenPool.find(t => t.npcId === sh.npcId);
  if (!pt) {
    pt = {
      id: 'tok_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5),
      npcId: sh.npcId, name: sh.name || 'Token', image: sh.image || '', defaultSizeHexes: 1
    };
    tokenPool.push(pt);
    saveTokenPool();   // persist the new pool token globally
  }
  // Place (or re-centre) an instance on the CURRENT map at its centre cell.
  // Use the IMAGE box centre (hex coords are image-box-relative), not the frame centre.
  const box = mapImageBox() || (function(){ const r = document.getElementById('mapFrame').getBoundingClientRect(); return { w: r.width, h: r.height }; })();
  const cell = pixelToHex(box.w / 2, box.h / 2);
  const tokens = mapTokens();
  let inst = tokens.find(t => t.poolId === pt.id);
  if (!inst) { inst = { poolId: pt.id, q: cell.q, r: cell.r, sizeHexes: pt.defaultSizeHexes || 1 }; tokens.push(inst); }
  else { inst.q = cell.q; inst.r = cell.r; }
  saveLocMap();      // persist + broadcast the instance on this map
  renderTokens();
  closeTokenPicker();
}

function saveTokenPool() {
  if (!IS_DM) return;
  fetch('/api/tokens', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pool: tokenPool }) }).catch(() => {});
}

// Remove a token instance from THIS map (DM). (Pool token stays for reuse elsewhere.)
function removeTokenFromMap(poolId) {
  if (!IS_DM) return;
  const tokens = mapTokens();
  const i = tokens.findIndex(t => t.poolId === poolId);
  if (i < 0) return;
  tokens.splice(i, 1);
  saveLocMap();
  renderTokens();
}

// ── pointy-top hex geometry (see derivation): scale = hex width (flat-to-flat) in px.
// One hex: width w = scale; height h = scale*2/√3; row spacing 0.75*h... using axial offset.
// Hex geometry EXACTLY matching the on-screen SVG grid pattern. The pattern's cell centres
// (in px, from the pattern path scaled by hexGrid.scale/34.641) are:
//   x = q*w + (r even ? w/2 : 0)        y = h/2 + r*rowH
// where w = hexGrid.scale (horizontal cell spacing), h = w*2/√3 (vertex-to-vertex height),
// rowH = 0.75*h (row-to-row vertical spacing). This makes tokens snap onto the visible cells.
function hexGeom() {
  const w = hexGrid.scale;
  const h = w * 2 / Math.sqrt(3);
  return { w, h, rowH: h * 0.75 };
}
// Pixel (relative to frame, in px) → nearest hex cell {q,r} (offset coords: r=row, q=col).
function pixelToHex(px, py) {
  const g = hexGeom();
  let r = Math.round((py - g.h / 2) / g.rowH);
  const xoff = (r & 1) ? 0 : g.w / 2;   // even rows are shifted right by w/2 (matches the pattern)
  let q = Math.round((px - xoff) / g.w);
  return { q, r };
}
// Hex cell {q,r} → pixel CENTRE relative to the frame (px) — the centre of the visible cell.
function hexToPixel(q, r) {
  const g = hexGeom();
  const xoff = (r & 1) ? 0 : g.w / 2;
  return { x: q * g.w + xoff, y: g.h / 2 + r * g.rowH };
}

// The rendered pixel size of the map frame (its content box).
function frameRenderSize() {
  const frame = document.getElementById('mapFrame');
  if (!frame) return null;
  const rect = frame.getBoundingClientRect();
  if (!rect.width || !rect.height) return null;
  return { w: rect.width, h: rect.height };
}

// The DISPLAYED image rectangle inside the frame, in frame-relative px. The frame paints the
// map with background-size:contain + position:center, so the image is scaled to FIT and any
// leftover space becomes a centred letterbox. The grid and tokens must be anchored to THIS box
// (its top-left is the image's first pixel), not the frame — otherwise the grid draws over the
// letterbox and tokens drift off the image. Falls back to the whole frame when the natural size
// isn't known yet. Returns { left, top, w, h }.
function mapImageBox() {
  const size = frameRenderSize();
  if (!size) return null;
  const nat = _mapNaturalSizes[getActiveMapUrl()];
  if (!nat || !nat.w || !nat.h) return { left: 0, top: 0, w: size.w, h: size.h };
  // contain-fit: scale so the whole image fits; the tighter dimension letterboxes.
  const scale = Math.min(size.w / nat.w, size.h / nat.h);
  const w = nat.w * scale, h = nat.h * scale;
  return { left: (size.w - w) / 2, top: (size.h - h) / 2, w, h };
}

// Convert a hex-centre px (relative to the IMAGE box) → percentage of the FRAME. Tokens are
// positioned with left/top:% of the frame, so we add the image box's offset then divide by the
// frame size. This puts the token on exactly the cell the grid draws (both anchored to the image).
function hexToPct(q, r) {
  const size = frameRenderSize();
  const box  = mapImageBox();
  if (!size || !box) return { x: 50, y: 50 };
  const p = hexToPixel(q, r);
  return { x: ((box.left + p.x) / size.w) * 100, y: ((box.top + p.y) / size.h) * 100 };
}

// ── render all token instances into #mapFrame (called from buildMap, after the frame is
// cleared, so tokens sit above the hex grid and markers). Each token = a positioned el with
// the sheet portrait sized to sizeHexes cells, plus a name label and (for controllers) a
// resize handle. Position is set via transform:translate so live moves glide on the GPU.
function renderTokens() {
  const frame = document.getElementById('mapFrame');
  if (!frame) return;
  frame.querySelectorAll('.map-token').forEach(t => t.remove());
  const rect = frame.getBoundingClientRect();
  mapTokens().forEach(inst => {
    const pt = poolToken(inst.poolId);
    if (!pt) return;   // orphaned instance (pool token deleted) — skip
    const el = document.createElement('div');
    el.className = 'map-token';
    el.dataset.poolId = inst.poolId;
    const controllable = canControlToken(pt);
    if (controllable) el.classList.add('token-movable');
    // A REGULAR pointy-top hexagon: width = sizeHexes × hex width; height = width × 2/√3
    // (≈1.1547) so all six sides are equal and it matches the hex grid cells exactly.
    const hexW = Math.max(12, (inst.sizeHexes || 1) * hexGrid.scale);
    const hexH = hexW * 2 / Math.sqrt(3);
    const pct = hexToPct(inst.q, inst.r);
    el.style.left = pct.x + '%';
    el.style.top  = pct.y + '%';
    // A hexagonal frame (coloured backing hex = the ring) with the portrait hex on top.
    const inner = pt.image
      ? `<img class="map-token-img" src="${pt.image.replace(/"/g, '&quot;')}" alt="" draggable="false">`
      : `<div class="map-token-img map-token-noimg">${escHtml((pt.name || '?').charAt(0))}</div>`;
    el.innerHTML =
      `<div class="map-token-hex" style="width:${hexW}px;height:${hexH}px">${inner}</div>` +
      (controllable ? '<div class="map-token-resize" title="Drag to resize (snaps to hex)"></div>' : '') +
      `<div class="map-token-name">${escHtml(pt.name || '')}</div>`;
    el._inst = inst; el._pt = pt;
    if (controllable) wireTokenInteract(el, inst, pt);
    frame.appendChild(el);
  });
}

// ── drag (local 60fps) + drop (snap + one network message), and corner resize.
let _tokenDrag = null;   // { el, inst, startX, startY, moved }
function wireTokenInteract(el, inst, pt) {
  const handle = el.querySelector('.map-token-resize');

  // DM: right-click removes this token instance from the current map (pool token kept).
  if (IS_DM) {
    el.addEventListener('contextmenu', ev => {
      ev.preventDefault();
      if (confirm('Remove "' + (pt.name || 'token') + '" from this map?')) removeTokenFromMap(inst.poolId);
    });
  }

  // Move: pointer-drag the token body. No network during the drag — only on drop.
  el.addEventListener('pointerdown', ev => {
    if (ev.button !== 0) return;
    if (handle && ev.target === handle) return;   // resize handled separately
    ev.preventDefault(); ev.stopPropagation();
    const frame = document.getElementById('mapFrame');
    const rect = frame.getBoundingClientRect();
    _tokenDrag = { el, inst, rect, moved: false };
    el.classList.add('token-dragging');
    el.style.transition = 'none';   // follow the cursor instantly while dragging
    el.setPointerCapture(ev.pointerId);
  });
  el.addEventListener('pointermove', ev => {
    if (!_tokenDrag || _tokenDrag.el !== el) return;
    const { rect } = _tokenDrag;
    const px = ev.clientX - rect.left, py = ev.clientY - rect.top;
    el.style.left = Math.max(0, Math.min(100, (px / rect.width) * 100)) + '%';
    el.style.top  = Math.max(0, Math.min(100, (py / rect.height) * 100)) + '%';
    _tokenDrag.moved = true;
  });
  el.addEventListener('pointerup', ev => {
    if (!_tokenDrag || _tokenDrag.el !== el) return;
    const { rect, moved } = _tokenDrag;
    el.classList.remove('token-dragging');
    el.style.transition = '';
    _tokenDrag = null;
    if (!moved) return;
    // Snap the drop point to the nearest hex cell, update locally, and send ONE message.
    // pixelToHex expects IMAGE-box-relative px, so subtract the letterbox offset first.
    const box = mapImageBox() || { left: 0, top: 0 };
    const px = ev.clientX - rect.left - box.left, py = ev.clientY - rect.top - box.top;
    const cell = pixelToHex(px, py);
    inst.q = cell.q; inst.r = cell.r;
    const pct = hexToPct(inst.q, inst.r);
    el.style.left = pct.x + '%'; el.style.top = pct.y + '%';   // settle onto the cell centre
    sendTokenMove(inst);
  });

  // Resize: drag the corner handle; size snaps to whole hex multiples (1×,2×,3×…).
  if (handle) {
    handle.addEventListener('pointerdown', ev => {
      if (ev.button !== 0) return;
      ev.preventDefault(); ev.stopPropagation();
      const frame = document.getElementById('mapFrame');
      const rect = frame.getBoundingClientRect();
      const tokRect = el.getBoundingClientRect();
      const cx = tokRect.left + tokRect.width / 2, cy = tokRect.top + tokRect.height / 2;
      const onMove = e => {
        const dist = Math.max(Math.abs(e.clientX - cx), Math.abs(e.clientY - cy)) * 2;   // full width
        const hexes = Math.max(1, Math.min(6, Math.round(dist / hexGrid.scale)));
        el.style.width = (hexes * hexGrid.scale) + 'px';
        el.style.height = (hexes * hexGrid.scale) + 'px';
        el.dataset.pendingSize = hexes;
      };
      const onUp = () => {
        window.removeEventListener('pointermove', onMove);
        window.removeEventListener('pointerup', onUp);
        const hexes = parseInt(el.dataset.pendingSize, 10) || inst.sizeHexes || 1;
        if (hexes !== inst.sizeHexes) { inst.sizeHexes = hexes; sendTokenMove(inst); }
      };
      window.addEventListener('pointermove', onMove);
      window.addEventListener('pointerup', onUp);
    });
  }
}

// Persist + broadcast one token instance's position/size. DM saves the whole map (saveLocMap);
// a player posts just their move to the dmOrOwner-gated endpoint.
function sendTokenMove(inst) {
  if (IS_DM) {
    saveLocMap();   // rides the town-state / extra-map save + broadcast
  } else {
    fetch('/api/tokens/move', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ town: TOWN_SLUG_API, mapIndex: activeMapIndex, poolId: inst.poolId, q: inst.q, r: inst.r, sizeHexes: inst.sizeHexes })
    }).catch(() => {});
  }
}

// ── live glide: apply a remote token move by animating the token to its new cell.
function applyRemoteTokenMove(d) {
  if (slug(d.town || '') !== slug(TOWN_SLUG_API)) return;
  if ((parseInt(d.mapIndex, 10) || 0) !== activeMapIndex) {
    // Not the visible map — just update the underlying instance list quietly if it's ours.
    return;
  }
  const tokens = mapTokens();
  let inst = tokens.find(t => t.poolId === d.poolId);
  if (!inst) { inst = { poolId: d.poolId, q: d.q, r: d.r, sizeHexes: d.sizeHexes || 1 }; tokens.push(inst); renderTokens(); return; }
  inst.q = d.q; inst.r = d.r; if (d.sizeHexes) inst.sizeHexes = d.sizeHexes;
  const el = document.querySelector('.map-token[data-pool-id="' + CSS.escape(d.poolId) + '"]');
  if (!el) { renderTokens(); return; }
  // Animate to the new cell (transform-free % move on a transition — GPU-composited).
  const pct = hexToPct(inst.q, inst.r);
  el.style.transition = 'left .35s ease, top .35s ease, width .2s, height .2s';
  el.style.left = pct.x + '%'; el.style.top = pct.y + '%';
  el.style.width = (inst.sizeHexes * hexGrid.scale) + 'px';
  el.style.height = (inst.sizeHexes * hexGrid.scale) + 'px';
}

// ─── MAIN BUILD ──────────────────────────────────────────────────────────────
function build() {
  if (typeof TOWN_NAME === 'undefined') { console.error('Content file not loaded'); return; }
  initHouseMap();
  initLocMap();
  initPartyMarker();
  loadPlayerVisibility();

  loadHexGridFromState();   // grid state (global) is in serverState by now; apply it
  loadTokenPool();          // the global token pool (used to render map-token instances)

  // DM mode UI elements
  if (IS_DM) {
    document.getElementById('dmHeaderGroup').style.display = '';
    document.getElementById('mapEditBtn').style.display    = '';
    document.getElementById('newMenuWrap').style.display   = '';
    document.getElementById('hexGridWrap').style.display   = '';   // Hex Grid control (DM only)

    const visSelect = document.getElementById('visFilterSelect');
    visSelect.style.display = '';
    visSelect.addEventListener('change', () => {
      visFilter = visSelect.value;
      applyFilters();
    });
  }

  document.title = `${TOWN_NAME} — NPC Registry`;
  document.getElementById('headerTitle').textContent    = TOWN_NAME;
  document.getElementById('headerSubtitle').textContent =
    (IS_DM ? 'DM Mode · ' : '') + `NPC Registry — Households 1–${HOUSEHOLDS.length} of ${TOWN_TOTAL_HOMES}`;

  rebuildContent();
  setupNpcZoomModal();
  setMapLabelsVisible(mapLabelsVisible);

  document.getElementById('npcToolBtn').addEventListener('click',   () => window.open(npcToolUrl({ town: TOWN_SLUG_API }), '_blank'));
  document.getElementById('mapLabelsBtn').addEventListener('click', () => setMapLabelsVisible(!mapLabelsVisible));
  document.getElementById('mapEditBtn').addEventListener('click',   () => toggleMapEditMode());
  document.getElementById('hexGridBtn').addEventListener('click',   () => toggleHexGrid());
  document.getElementById('hexGridScale').addEventListener('input', e => setHexScale(e.target.value));
  document.getElementById('mapSwitchBtn').addEventListener('click', e => {
    e.stopPropagation();
    const dd = document.getElementById('mapSwitchDropdown');
    dd.style.display = dd.style.display === 'none' ? '' : 'none';
  });
  document.getElementById('newMenuBtn').addEventListener('click', e => {
    e.stopPropagation();
    const dd = document.getElementById('newMenuDropdown');
    dd.style.display = dd.style.display === 'none' ? '' : 'none';
  });
  document.getElementById('newPremisesItem').addEventListener('click', () => {
    document.getElementById('newMenuDropdown').style.display = 'none';
    addPremises();
  });
  document.getElementById('newLabelItem').addEventListener('click', () => {
    document.getElementById('newMenuDropdown').style.display = 'none';
    addTownLabel();
  });
  document.getElementById('newMapItem').addEventListener('click', () => {
    document.getElementById('newMenuDropdown').style.display = 'none';
    addExtraMap();
  });
  document.getElementById('newPartyItem').addEventListener('click', () => {
    document.getElementById('newMenuDropdown').style.display = 'none';
    placeParty();
  });
  document.getElementById('newTokenItem').addEventListener('click', () => {
    document.getElementById('newMenuDropdown').style.display = 'none';
    openTokenPicker();
  });
  document.getElementById('tkpClose').addEventListener('click', closeTokenPicker);
  document.getElementById('tkpBackdrop').addEventListener('click', closeTokenPicker);
  document.getElementById('tkpSearch').addEventListener('input', e => renderTokenPickerList(e.target.value));
  document.addEventListener('click', e => {
    const newWrap   = document.getElementById('newMenuWrap');
    const mapSwWrap = document.getElementById('mapSwitchWrap');
    if (newWrap && !newWrap.contains(e.target))
      document.getElementById('newMenuDropdown').style.display = 'none';
    if (mapSwWrap && !mapSwWrap.contains(e.target)) {
      const dd = document.getElementById('mapSwitchDropdown');
      if (dd) dd.style.display = 'none';
    }
  });

  // Shared fixed-position tooltip for map markers
  if (!document.getElementById('map-tooltip')) {
    const tip = document.createElement('div');
    tip.id = 'map-tooltip';
    document.body.appendChild(tip);
  }

  initSearch();
  connectSSE();
  startPlayerPolling();
  setupCombatAttacksPanel();
}

// The town map tool hosts BOTH shared combat panels: INITIATIVE (round tracker, DM
// controls) and ATTACKS (player = own char's attacks; DM = active combatant's).
function setupCombatAttacksPanel() {
  fetch('/api/whoami').then(r => r.json()).catch(() => ({})).then(auth => {
    window.CombatPanel = { config: {
      isDM: IS_DM,
      myCharacterId: (auth.player && auth.player.characterId) || '',
      panels: 'both',
      diceRoll: window.DiceRoll || null
    } };
    const s = document.createElement('script'); s.src = '/combat-panel.js'; document.body.appendChild(s);
