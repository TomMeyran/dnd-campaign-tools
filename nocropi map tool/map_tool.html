// ─── NPC PORTRAIT ZOOM MODAL ─────────────────────────────────────────────────
let _npcZoom = 100, _npcZoomFitW = 0, _npcZoomFitH = 0;
let _zoomModal, _zoomImg, _zoomViewport, _zoomTitle, _zoomSlider, _zoomPct;

function setupNpcZoomModal() {
  _zoomModal    = document.getElementById('npcZoomModal');
  _zoomImg      = document.getElementById('npcZoomImg');
  _zoomViewport = document.getElementById('npcZoomViewport');
  _zoomTitle    = document.getElementById('npcZoomTitle');
  _zoomSlider   = document.getElementById('npcZoomSlider');
  _zoomPct      = document.getElementById('npcZoomPct');

  document.getElementById('npcZoomClose').addEventListener('click', closeNpcZoomModal);
  document.getElementById('npcZoomBackdrop').addEventListener('click', closeNpcZoomModal);
  _zoomSlider.addEventListener('input', () => { _npcZoom = Number(_zoomSlider.value); applyNpcZoom(); });
  document.getElementById('npcZoomOut').addEventListener('click', () => {
    _npcZoom = Math.max(50,  _npcZoom - 10); _zoomSlider.value = _npcZoom; applyNpcZoom();
  });
  document.getElementById('npcZoomIn').addEventListener('click', () => {
    _npcZoom = Math.min(200, _npcZoom + 10); _zoomSlider.value = _npcZoom; applyNpcZoom();
  });
  _zoomViewport.addEventListener('wheel', e => {
    e.preventDefault();
    _npcZoom = Math.max(50, Math.min(200, _npcZoom + (e.deltaY < 0 ? 10 : -10)));
    _zoomSlider.value = _npcZoom; applyNpcZoom();
  }, { passive: false });
}

function openNpcZoomModal(src, name) {
  if (!src) return;
  _zoomTitle.textContent = name || 'Portrait';
  _npcZoom = 100;
  _zoomSlider.value = 100;
  _zoomImg.onload = () => {
    const vw = _zoomViewport.clientWidth  - 32;
    const vh = _zoomViewport.clientHeight - 32;
    const scale = Math.min(vw / _zoomImg.naturalWidth, vh / _zoomImg.naturalHeight, 1);
    _npcZoomFitW = Math.round(_zoomImg.naturalWidth  * scale);
    _npcZoomFitH = Math.round(_zoomImg.naturalHeight * scale);
    applyNpcZoom();
  };
  _zoomImg.src = '';  // reset to force onload even when src is unchanged (cached image)
  _zoomImg.src = src;
  _zoomModal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
}

function closeNpcZoomModal() {
  _zoomModal.style.display = 'none';
  document.body.style.overflow = '';
}

function applyNpcZoom() {
  _zoomImg.style.width  = Math.round(_npcZoomFitW * _npcZoom / 100) + 'px';
  _zoomImg.style.height = Math.round(_npcZoomFitH * _npcZoom / 100) + 'px';
  _zoomPct.textContent = _npcZoom + '%';
}

// ─── MAIN TAB SWITCHING (Map / Lore) ─────────────────────────────────────────
function switchMapMainTab(tab) {
  document.querySelectorAll('.map-main-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.maptab === tab));
  document.querySelectorAll('.map-main-pane').forEach(pane => pane.classList.toggle('active', pane.id === 'maptab-' + tab));
}

// ─── LORE NOTES ──────────────────────────────────────────────────────────────
let _loreSeed = 0;
let _loreSaveTimer = null;

function saveLoreNotes() {
  clearTimeout(_loreSaveTimer);
  _loreSaveTimer = setTimeout(pushState, 500);
}

function rebuildLoreNotes() {
  const list = document.getElementById('loreNotesList');
  if (!list) return;
  list.innerHTML = '';
  (serverState.loreNotes || []).forEach(note => appendLoreNoteItem(note));
}

function addLoreNote() {
  const note = { id: Date.now() + (_loreSeed++), label: 'New Note', value: '', shared: false, attachment: null };
  serverState.loreNotes.push(note);
  appendLoreNoteItem(note);
  saveLoreNotes();
}

function appendLoreNoteItem(note) {
  if (note.shared === undefined) note.shared = false;
  if (note.attachment === undefined) note.attachment = null;
  const list = document.getElementById('loreNotesList');
  const item = document.createElement('div');
  item.className = 'note-item';

  item.innerHTML = `
    <div class="note-header">
      <input class="note-label-input" type="text" value="${escHtml(note.label || '')}">
      <button type="button" class="send-players-btn${note.shared ? ' sent' : ''}">${note.shared ? '● Shared' : '○ Hidden'}</button>
      <button type="button" class="note-remove-btn" title="Remove note">✕</button>
    </div>
    <div class="note-body">
      <textarea class="note-value-input">${escHtml(note.value || '')}</textarea>
      <div class="note-attach-row"></div>
    </div>`;

  const labelInput = item.querySelector('.note-label-input');
  const valueInput = item.querySelector('.note-value-input');
  const sendBtn    = item.querySelector('.send-players-btn');
  const removeBtn  = item.querySelector('.note-remove-btn');
  const attachRow  = item.querySelector('.note-attach-row');

  labelInput.addEventListener('input', () => { note.label = labelInput.value; saveLoreNotes(); });
  valueInput.addEventListener('input', () => { note.value = valueInput.value; saveLoreNotes(); });

  sendBtn.addEventListener('click', () => {
    note.shared = !note.shared;
    sendBtn.classList.toggle('sent', note.shared);
    sendBtn.textContent = note.shared ? '● Shared' : '○ Hidden';
    saveLoreNotes();
  });

  removeBtn.addEventListener('click', () => {
    if (note.attachment && note.attachment.url) deleteMapAttachment('lore-' + TOWN_SLUG_API, note.attachment.url);
    serverState.loreNotes = serverState.loreNotes.filter(n => n !== note);
    item.remove();
    saveLoreNotes();
  });

  renderLoreAttachment(attachRow, note);
  list.appendChild(item);
}

function renderLoreAttachment(row, note) {
  row.innerHTML = '';
  const att = note.attachment;
  if (att && att.url) {
    const wrap = document.createElement('div');
    wrap.className = 'note-att';
    renderMapAttachment(wrap, att, () => {
      deleteMapAttachment('lore-' + TOWN_SLUG_API, att.url);
      note.attachment = null;
      renderLoreAttachment(row, note);
      saveLoreNotes();
    });
    row.appendChild(wrap);
  } else {
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'note-att-add';
    btn.textContent = '＋ Attach image / PDF';
    btn.addEventListener('click', () =>
      pickMapAttachment('lore-' + TOWN_SLUG_API, note, () => renderLoreAttachment(row, note), saveLoreNotes)
    );
    row.appendChild(btn);
  }
}

// Wire lore tab on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.map-main-tab-btn').forEach(btn => {
    btn.addEventListener('click', () => switchMapMainTab(btn.dataset.maptab));
  });
  document.getElementById('addLoreNoteBtn')?.addEventListener('click', addLoreNote);
});

// ─── MIGRATE ELEMENT BETWEEN MAPS ────────────────────────────────────────────
function _allMapLabels() {
  const labels = [{ index: 0, label: (typeof TOWN_NAME !== 'undefined' ? TOWN_NAME : 'Main') + ' Map' }];
  (EXTRA_MAPS || []).forEach((em, i) => labels.push({ index: i + 1, label: em.label || ('Map ' + (i + 1)) }));
  return labels;
}

function _buildMigrateDropdown(type, id, name) {
  const wrap = document.createElement('div');
  wrap.className = 'mig-wrap';
  const toggle = document.createElement('button');
  toggle.type = 'button';
  toggle.className = 'mig-toggle';
  toggle.textContent = '▾';
  toggle.title = 'Options';
  const menu = document.createElement('div');
  menu.className = 'mig-menu';
  // Remove item
  const rmItem = document.createElement('button');
  rmItem.type = 'button'; rmItem.className = 'mig-item mig-remove';
  rmItem.textContent = '✕ Remove';
  rmItem.addEventListener('click', e => {
    e.stopPropagation(); menu.classList.remove('open');
    if (type === 'house') removePremises(id, name);
    else removeTownLabel(id, name);
  });
  menu.appendChild(rmItem);
  // Migrate item (only if there are other maps)
  const allMaps = _allMapLabels();
  if (allMaps.length > 1) {
    const migItem = document.createElement('button');
    migItem.type = 'button'; migItem.className = 'mig-item';
    migItem.textContent = '→ Migrate';
    migItem.addEventListener('click', e => {
      e.stopPropagation(); menu.classList.remove('open');
      _showMigrateModal(type, id, name);
    });
    menu.appendChild(migItem);
  }
  toggle.addEventListener('click', e => {
    e.stopPropagation();
    document.querySelectorAll('.mig-menu.open').forEach(m => { if (m !== menu) m.classList.remove('open'); });
    menu.classList.toggle('open');
  });
  // Outside-click closing is handled once by the global handler below — do NOT
  // register a per-dropdown document listener here (buildSidebar runs on every
  // rebuild, so that would leak a listener per house/label each time).
  wrap.appendChild(toggle); wrap.appendChild(menu);
  return wrap;
}

function _showMigrateModal(type, id, name) {
  const modal = document.getElementById('migrateModal');
  const list  = document.getElementById('migrateMapList');
  const title = document.getElementById('migrateModalTitle');
  if (!modal || !list) return;
  title.textContent = `Migrate "${name}" to:`;
  list.innerHTML = '';
  _allMapLabels().filter(m => m.index !== activeMapIndex).forEach(m => {
    const btn = document.createElement('button');
    btn.className = 'migrate-map-btn';
    btn.textContent = m.label;
    btn.addEventListener('click', () => {
      _closeMigrateModal();
      if (type === 'house') _migrateHouse(id, m.index);
      else _migrateTownLabel(id, m.index);
    });
    list.appendChild(btn);
  });
  modal.classList.add('open');
}

function _closeMigrateModal() {
  const modal = document.getElementById('migrateModal');
  if (modal) modal.classList.remove('open');
}

function _getMapHouseholds(mapIndex) {
  if (mapIndex === 0) return _mainMapSnap.households || [];
  const em = EXTRA_MAPS[mapIndex - 1];
  if (!em) return [];
  if (!Array.isArray(em.households)) em.households = [];
  return em.households;
}

function _getMapLocations(mapIndex) {
  if (mapIndex === 0) return _mainMapSnap.townLocations || [];
  const em = EXTRA_MAPS[mapIndex - 1];
  if (!em) return [];
  if (!Array.isArray(em.townLocations)) em.townLocations = [];
  return em.townLocations;
}

function _migrateHouse(houseId, targetMapIndex) {
  const house = HOUSEHOLDS.find(h => h.id === houseId);
  if (!house) return;
  const targetHH = _getMapHouseholds(targetMapIndex);
  const maxId = targetHH.filter(h => !h.virtual).reduce((m, h) => Math.max(m, Number(h.id) || 0), 0);
  const clone = JSON.parse(JSON.stringify(house));
  clone.id = maxId + 1;
  targetHH.push(clone);
  saveTownContentToServer();
}

function _migrateTownLabel(locId, targetMapIndex) {
  const loc = TOWN_LOCATIONS.find(l => l.id === locId);
  if (!loc) return;
  const targetLL = _getMapLocations(targetMapIndex);
  const maxId = targetLL.reduce((m, l) => Math.max(m, Number(l.id) || 0), 0);
  const clone = JSON.parse(JSON.stringify(loc));
  clone.id = maxId + 1;
  targetLL.push(clone);
  saveTownContentToServer();
}

document.addEventListener('click', e => {
  // Close any open migrate dropdown when clicking outside it (single global
  // handler — replaces the former per-dropdown listeners that leaked).
  document.querySelectorAll('.mig-menu.open').forEach(m => m.classList.remove('open'));
  const modal = document.getElementById('migrateModal');
  if (modal && e.target.id === 'migrateBackdrop') _closeMigrateModal();
});
document.getElementById('migrateCancelBtn')?.addEventListener('click', _closeMigrateModal);

</script>
