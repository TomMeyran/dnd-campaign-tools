<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NPC Registry</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">

<!-- Town data is loaded from the server DB via /api/town/:town -->

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
/* On-map label face for the party marker (served locally; same as the atlas). */
@font-face {
  font-family: 'Tribal Garamond';
  src: url('TribalGaramond.ttf') format('truetype');
  font-weight: normal; font-style: normal; font-display: swap;
}

:root {
  --ink: #1a1208;
  --ink2: #3d2e10;
  --ink3: #6b5230;
  --parchment: #f2e8cc;
  --parchment2: #e8d9b0;
  --parchment3: #dcc98a;
  --gold: #b8860b;
  --gold2: #d4a017;
  --accent: #5c3a1e;
  --water: #4a7fa5;
  --water2: #6ba3c4;
  --green: #3d6b2e;
  --red: #8b2020;
  --shadow: rgba(26,18,8,0.15);
}

body {
  background: #1c1408;
  font-family: 'Crimson Pro', serif;
  color: var(--ink);
  min-height: 100vh;
}

/* ── HEADER ── */
.site-header {
  background: #0e0a04;
  border-bottom: 2px solid var(--gold);
  padding: 1.2rem 2rem;
  display: flex;
  align-items: center;
  gap: 1.5rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.site-title {
  font-family: 'Cinzel', serif;
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--gold2);
  letter-spacing: 0.06em;
}

.site-subtitle {
  font-family: 'Crimson Pro', serif;
  font-style: italic;
  color: #a08040;
  font-size: 0.95rem;
}

.header-stats {
  margin-left: auto;
  display: flex;
  gap: 1.5rem;
}

.hstat { text-align: center; }

.hstat-num {
  font-family: 'Cinzel', serif;
  font-size: 1.2rem;
  color: var(--gold2);
  display: block;
}

.hstat-label {
  font-size: 0.72rem;
  color: #806030;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

/* ── LAYOUT ── */
.app {
  display: grid;
  grid-template-columns: 280px 1fr;
  min-height: calc(100vh - 70px);
}

/* ── SIDEBAR ── */
.sidebar {
  background: #110e06;
  border-right: 1px solid #3a2a0a;
  overflow-y: auto;
  padding: 1rem 0;
  max-height: calc(100vh - 70px);
  position: sticky;
  top: 70px;
}

.sidebar-section {
  padding: 0.5rem 1rem 0.3rem;
  font-family: 'Cinzel', serif;
  font-size: 0.65rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: #604a20;
}

.house-btn {
  width: 100%;
  background: none;
  border: none;
  border-left: 3px solid transparent;
  padding: 0.6rem 1.2rem 0.6rem 1rem;
  text-align: left;
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  align-items: flex-start;
  gap: 0.6rem;
}

.house-btn:hover { background: rgba(180,130,20,0.08); }

.house-btn.active {
  background: rgba(180,130,20,0.14);
  border-left-color: var(--gold2);
}

.hb-num {
  font-family: 'Cinzel', serif;
  font-size: 0.7rem;
  color: #604a20;
  min-width: 22px;
  padding-top: 2px;
}

.hb-name {
  font-family: 'Cinzel', serif;
  font-size: 0.82rem;
  color: #c8a040;
  display: block;
  line-height: 1.2;
}

.hb-detail {
  font-size: 0.75rem;
  color: #705a30;
  font-style: italic;
  display: block;
}

/* sidebar player-hidden dim (DM mode only) */
.house-btn.sb-hidden .hb-name   { color: #5a4425; }
.house-btn.sb-hidden .hb-detail { color: #3e2e18; }
.house-btn.sb-hidden .hb-num    { color: #3e2e18; }

.sb-row { display: flex; align-items: stretch; }
.sb-row .house-btn { flex: 1; min-width: 0; }

.house-remove-btn {
  background: none;
  border: none;
  color: #5a3010;
  padding: 0 0.55rem;
  cursor: pointer;
  font-size: 1rem;
  line-height: 1;
  opacity: 0;
  transition: opacity 0.15s, color 0.15s;
  flex-shrink: 0;
}
.sb-row:hover .house-remove-btn { opacity: 1; }
.house-remove-btn:hover { color: #c04020; }

.sb-loc-section {
  border-top: 1px solid #1e1608;
  margin-top: 0.3rem;
  padding-top: 0.55rem;
}

.loc-sb-item {
  padding: 0.38rem 1.2rem 0.38rem 1rem;
  display: flex;
  align-items: center;
  border-left: 3px solid transparent;
  transition: background 0.15s, border-color 0.15s;
  cursor: pointer;
}
.loc-sb-item:hover { background: rgba(160,128,64,0.1); }
.loc-sb-item.active { background: rgba(180,130,20,0.14); border-left-color: var(--gold2); }
.loc-sb-item .ls-remove {
  margin-left: auto;
  background: none;
  border: none;
  color: #7a5030;
  font-size: 0.85rem;
  cursor: pointer;
  opacity: 0;
  padding: 0 2px;
  line-height: 1;
  transition: opacity 0.15s, color 0.15s;
}
.loc-sb-item:hover .ls-remove { opacity: 1; }
.loc-sb-item .ls-remove:hover { color: #c04020; }

.loc-sb-item .ls-name {
  font-family: 'Cinzel', serif;
  font-size: 0.78rem;
  color: #a08040;
  font-style: italic;
}

.loc-sb-item.loc-search-highlight {
  background: rgba(180,130,20,0.14);
  border-left-color: var(--gold2);
}

/* ── MAIN CONTENT ── */
.main {
  background: #1c1408;
  overflow-y: auto;
  padding: 2rem 1rem;
}

/* ── HOUSE CARD ── */
.house-card {
  background: var(--parchment);
  border-radius: 4px;
  box-shadow: 0 4px 30px rgba(0,0,0,0.5), inset 0 0 60px rgba(139,105,20,0.06);
  margin-bottom: 0.5rem;
  overflow: hidden;
}

.house-header {
  background: var(--accent);
  padding: 1rem 1.5rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  cursor: pointer;
  user-select: none;
}

.house-header:hover { background: #6d4525; }

/* DM mode: dim house header when hidden from players */
.house-card.dm-hidden .house-header { background: #4d2a15; }
.house-card.dm-hidden .house-header:hover { background: var(--accent); }

.hh-num {
  font-family: 'Cinzel', serif;
  font-size: 0.75rem;
  color: #c8a060;
  min-width: 30px;
}

.hh-name {
  font-family: 'Cinzel', serif;
  font-size: 1.1rem;
  font-weight: 700;
  color: var(--parchment);
  flex: 1;
}

.hh-location {
  font-style: italic;
  font-size: 0.82rem;
  color: #c8a060;
  flex: 1;
}

.hh-count {
  font-family: 'Cinzel', serif;
  font-size: 0.78rem;
  color: #c8a060;
}

.hh-toggle {
  color: #c8a060;
  font-size: 1rem;
  transition: transform 0.2s;
}

.house-body {
  padding: 1.5rem;
  border-top: 2px solid var(--parchment3);
  display: none;
}

.house-body.open { display: block; }

.house-desc {
  font-style: italic;
  color: var(--ink3);
  font-size: 0.95rem;
  margin-bottom: 1.2rem;
  padding-bottom: 1rem;
  border-bottom: 1px solid var(--parchment3);
  line-height: 1.7;
}

/* ── NPC GRID ── */
.npc-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  align-items: start;
  gap: 1rem;
}

/* ── NPC CARD ── */
.npc-card {
  background: #faf3df;
  border: 1px solid var(--parchment3);
  border-radius: 3px;
  overflow: hidden;
  cursor: pointer;
  transition: box-shadow 0.15s;
}

.npc-card:hover { box-shadow: 0 3px 14px var(--shadow); }

/* DM mode: dim NPC card when hidden from players */
.npc-card.dm-hidden {
  border-left: 2px solid rgba(160,50,50,0.45);
  opacity: 0.75;
}

.npc-card-header {
  padding: 0.65rem 0.9rem;
  display: flex;
  align-items: center;
  gap: 0.6rem;
}

.npc-portrait-thumb {
  width: 34px; height: 34px;
  border-radius: 4px;
  object-fit: cover;
  border: 1px solid var(--parchment3);
  cursor: zoom-in;
  flex-shrink: 0;
  transition: border-color 0.12s;
}
.npc-portrait-thumb:hover { border-color: var(--ink3); }

/* ── NPC portrait zoom modal ── */
.npc-zoom-modal { position: fixed; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center; }
.npc-zoom-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.72); }
.npc-zoom-window { position: relative; background: #1a1208; border: 1px solid var(--parchment3); border-radius: 6px; box-shadow: 0 16px 60px rgba(0,0,0,0.85); display: flex; flex-direction: column; max-width: 90vw; max-height: 88vh; width: 680px; }
.npc-zoom-titlebar { display: flex; align-items: center; gap: 0.6rem; padding: 0.5rem 0.75rem; background: #0f0c06; border-bottom: 1px solid var(--parchment3); flex-shrink: 0; }
.npc-zoom-title { font-family: 'Cinzel', serif; font-size: 0.72rem; color: var(--ink); flex: 1; letter-spacing: 0.08em; }
.npc-zoom-close { background: none; border: none; color: var(--ink3); cursor: pointer; font-size: 0.9rem; padding: 2px 6px; border-radius: 2px; transition: color 0.12s; line-height: 1; }
.npc-zoom-close:hover { color: var(--ink); }
.npc-zoom-controls { display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.75rem; background: rgba(0,0,0,0.15); border-bottom: 1px solid var(--parchment3); flex-shrink: 0; }
.npc-zoom-pct { font-family: 'Cinzel', serif; font-size: 0.7rem; color: var(--ink2); min-width: 38px; text-align: center; }
.npc-zoom-slider { flex: 1; accent-color: var(--ink3); cursor: pointer; }
.npc-zoom-step { background: var(--parchment2); border: 1px solid var(--parchment3); color: var(--ink2); font-family: 'Cinzel', serif; font-size: 0.8rem; width: 26px; height: 26px; border-radius: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0; transition: background 0.12s; flex-shrink: 0; }
.npc-zoom-step:hover { background: var(--parchment3); }
.npc-zoom-viewport { overflow: auto; flex: 1; display: flex; align-items: flex-start; justify-content: flex-start; padding: 1rem; min-height: 0; }
.npc-zoom-img { display: block; transition: width 0.15s, height 0.15s; }

.race-badge {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.08em;
  padding: 2px 6px;
  border-radius: 2px;
  text-transform: uppercase;
  font-weight: 600;
  white-space: nowrap;
}

.npc-name-block { flex: 1; }

.npc-name {
  font-family: 'Cinzel', serif;
  font-size: 0.88rem;
  font-weight: 600;
  color: var(--ink);
  display: block;
}

.npc-role {
  font-size: 0.78rem;
  color: var(--ink3);
  font-style: italic;
  display: block;
}
.npc-role[contenteditable]:focus {
  outline: none;
  border-bottom: 1px dashed var(--ink3);
  font-style: normal;
}
.npc-role[contenteditable]:empty::before {
  content: 'profession…';
  color: var(--ink4, #bbb);
  font-style: italic;
}

.npc-age {
  font-family: 'Cinzel', serif;
  font-size: 0.68rem;
  color: var(--ink3);
}

.npc-card-body {
  padding: 0 0.9rem 0.8rem;
  display: none;
}

.npc-card-body.open { display: block; }

.npc-divider {
  border: none;
  border-top: 1px solid var(--parchment3);
  margin: 0.6rem 0;
}

.npc-backstory {
  font-size: 0.83rem;
  line-height: 1.65;
  color: var(--ink2);
  font-style: italic;
}

/* ── NPC SECTION DIVIDERS (DM mode) ── */
.npc-section {
  border-radius: 3px;
  padding: 0.4rem 0.55rem 0.15rem;
  margin-bottom: 0.45rem;
}
.npc-section-label {
  font-family: 'Cinzel', serif;
  font-size: 0.57rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 0.4rem;
  padding-bottom: 0.2rem;
  border-bottom: 1px solid currentColor;
  opacity: 0.7;
}
.player-section {
  background: rgba(50,130,70,0.07);
  border: 1px solid rgba(50,130,70,0.28);
}
.player-section .npc-section-label { color: #4a8a5a; }
.dm-section {
  background: rgba(160,60,20,0.07);
  border: 1px solid rgba(160,60,20,0.28);
}
.dm-section .npc-section-label { color: #b05030; }

/* ── INLINE EDIT FIELDS ── */
.npc-edit-field {
  width: 100%;
  background: transparent;
  border: 1px solid transparent;
  color: var(--ink2);
  font-family: 'Crimson Pro', serif;
  font-size: 0.83rem;
  line-height: 1.5;
  padding: 1px 3px;
  border-radius: 2px;
  resize: none;
  overflow: hidden;
  box-sizing: border-box;
  transition: border-color 0.12s, background 0.12s;
}
textarea.npc-edit-field {
  field-sizing: content;
  min-height: calc(1.5em + 4px);
}
.npc-edit-field:hover { border-color: rgba(100,80,40,0.3); background: rgba(255,255,240,0.55); }
.npc-edit-field:focus { outline: none; border-color: rgba(180,140,60,0.65); background: rgba(255,252,230,0.85); }
input.npc-edit-field { height: 1.7em; }

/* ── FIELD LABEL TEXTAREA (rename) ── */
.npc-field-label {
  font-family: 'Cinzel', serif;
  font-size: 0.62rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink3);
  background: transparent;
  border: 1px solid transparent;
  padding: 1px 3px;
  border-radius: 2px;
  width: 100%;
  box-sizing: border-box;
  resize: none;
  overflow: hidden;
  min-height: calc(1.5em + 4px);
  transition: border-color 0.12s, background 0.12s;
}
.npc-field-label:hover { border-color: rgba(100,80,40,0.3); background: rgba(255,255,240,0.4); }
.npc-field-label:focus { outline: none; border-color: rgba(180,140,60,0.65); background: rgba(255,252,230,0.75); }

/* ── REMOVE FIELD BUTTON ── */
.npc-field-remove {
  background: none;
  border: none;
  color: var(--ink3);
  cursor: pointer;
  font-size: 0.7rem;
  padding: 2px 5px;
  opacity: 0.35;
  transition: opacity 0.12s, color 0.12s;
  align-self: start;
  margin-top: 2px;
}
.npc-field-remove:hover { opacity: 1; color: var(--red); }

/* ── RACE COLORS ── */
.race-human     { background: #d4c4a0; color: #3d2e10; }
.race-highelf   { background: #c8d4e8; color: #1a2840; }
.race-woodelf   { background: #b8d4a0; color: #1a3010; }
.race-halfelf   { background: #d4c8e0; color: #2a1840; }
.race-halforc   { background: #b8c8a0; color: #1a2810; }
.race-dwarf     { background: #c8b898; color: #3d2010; }
.race-halfling  { background: #e8d4b0; color: #3d2800; }
.race-gnome     { background: #d4e8c8; color: #1a3018; }
.race-goliath   { background: #c0c8d8; color: #101828; }
.race-dragonborn{ background: #d8b8b0; color: #381010; }
.race-tiefling  { background: #c8b0d0; color: #280830; }
.race-owlbear   { background: #b8a888; color: #2a1a00; }
.race-beast     { background: #c0b890; color: #281800; }
.race-construct { background: #b8c8c8; color: #102020; }
.race-undead    { background: #b0b8a0; color: #101808; }
.loc-badge      { background: #c07020; color: #fff; }

/* ── EMPTY STATE ── */
.empty-state {
  text-align: center;
  padding: 4rem 2rem;
  color: #604a20;
}

.empty-state h2 {
  font-family: 'Cinzel', serif;
  font-size: 1.2rem;
  color: var(--gold);
  margin-bottom: 0.5rem;
}


/* ── MAP PANEL ── */
.map-panel {
  background: #110e06;
  border: 1px solid var(--parchment3);
  border-radius: 6px;
  margin-bottom: 1.5rem;
  overflow: hidden;
}

.map-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1rem 1.5rem;
  background: #0e0a04;
  color: var(--gold2);
  font-family: 'Cinzel', serif;
  letter-spacing: 0.08em;
}

.map-frame {
  position: relative;
  width: 100%;
  background-size: contain;
  background-position: center;
  background-repeat: no-repeat;
}
/* ── HEX GRID OVERLAY (imported from the atlas) ─────────────────
   Animated honeycomb drawn over the map image but beneath the markers.
   Stroke pulses black → red over 10s. */
#hex-grid-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
  opacity: 0.55;
}
#hex-grid-overlay.hidden { display: none; }
#hex-grid-overlay path { animation: hex-grid-color 10s ease-in-out infinite alternate; }
@keyframes hex-grid-color { from { stroke: #000000; } to { stroke: #e01818; } }
/* Hex Grid control popover (hover/focus, like the atlas cell-size box) */
.hexgrid-popover {
  position: absolute; top: 100%; left: 0; margin-top: 4px; min-width: 150px;
  background: #1c1206; border: 1px solid var(--seal-gold, #c8922a); border-radius: 4px;
  padding: 8px 10px; box-shadow: 0 6px 18px rgba(0,0,0,.55); z-index: 60; display: none;
}
#hexGridWrap:hover .hexgrid-popover, #hexGridWrap:focus-within .hexgrid-popover { display: block; }
.hexgrid-popover label { display: block; font-family: 'Cinzel', serif; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: #c8922a; margin-bottom: 4px; }
.hexgrid-popover input { width: 100%; background: #0e0a04; border: 1px solid #4a3a18; color: #f2e8cc; font-family: 'Cinzel', serif; font-size: 13px; padding: 4px 6px; border-radius: 3px; outline: none; }
.hexgrid-popover input:focus { border-color: var(--seal-gold, #c8922a); }
.hexgrid-hint { margin-top: 5px; font-size: 9px; font-style: italic; color: #8a744a; }
.house-map-btn.hexgrid-on { background: var(--seal-red, #8b2020); color: #fff; }
.map-frame.map-no-image {
  min-height: 180px;
  display: flex;
  align-items: center;
  justify-content: center;
  background-image: none !important;
  border: 2px dashed rgba(180,130,20,0.25);
  border-radius: 4px;
}
.map-frame.map-no-image::after {
  content: 'No map image — use the ▾ menu above to add one';
  font-family: 'Cinzel', serif;
  font-size: 0.82rem;
  font-style: italic;
  color: var(--ink3);
  letter-spacing: 0.04em;
  pointer-events: none;
}

.map-panel.edit-mode,
.map-panel.placement-mode {
  outline: 2px dashed rgba(212,160,23,0.75);
}

.map-panel.placement-mode { cursor: crosshair; }
.map-panel.placement-mode .map-marker:not(.ghost) { pointer-events: none; }

#placement-banner {
  display: none;
  background: #0e0a04;
  color: #c8a040;
  font-family: 'Cinzel', serif;
  font-size: 0.8rem;
  letter-spacing: 0.05em;
  padding: 0.4rem 1.5rem;
  text-align: center;
  border-top: 1px solid rgba(200,160,64,0.25);
}
.map-panel.placement-mode #placement-banner { display: block; }

.map-marker.ghost {
  opacity: 0.6;
  pointer-events: none;
  cursor: none;
}

.map-marker.editable { cursor: move; }

.map-marker.dragging {
  transform: translate(-50%, -50%) scale(1.35);
}

.map-marker {
  position: absolute;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #d43f3f;
  border: 2px solid #fff;
  transform: translate(-50%, -50%);
  cursor: pointer;
  transition: transform 0.15s, opacity 0.15s;
}

/* ── MAP TOKENS ── portrait tokens placed on the map, sized to N hex cells. Positioned by
   %; centred with translate(-50%,-50%). Live moves animate left/top on a transition (a
   discrete per-move event, cheap). will-change keeps them on their own compositor layer. */
.map-token {
  position: absolute;
  /* ── WHY TOKENS SIT ON THE GRID (the "tokens don't match the grid" fix) ──────────────────
     Symptom: a placed token was fine horizontally but sat a bit TOO HIGH — a small, constant
     vertical shift up, on every token regardless of cell or grid size.

     What I tried first (and why it DIDN'T work): I assumed the bug was in the coordinate math
     — that hexToPixel/hexToPct were computing the wrong cell centre. I "fixed" the hex geometry,
     added a ResizeObserver for layout timing, then anchored the grid to the image's contain-fit
     box (mapImageBox). None of it removed the shift, because the math was already correct: a
     pixel probe showed all six vertices of the first-row hex land exactly on the drawn grid
     lines. I was fixing the wrong layer.

     The ACTUAL cause was here, in CSS. This element used `display:flex; flex-direction:column`
     and contained the hexagon PLUS the name label stacked beneath it. `translate(-50%,-50%)`
     centres the WHOLE box on the cell — so it centred the hex+label COLUMN, not the hexagon.
     With the label below the hex, the column's centre falls below the hex's centre, which pushes
     the hexagon UP by ~half the label's height (≈7.5px). The label is horizontally centred, so
     x was never affected — exactly matching "ok horizontally, a bit too high".

     What works now (and why): the token box is EXACTLY the hexagon — no flex column. The name
     label is taken out of flow (position:absolute, top:100%, see .map-token-name), so it no
     longer contributes to the box's height. `translate(-50%,-50%)` now centres the HEXAGON on
     the cell. Measured shift went from −7.5px to 0.0px. */
  transform: translate(-50%, -50%);
  z-index: 20;
  touch-action: none; user-select: none;
  will-change: left, top;
}
/* Tokens are HEXAGONAL (pointy-top, matching the hex grid). Structure: .map-token-hex is a
   hexagon-clipped backing tinted the ring colour (gold, or blue when controllable); the
   portrait (.map-token-img) is a slightly-inset hexagon on top, so the backing shows as a
   coloured border all the way round. A drop-shadow gives the drop shadow (follows the clip). */
.map-token-hex {
  position: relative;
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  background: #f0d68a;                               /* the ring colour (gold by default) */
  filter: drop-shadow(0 2px 5px rgba(0,0,0,0.7));
}
.map-token .map-token-img {
  position: absolute; inset: 2px;                    /* 2px inset reveals the backing as a ring */
  width: calc(100% - 4px); height: calc(100% - 4px);
  clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
  object-fit: cover;
  background: #2a1e0c;
  display: block;
}
.map-token .map-token-noimg {
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cinzel', serif; font-weight: 700; color: #f0d68a;
  font-size: 1.4rem;
}
.map-token .map-token-name {
  /* Absolutely positioned just under the hex, centred, and OUT of the box's flow so it doesn't
     shift the hexagon's centre off the cell. */
  position: absolute;
  top: 100%; left: 50%; transform: translateX(-50%);
  margin-top: 3px;
  font-family: 'Cinzel', serif; font-size: 10px; font-weight: 600; letter-spacing: .04em;
  color: #ffe6a8; text-shadow: 0 0 3px #000, 0 0 6px #000;
  white-space: nowrap; pointer-events: none;
  max-width: 140px; overflow: hidden; text-overflow: ellipsis;
}
.map-token.token-movable { cursor: grab; }
.map-token.token-movable .map-token-hex { background: #9fd0ff; }   /* controllable → blue ring */
.map-token.token-dragging { cursor: grabbing; z-index: 40; }
.map-token.token-dragging .map-token-hex { filter: drop-shadow(0 0 4px #9fd0ff) drop-shadow(0 4px 10px rgba(0,0,0,0.8)); }
.map-token .map-token-resize {
  /* Anchored to the hex box's lower-right (the box is now just the hexagon). */
  position: absolute; right: -4px; bottom: -4px; width: 14px; height: 14px;
  border-radius: 50%; background: #9fd0ff; border: 2px solid #17110a;
  cursor: nwse-resize; box-shadow: 0 1px 3px rgba(0,0,0,.6);
}

  z-index: 25;

/* Interlaced 8-pointed star: a gold "hot-spot" sweeps around the ring, trailing red→black. */
@keyframes party-gold-sweep {
  0%,   100% { stroke: #ffd23a; }
  12.5%      { stroke: #f0a028; }
  25%        { stroke: hsl(0 90% 50%); }
  37.5%      { stroke: hsl(0 90% 40%); }
  50%        { stroke: hsl(0 90% 30%); }
  62.5%      { stroke: hsl(0 90% 20%); }
  75%        { stroke: hsl(0 88% 10%); }
  81%        { stroke: #000; }
  87.5%      { stroke: #c33010; }
  93.75%     { stroke: #e8781c; }
}
.party-svg { display: block; overflow: visible; }
.party-svg .oct-line {
  fill: none;
  stroke: #ffd23a;
  stroke-width: 2.4;
  stroke-linecap: round;
  animation: party-gold-sweep 1.867s linear infinite;
}
.party-svg .oct-line:nth-child(2) { animation-delay: 0s;      }
.party-svg .oct-line:nth-child(3) { animation-delay: -0.233s; }
.party-svg .oct-line:nth-child(4) { animation-delay: -0.467s; }
.party-svg .oct-line:nth-child(5) { animation-delay: -0.7s;   }
.party-svg .oct-line:nth-child(6) { animation-delay: -0.933s; }
.party-svg .oct-line:nth-child(7) { animation-delay: -1.167s; }
.party-svg .oct-line:nth-child(8) { animation-delay: -1.4s;   }
.party-svg .oct-line:nth-child(1) { animation-delay: -1.633s; }

  white-space: nowrap;
  font-family: 'Tribal Garamond', 'Cinzel', serif;
  font-size: 11px; font-weight: 600; letter-spacing: .1em; text-transform: uppercase;
  color: #122a6b;

}

<script>
// ─── DYNAMIC TOWN LOADER ─────────────────────────────────────────────────────
(function () {
  const params = new URLSearchParams(window.location.search);
  const raw    = params.get('town') || '';
  const folder = raw.toLowerCase().replace(/[^a-z0-9]/g, '_');

  if (!folder) {
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelector('.app').innerHTML =
        '<div style="grid-column:1/-1;color:#c8a040;font-family:Cinzel,serif;' +
        'padding:4rem;text-align:center">' +
        '<p style="font-size:1.2rem">No town specified</p>' +
        '<p style="margin-top:1rem;font-style:italic;color:#806030">' +
        'Open this page with a <code>?town=townname</code> parameter.</p></div>';
    });
    return;
  }

  document.addEventListener('DOMContentLoaded', async function () {
    const ok = await initFromServer();
    if (ok && typeof build === 'function') build();
    if (ok) rebuildLoreNotes();
  });
}());
</script>

<script>
// ─── MODE ────────────────────────────────────────────────────────────────────
// IS_DM is set by the server — localhost requests are DM, all others are players.
// ?player_test forces player mode for local testing.
let IS_DM = false;

// NPC player notes broadcast from the NPC tool — keyed by npc slug.
let npcPlayerNotes = {};
// DM-only portrait index — all NPCs that have an image, keyed by npc slug.
let npcImages = {};
// NPC display name -> sheet npcId, so cards can reach the sheet even when the
// town content defined the NPC without an id.
let npcIdByName = {};
// Notes controllers for currently-built cards, so a change in the NPC tool can
// live-refresh the matching card here.
const activeNotesControllers = new Set();
function flushAllNotes() { activeNotesControllers.forEach(c => c.flush?.()); }
window.addEventListener('beforeunload', flushAllNotes);
window.addEventListener('pagehide', e => { if (!e.persisted) flushAllNotes(); });

async function loadNpcIdMap() {
  try {
    const list = await fetch('/api/npc-sheets').then(r => r.json());
    npcIdByName = {};
    (list.sheets || []).forEach(s => { if (s.name) npcIdByName[s.name] = s.npcId; });
  } catch(_) {}
}

function npcSlug(name) {
  return (name || '').toLowerCase().replace(/[^a-z0-9]/g, '_').replace(/_+/g,'_').replace(/^_|_$/g,'');
}

// ─── SERVER STATE ────────────────────────────────────────────────────────────
let serverState = {
  playerVis:      { houses: {}, npcs: {} },
  npcEdits:       {},
  npcSchema:      {},
  housePositions: {},
  locPositions:   {},
  loreNotes:      []
};
let TOWN_SLUG_API = '';

async function fetchTownState() {
  const r = await fetch(`/api/town/${TOWN_SLUG_API}`);
  return r.json();
}

async function initFromServer() {
  const params = new URLSearchParams(location.search);
  TOWN_SLUG_API = (params.get('town') || '').toLowerCase().replace(/[^a-z0-9]/g, '_');
  try {
    const data = await fetchTownState();
    IS_DM = data.isDM && !params.has('player_test');
    if (window.DiceRoll) DiceRoll.setDM(IS_DM);   // only the DM may right-click a roll → hidden
    serverState.playerVis      = data.playerVis      || { houses: {}, npcs: {} };
    serverState.npcEdits       = data.npcEdits       || {};
    serverState.npcSchema      = data.npcSchema      || {};
    serverState.housePositions = data.housePositions || {};
    serverState.locPositions   = data.locPositions   || {};
    serverState.loreNotes      = Array.isArray(data.loreNotes) ? data.loreNotes : [];
    npcPlayerNotes             = data.npcPlayerNotes || {};
    npcImages                  = data.npcImages      || {};
    await loadNpcIdMap();

    if (data.content) {
      applyTownContentFromDB(data.content);
      return true;
    } else {
      document.querySelector('.app').innerHTML =
        '<div style="grid-column:1/-1;color:#c8a040;font-family:Cinzel,serif;' +
        'padding:4rem;text-align:center">' +
        '<p style="font-size:1.2rem">Town not found</p>' +
        '<p style="margin-top:1rem;font-style:italic;color:#806030">' +
        'No content in database for <code>' + escHtml(TOWN_SLUG_API) + '</code></p></div>';
      return false;
    }
  } catch(e) { console.error('Server not reachable:', e); return false; }
}

// Apply DB content to the global variables build() depends on
function applyTownContentFromDB(c) {
  window.TOWN_NAME            = c.name           || '';
  window.MAP_IMAGE_FILENAME   = c.mapImage        || '';
  window.TOWN_TOTAL_HOMES     = c.totalHomes      != null ? c.totalHomes     : 0;
  window.TOWN_TOTAL_RESIDENTS = c.totalResidents  != null ? c.totalResidents : 0;
  EXTRA_MAPS = Array.isArray(c.extraMaps) ? c.extraMaps : [];
  EXTRA_MAPS.forEach(em => {
    if (!Array.isArray(em.households))    em.households    = [];
    if (!Array.isArray(em.townLocations)) em.townLocations = [];
    if (!em.houseMapDefault) em.houseMapDefault = {};
    if (!em.housePositions)  em.housePositions  = {};
    if (!em.locPositions)    em.locPositions    = {};
    if (!em.playerVis)       em.playerVis       = { houses: {}, npcs: {} };
  });
  // Always update main map snap from content
  _mainMapSnap = {
    households:      Array.isArray(c.households)    ? c.households    : [],
    townLocations:   Array.isArray(c.townLocations) ? c.townLocations : [],
    houseMapDefault: c.houseMapDefault || {},
  };
  _mainMapSnap.households.forEach(h => { if (!Array.isArray(h.npcs)) h.npcs = []; });
  // Load the currently active map's data into globals
  if (activeMapIndex === 0 || !EXTRA_MAPS[activeMapIndex - 1]) {
    activeMapIndex = 0;
    window.HOUSEHOLDS        = _mainMapSnap.households;
    window.HOUSE_MAP_DEFAULT  = _mainMapSnap.houseMapDefault;
    window.TOWN_LOCATIONS    = _mainMapSnap.townLocations;
  } else {
    _loadExtraMapGlobals(activeMapIndex);
  }
}

// Load an extra map's households/locations/houseMapDefault into the active globals.
// Positions are handled by initHouseMap/initLocMap; playerVis by loadPlayerVisibility.
function _loadExtraMapGlobals(index) {
  const em = EXTRA_MAPS[index - 1];
  if (!em) return;
  window.HOUSEHOLDS        = Array.isArray(em.households)    ? em.households    : [];
  window.HOUSEHOLDS.forEach(h => { if (!Array.isArray(h.npcs)) h.npcs = []; });
  window.TOWN_LOCATIONS    = Array.isArray(em.townLocations) ? em.townLocations : [];
  window.HOUSE_MAP_DEFAULT  = em.houseMapDefault || {};
}

// Load the main town map's content + positions into the active globals.
// Positions come from serverState (kept current by pushState/SSE).
function _loadMainMapGlobals() {
  window.HOUSEHOLDS        = _mainMapSnap.households;
  window.HOUSEHOLDS.forEach(h => { if (!Array.isArray(h.npcs)) h.npcs = []; });
  window.TOWN_LOCATIONS    = _mainMapSnap.townLocations;
  window.HOUSE_MAP_DEFAULT  = _mainMapSnap.houseMapDefault;
  _replaceObj(HOUSE_MAP, serverState.housePositions || {});
  _replaceObj(LOC_MAP,   serverState.locPositions   || {});
  playerVisibility = serverState.playerVis;
}

// Write current globals back to their storage slot before switching maps.
function _flushCurrentMapData() {
  if (activeMapIndex === 0) {
    _mainMapSnap.households     = HOUSEHOLDS.filter(h => !h.virtual);
    _mainMapSnap.townLocations  = [...TOWN_LOCATIONS];
    _mainMapSnap.houseMapDefault = { ...HOUSE_MAP_DEFAULT };
    // Main-map positions live in serverState (kept current by pushState/SSE); no snap needed.
  } else {
    const em = EXTRA_MAPS[activeMapIndex - 1];
    if (!em) return;
    em.households     = HOUSEHOLDS.filter(h => !h.virtual);
    em.townLocations  = [...TOWN_LOCATIONS];
    em.houseMapDefault = { ...HOUSE_MAP_DEFAULT };
    em.housePositions  = { ...HOUSE_MAP };
    em.locPositions    = { ...LOC_MAP };
    em.playerVis = JSON.parse(JSON.stringify(playerVisibility));
  }
}

// Replace contents of target object with source (clears then assigns).
function _replaceObj(target, source) {
  Object.keys(target).forEach(k => delete target[k]);
  Object.assign(target, source || {});
}

async function pushState() {
  if (!IS_DM) return;
  try {
    await fetch(`/api/town/${TOWN_SLUG_API}`, {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify(serverState)
    });
  } catch(e) {}
}


function connectSSE() {
  function attach() {
    const es = new EventSource(`/api/events/${TOWN_SLUG_API}`);
    es.onmessage = e => {
      try {
        const data = JSON.parse(e.data);
        // Roll log + live-reload ride this one stream (no extra SSE connections).
        // Return unconditionally so a roll NEVER falls through to the rebuild logic below
        // (which would refresh the whole map). If DiceRoll isn't ready yet, just drop it.
        if (data.type === 'dr-roll') { if (window.DiceRoll) DiceRoll.ingestRemote(data.entry); return; }
        if (data.type === 'dr-reload') { location.reload(); return; }
        if (data.type === 'combat' && data.state && window.CombatPanel) { window.CombatPanel.ingest(data.state); return; }
        // Map tokens: pool changes re-render; a token move glides to its new cell.
        if (data.type === 'tokenPool') { tokenPool = Array.isArray(data.pool) ? data.pool : []; renderTokens(); return; }
        if (data.type === 'tokenMove') { applyRemoteTokenMove(data); return; }
        // Player-notes broadcast from NPC tool — update and refresh NPC cards
        if (data.type === 'playerNotes') {
          npcPlayerNotes = data.npcPlayerNotes != null ? data.npcPlayerNotes : npcPlayerNotes;
          npcImages      = data.npcImages      != null ? data.npcImages      : npcImages;
          updateNpcPlayerNoteCards();
          return;
        }
        // NPC sheet changed — re-inject if structural, refresh notes if note-only.
        if (data.type === 'npcSheetUpdate') {
          const ae = document.activeElement;
          const editingHere = ae && ae.closest && (ae.closest('.npc-notes-area') || ae.classList.contains('npc-role'));
          fetchTownState().then(async fresh => {
            if (!fresh.content) return;
            npcPlayerNotes = fresh.npcPlayerNotes || npcPlayerNotes;
            npcImages      = fresh.npcImages      || npcImages;
            // Note-only change: skip if DM is actively editing here (own save echo-back).
            if (contentSig(fresh.content) === lastContentSig) {
              if (!editingHere) { activeNotesControllers.forEach(c => c.refresh()); updateNpcPlayerNoteCards(); }
              return;
            }
            // Structural change: always rebuild regardless of editing state.
            serverState.playerVis = fresh.playerVis || serverState.playerVis;
            serverState.npcEdits  = fresh.npcEdits  || serverState.npcEdits;
            serverState.npcSchema = fresh.npcSchema || serverState.npcSchema;
            playerVisibility      = serverState.playerVis;
            await loadNpcIdMap();
            applyTownContentFromDB(fresh.content);
            _poll.contentSig = contentSig(fresh.content);
            rebuildContent();
          }).catch(() => {});
          return;
        }
        const visChanged = JSON.stringify(data.playerVis) !== JSON.stringify(serverState.playerVis);
        const incomingVis = data.playerVis;
        serverState.playerVis = (incomingVis && incomingVis.houses) ? incomingVis : serverState.playerVis;
        serverState.npcEdits       = data.npcEdits       || serverState.npcEdits;
        serverState.npcSchema      = data.npcSchema      || serverState.npcSchema;
        // Only apply main-map positions when actually on the main map
        if (activeMapIndex === 0) {
          if (data.housePositions) { Object.assign(HOUSE_MAP, data.housePositions); }
          serverState.housePositions = HOUSE_MAP;
          serverState.locPositions   = data.locPositions || serverState.locPositions;
          if (data.locPositions) { Object.assign(LOC_MAP, data.locPositions); renderPartyMarker(); }
          playerVisibility = serverState.playerVis;
          // Re-apply the main map's own hex grid from the freshly-synced positions.
          if (typeof loadHexGridFromState === 'function') loadHexGridFromState();
        }
        // (Extra-map grid changes ride the town_content broadcast → rebuildContent → buildMap
        //  → loadHexGridFromState, so no extra handling is needed here for them.)
        npcPlayerNotes             = data.npcPlayerNotes || npcPlayerNotes;
        npcImages                  = data.npcImages      || npcImages;
        // Keep polling baselines in sync so the next tick doesn't double-rebuild.
        _poll.visJson   = JSON.stringify({ pv: serverState.playerVis, ne: serverState.npcEdits, ns: serverState.npcSchema });
        _poll.notesJson = JSON.stringify(npcPlayerNotes);
        _poll.locJson   = JSON.stringify(serverState.locPositions || {});   // grid/party baseline
        if (IS_DM)           updateVisibilityUI();
        else if (visChanged) rebuildContent();
        else                 updateNpcPlayerNoteCards();
      } catch(_) {}
    };
    // On connection error, close and reconnect after 3 s.
    // The server sends the full current state on every (re)connect, so no updates are lost.
    es.onerror = () => { es.close(); setTimeout(attach, 3000); };
  }
  attach();
}

// Shared polling baselines — updated by both SSE and polling so they stay in sync
// and SSE-applied changes don't look like new changes on the next tick.
// locJson tracks the main map's loc_pos (which carries the HEX GRID '__hexgrid__' and the
// PARTY marker '__party__'), so grid/party changes are caught even when SSE is buffered.
const _poll = { visJson: '', notesJson: '', contentSig: '', locJson: '' };

// Polling fallback — fetches state every 3 s and rebuilds if it changed.
// Guards against SSE messages lost to Cloudflare buffering or dropped connections.
function startPlayerPolling() {
  if (IS_DM) return;
  _poll.visJson     = JSON.stringify({ pv: serverState.playerVis, ne: serverState.npcEdits, ns: serverState.npcSchema });
  _poll.notesJson   = JSON.stringify(npcPlayerNotes);
  _poll.contentSig  = contentSig({ households: HOUSEHOLDS, extraMaps: EXTRA_MAPS });
  _poll.locJson     = JSON.stringify(serverState.locPositions || {});
  const tick = async () => {
    try {
      const data = await fetchTownState();
      const newVisJson    = JSON.stringify({ pv: data.playerVis, ne: data.npcEdits, ns: data.npcSchema });
      const newNotesJson  = JSON.stringify(data.npcPlayerNotes);
      const newContentSig = contentSig(data.content);
      const newLocJson    = JSON.stringify(data.locPositions || {});
      const visChanged     = newVisJson    !== _poll.visJson;
      const notesChanged   = newNotesJson  !== _poll.notesJson;
      const contentChanged = newContentSig !== _poll.contentSig;
      const locChanged     = newLocJson    !== _poll.locJson;
      if (contentChanged) {
        _poll.visJson    = newVisJson;
        _poll.notesJson  = newNotesJson;
        _poll.contentSig = newContentSig;
        _poll.locJson    = newLocJson;   // rebuildContent re-applies the grid, so adopt this baseline
        serverState.playerVis = data.playerVis || serverState.playerVis;
        serverState.npcEdits  = data.npcEdits  || serverState.npcEdits;
        serverState.npcSchema = data.npcSchema || serverState.npcSchema;
        playerVisibility      = serverState.playerVis;
        npcPlayerNotes        = data.npcPlayerNotes || npcPlayerNotes;
        npcImages             = data.npcImages      || npcImages;
        applyTownContentFromDB(data.content);
        rebuildContent();
      } else if (visChanged || notesChanged || locChanged) {
        if (visChanged) {
          _poll.visJson         = newVisJson;
          serverState.playerVis = data.playerVis || serverState.playerVis;
          serverState.npcEdits  = data.npcEdits  || serverState.npcEdits;
          serverState.npcSchema = data.npcSchema || serverState.npcSchema;
          playerVisibility      = serverState.playerVis;
        }
        if (notesChanged) {
          _poll.notesJson = newNotesJson;
          npcPlayerNotes  = data.npcPlayerNotes || npcPlayerNotes;
          npcImages       = data.npcImages      || npcImages;
        }
        // Hex grid + party marker live in loc_pos. Apply on the MAIN map (extra-map grids ride
        // the content path). Mirrors the SSE handler so a grid/party change is never missed.
        if (locChanged) {
          _poll.locJson = newLocJson;
          serverState.locPositions = data.locPositions || serverState.locPositions;
          if (activeMapIndex === 0 && data.locPositions) {
            Object.assign(LOC_MAP, data.locPositions);
            renderPartyMarker();
            if (typeof loadHexGridFromState === 'function') loadHexGridFromState();
          }
        }
        if (visChanged) rebuildContent();
        else            updateNpcPlayerNoteCards();
      }
    } catch(_) {}
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 3000);
}

function isHouseVisible(houseId) {
  return playerVisibility.houses[String(houseId)] === true;
}

function isNpcVisible(houseId, npcName) {
  // Cascade: a hidden house hides all its residents regardless of individual state
  if (!isHouseVisible(houseId)) return false;
  const h = playerVisibility.npcs[String(houseId)];
  // Default hidden — DM must explicitly reveal each NPC (stored as true)
  return !!(h && h[npcName] === true);
}

function toggleHouseVisibility(houseId) {
  const k = String(houseId);
  if (isHouseVisible(houseId)) {
    delete playerVisibility.houses[k];   // remove = back to hidden (default)
  } else {
    playerVisibility.houses[k] = true;   // true = visible to players
  }
  savePlayerVisibility();
  updateVisibilityUI();
}

function toggleNpcVisibility(houseId, npcName) {
  const hid = String(houseId);
  if (!playerVisibility.npcs[hid]) playerVisibility.npcs[hid] = {};
  if (isNpcVisible(houseId, npcName)) {
    delete playerVisibility.npcs[hid][npcName];   // remove = back to hidden (default)
  } else {
    playerVisibility.npcs[hid][npcName] = true;   // true = revealed to players
  }
  savePlayerVisibility();
  updateVisibilityUI();
}

function updateVisibilityUI() {
  // Sidebar buttons
  document.querySelectorAll('.house-btn').forEach(btn => {
    const id = btn.dataset.houseId;
    btn.classList.toggle('sb-hidden', !isHouseVisible(id));
  });

  // House cards
  document.querySelectorAll('.house-card').forEach(card => {
    if (card.dataset.virtual) return; // virtual households always visible to DM
    const id = card.id.replace('house-', '');
    const vis = isHouseVisible(id);
    card.classList.toggle('dm-hidden', !vis);
    const hBtn = card.querySelector('.house-player-btn');
    if (hBtn) {
      hBtn.textContent = vis ? '● Visible to Players' : '○ Hidden from Players';
      hBtn.classList.toggle('is-visible', vis);
    }
  });

  // NPC cards
  document.querySelectorAll('.npc-card').forEach(card => {
    const houseCard = card.closest('.house-card');
    if (!houseCard || houseCard.dataset.virtual) return; // skip virtual households
    const houseId = houseCard.id.replace('house-', '');
    const npcName = card.dataset.npcName;
    const houseHidden = !isHouseVisible(houseId);
    const vis = isNpcVisible(houseId, npcName);
    card.classList.toggle('dm-hidden', !vis);
    const nBtn = card.querySelector('.npc-player-btn');
    if (nBtn) {
      nBtn.disabled = houseHidden;
      nBtn.textContent = vis ? '● Revealed' : '○ Hidden';
      nBtn.classList.toggle('is-visible', vis);
    }
  });

  // Map markers
  document.querySelectorAll('.map-marker').forEach(marker => {
    marker.classList.toggle('mk-hidden', !isHouseVisible(marker.dataset.houseId));
  });
}

// Build an NPC-tool URL, carrying over the DM key (?dmkey=) if this page was
// opened with one — so the NPC tool opens in the same DM/player mode as the map
// tool (the signed DM cookie normally covers this; this is belt-and-suspenders).
function npcToolUrl(params) {
  const q = new URLSearchParams(params || {});
  const dmkey = new URLSearchParams(location.search).get('dmkey');
  if (dmkey) q.set('dmkey', dmkey);
  q.set('_', Date.now()); // cache-bust so the NPC tool always loads fresh (never a stale cached copy)
  return '/npcs/npc_tool.html?' + q.toString();
}

let _mapNaturalSizes = {};
let EXTRA_MAPS       = [];
let _mainMapSnap = { households: [], townLocations: [], houseMapDefault: {}, housePositions: {}, locPositions: {} };
let activeMapIndex   = 0;
let mapImageLoading  = false;

function getActiveMapUrl() {
  if (activeMapIndex === 0 || !EXTRA_MAPS[activeMapIndex - 1]) return MAP_IMAGE_FILENAME;
  return EXTRA_MAPS[activeMapIndex - 1].url;
}

function applyMapImage() {
  const mapFrame = document.getElementById('mapFrame');
  const imgSrc   = getActiveMapUrl();
  if (!imgSrc) {
    mapFrame.style.backgroundImage = 'none';
    mapFrame.style.maxWidth    = '';
    mapFrame.style.aspectRatio = '';
    mapFrame.classList.add('map-no-image');
    mapImageLoading = false;
    return;
  }
  mapFrame.classList.remove('map-no-image');
  mapFrame.style.backgroundImage = `url('${imgSrc.replace(/'/g, '%27')}')`;

  const cached = _mapNaturalSizes[imgSrc];
  if (cached) {
    mapFrame.style.maxWidth    = cached.w + 'px';
    mapFrame.style.aspectRatio = `${cached.w} / ${cached.h}`;
    return;
  }

  if (mapImageLoading) return;
  mapImageLoading = true;
  const srcAtLoad = imgSrc;

  const img = new Image();
  img.onload = () => {
    mapImageLoading = false;
    _mapNaturalSizes[srcAtLoad] = { w: img.naturalWidth, h: img.naturalHeight };
    if (getActiveMapUrl() !== srcAtLoad) return;
    mapFrame.style.maxWidth    = img.naturalWidth + 'px';
    mapFrame.style.aspectRatio = `${img.naturalWidth} / ${img.naturalHeight}`;
    buildMap();
    applyFilters();
  };
  img.onerror = () => {
    mapImageLoading = false;
    if (getActiveMapUrl() !== srcAtLoad) return;
    mapFrame.style.aspectRatio = '1 / 1';
  };
  img.src = imgSrc;
}

const RACES = {
  human:      { label: 'Human',      cls: 'race-human'      },
  highelf:    { label: 'High Elf',   cls: 'race-highelf'    },
  woodelf:    { label: 'Wood Elf',   cls: 'race-woodelf'    },
  halfelf:    { label: 'Half-Elf',   cls: 'race-halfelf'    },
  halforc:    { label: 'Half-Orc',   cls: 'race-halforc'    },
  dwarf:      { label: 'Dwarf',      cls: 'race-dwarf'      },
  halfling:   { label: 'Halfling',   cls: 'race-halfling'   },
  gnome:      { label: 'Gnome',      cls: 'race-gnome'      },
  goliath:    { label: 'Goliath',    cls: 'race-goliath'    },
  dragonborn: { label: 'Dragonborn', cls: 'race-dragonborn' },
  tiefling:   { label: 'Tiefling',   cls: 'race-tiefling'   },
  owlbear:    { label: 'Owlbear',    cls: 'race-owlbear'    },

  construct:  { label: 'Construct',  cls: 'race-construct'  },
  undead:     { label: 'Undead',     cls: 'race-undead'     },
};

function raceClass(r) {
  if (RACES[r]) return RACES[r].cls;
  // Unknown race: derive a stable CSS class from the name so each unknown
  // race gets its own distinct filter bucket rather than collapsing into 'race-human'.
  return 'race-' + (r || 'unknown').toLowerCase().replace(/[^a-z0-9]/g, '');
}

function raceLabel(r) { return RACES[r]?.label || (r ? r.charAt(0).toUpperCase() + r.slice(1) : '—'); }

  };
  saveLocMap();
}

function mapFramePointerMove(event) {
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  if (!premisesPlacementMode && !activeDrag && !partyDragging) return;
  const mapFrame = document.getElementById('mapFrame');
  const rect = mapFrame.getBoundingClientRect();
  if (partyDragging && IS_DM && rect.width > 0) {
    const x = roundPos(Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width)  * 100)));
    const y = roundPos(Math.max(0, Math.min(100, ((event.clientY - rect.top)  / rect.height) * 100)));
    LOC_MAP['__party__'] = { x, y };
    renderPartyMarker();
    clearTimeout(_partyPosTimer);
    _partyPosTimer = setTimeout(saveLocMap, 300);
  }
  if (premisesPlacementMode && ghostMarker && rect.width > 0) {
    ghostMarker.style.left = `${Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width)  * 100))}%`;
    ghostMarker.style.top  = `${Math.max(0, Math.min(100, ((event.clientY - rect.top)  / rect.height) * 100))}%`;
  }
  if (!activeDrag) return;
  let x = ((event.clientX - rect.left) / rect.width) * 100;
  let y = ((event.clientY - rect.top) / rect.height) * 100;
  x = roundPos(Math.max(0, Math.min(100, x)));
  y = roundPos(Math.max(0, Math.min(100, y)));
  activeDrag.marker.style.left = `${x}%`;
  activeDrag.marker.style.top  = `${y}%`;
  activeDrag.current = { x, y };
}

function mapFramePointerUp(event) {
  if (partyDragging) {
    partyDragging = false;
    partyMarkerEl?.classList.remove('dragging');
    clearTimeout(_partyPosTimer);
    saveLocMap();
    return;
  }
  if (!activeDrag) return;
  if (event && activeDrag.pointerId !== undefined && event.pointerId !== activeDrag.pointerId) return;
  activeDrag.marker.classList.remove('dragging');
  if (activeDrag.locId !== undefined) {
    activeDrag.marker.classList.remove('unpositioned');
    updateLocPosition(activeDrag.locId, activeDrag.current.x, activeDrag.current.y);
  } else {
    const { start, current } = activeDrag;
    if (!start || current.x !== start.x || current.y !== start.y) {
      updateMarkerPosition(activeDrag.houseId, current.x, current.y);
    }
  }
  activeDrag = null;
}

window.addEventListener('pointermove',   mapFramePointerMove);
window.addEventListener('pointerup',     mapFramePointerUp);
window.addEventListener('pointercancel', () => {
  if (activeDrag) { activeDrag.marker.classList.remove('dragging'); activeDrag = null; }
  if (partyDragging) { partyDragging = false; partyMarkerEl?.classList.remove('dragging'); clearTimeout(_partyPosTimer); saveLocMap(); }
});

document.getElementById('mapFrame').addEventListener('click', e => {
  if (!premisesPlacementMode) return;
  const rect = e.currentTarget.getBoundingClientRect();
  const x = roundPos(Math.max(0, Math.min(100, ((e.clientX - rect.left)  / rect.width)  * 100)));
  const y = roundPos(Math.max(0, Math.min(100, ((e.clientY - rect.top)   / rect.height) * 100)));
  finalizePremisesPlacement(x, y);
});

// ─── SEARCH ──────────────────────────────────────────────────────────────────
const SEARCH_FIELDS = ['name','profession','race','gender','alignment','appearance','personality','notable','backstory'];

function npcMatchesQuery(npc, terms) {
  return terms.every(term =>
    SEARCH_FIELDS.some(field => {
      const val = npc[field];
      return val && String(val).toLowerCase().includes(term);
    })
  );
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function highlightTerms(text, terms) {
  const safe = escHtml(text);
  if (!terms.length) return safe;
  const escaped = terms.map(t => escHtml(t).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const regex = new RegExp(`(${escaped.join('|')})`, 'gi');
  return safe.replace(regex, '<mark>$1</mark>');
}

function visibleHouses() {
  return IS_DM ? HOUSEHOLDS : HOUSEHOLDS.filter(h => isHouseVisible(h.id));
}

function npcCountLabel(h) {
  const n = (h.npcs || []).length;
  return `${n} NPC${n !== 1 ? 's' : ''}`;
}

function buildNpcIndex() {
  const index = [];
  const houses = visibleHouses();
  houses.forEach(h => {
    const npcs = IS_DM
      ? h.npcs
      : h.npcs.filter(n => isNpcVisible(h.id, n.name));
    npcs.forEach(npc => index.push({ npc, house: h }));
  });
  return index;
}
