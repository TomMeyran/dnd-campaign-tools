<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regional Atlas</title>
<link rel="stylesheet" href="atlas_style.css">
</head>
<body>

<input type="file" id="map-img-upload" accept="image/*" style="display:none">

<!-- corner ornaments -->
<div class="corner tr">ג¦</div>
<div class="corner bl">ג¦</div>
<div class="corner br">ג¦</div>
<div id="frame"></div>

<div id="layout">

  <!-- HEADER -->
  <div id="header">
    <div class="atlas-title-col">
      <h1 class="display"><span class="atlas-sub">Regional Atlas</span></h1>
      <span id="dmViewBadge" style="display:none;position:absolute;top:100%;left:0;transform:translateX(-50%);margin-top:2px;background:rgba(180,30,30,0.15);border:1px solid rgba(200,50,50,0.4);color:#e07070;font-size:7.5px;letter-spacing:.1em;padding:1px 6px;border-radius:2px;font-family:'Cinzel',serif;text-transform:uppercase;white-space:nowrap">DM View</span>
    </div>
    <div id="header-controls">
      <button type="button" class="npc-tool-btn" id="btn-npc-tool-2" style="display:none">NPC tool</button>
      <button type="button" class="npc-tool-btn npc-tool-btn-gold" id="btn-creation" style="display:none">Edit DB</button>
      <div class="player-link-bar" id="playerLinkBar">
        <span class="player-link-label">Players</span>
        <button type="button" class="player-link-copy" id="playerLinksBtn">Player Links</button>
        <button type="button" class="player-link-copy" id="btn-sync-players" style="display:none" title="Refresh every open player tool and re-sync all views">Sync players</button>
      </div>

      <!-- MAP TOOLS DROPDOWN ג€” collects every map-editing control -->
      <div class="maptools-wrap" id="maptools-wrap">
        <button class="btn btn-gold" id="btn-maptools" type="button">Map Tools ג–¾</button>
        <div id="maptools-menu">
          <button class="maptools-item active" id="btn-labels" type="button">Hide Locations</button>

          <!-- Hex Grid: toggle row + inline cell-size field shown when on (DM only) -->
          <div class="maptools-sub" id="hexgrid-wrap" style="display:none">
            <button class="maptools-item" id="btn-hexgrid" type="button">Hex Grid</button>
            <div class="maptools-inline" id="hexgrid-inline">
              <label for="hexgrid-scale">Cell size (px)</label>
              <input type="number" id="hexgrid-scale" min="10" max="2000" step="1" value="112">
              <div class="maptools-inline-hint">Smaller = finer grid</div>
            </div>
          </div>

          <button class="maptools-item" id="btn-coords" type="button">Coords</button>
          <button class="maptools-item" id="btn-edit" type="button" style="display:none">Edit Positions</button>

          <!-- Party Location: set (click-to-place) when unset, jump-to when set -->
          <button class="maptools-item" id="btn-party-loc" type="button" style="display:none">Party Location</button>

          <!-- Add: nested submenu (DM only) -->
          <div class="maptools-sub maptools-submenu-wrap" id="add-dropdown-wrap" style="display:none">
            <button class="maptools-item maptools-item-caret" id="btn-addtown" type="button">Add<span class="maptools-caret">ג–¸</span></button>
            <div id="add-dropdown-menu" class="maptools-submenu">
              <button class="maptools-item" id="btn-add-location" type="button">Add Location</button>
              <button class="maptools-item" id="btn-add-marker" type="button">Add Marker</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div id="body-row">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="sidebar-head">
        <h2 class="display">Locations</h2>
        <input id="search" type="text" placeholder="Search towns &amp; placesג€¦">
        <div id="location-count"></div>
      </div>
      <div id="location-list"></div>
    </div>

    <!-- MAP AREA -->
    <div id="map-area">
      <div id="map-viewport">
        <!-- map image OR fallback -->
        <img id="map-img" alt="Nocropi regional map"
             draggable="false"
             onload="onMapLoad(this)"
             onerror="onMapError(this)">
        <!-- animated hexagonal travel grid (above image, below markers) -->
        <svg id="hex-grid-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <defs>
            <!-- Two pointy-top hexagons per tile (34.641 ֳ— 60) that tile into a
                 seamless honeycomb. Circumradius 20 ג†’ neighbour distance גˆ3ֲ·20. -->
            <pattern id="hex-pattern" width="34.641" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(3.2)">
              <path fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"
                    d="M17.3205 0L34.641 10L34.641 30L17.3205 40L0 30L0 10Z
                       M0 30L17.3205 40L17.3205 60L0 70L-17.3205 60L-17.3205 40Z"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#hex-pattern)"/>
        </svg>
        <!-- markers go here, positioned absolutely over the image -->
        <div id="markers-layer"></div>
      </div>

      <!-- Zoom controls -->
      <div id="zoom-controls">
        <button class="zoom-btn" id="btn-zoom-in" title="Zoom in">+</button>
        <div id="zoom-label">100%</div>
        <button class="zoom-btn" id="btn-zoom-out" title="Zoom out">גˆ’</button>
        <button class="zoom-btn" id="btn-zoom-reset" style="font-size:12px" title="Reset view">ג‚</button>
      </div>

      <!-- Compass rose (SVG) -->
      <div id="compass">
        <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <!-- Static outer ring -->
          <circle cx="32" cy="32" r="30" fill="none" stroke="#6b4f2e" stroke-width="1.2" opacity=".7"/>
          <!-- Rotating cross ג€” gets .loading class while map image is loading -->
          <g id="compass-needle">
            <polygon points="32,4 29,32 32,28 35,32" fill="#8b2020"/>
            <polygon points="32,60 29,32 32,36 35,32" fill="#6b4f2e"/>
            <polygon points="60,32 32,29 36,32 32,35" fill="#6b4f2e"/>
            <polygon points="4,32 32,29 28,32 32,35"  fill="#6b4f2e"/>
            <circle cx="32" cy="32" r="3.5" fill="#c8922a"/>
            <text x="32" y="18" text-anchor="middle" font-family="Cinzel,serif" font-size="8" fill="#8b2020" font-weight="700">N</text>
            <text x="32" y="58" text-anchor="middle" font-family="Cinzel,serif" font-size="7" fill="#6b4f2e">S</text>
            <text x="55" y="35" text-anchor="middle" font-family="Cinzel,serif" font-size="7" fill="#6b4f2e">E</text>
            <text x="9"  y="35" text-anchor="middle" font-family="Cinzel,serif" font-size="7" fill="#6b4f2e">W</text>
          </g>
        </svg>
      </div>
      <!-- Placement mode instruction banner -->
      <div id="placement-banner"></div>
      <!-- Real-time position readout -->
      <div id="coords-display">ג€” ֲ· ג€”</div>
    </div>

  </div><!-- /body-row -->
</div><!-- /layout -->

<!-- TOOLTIP -->
<div id="tooltip">
  <div id="tooltip-type"></div>
  <div id="tooltip-name"></div>
  <div id="tooltip-desc"></div>
  <div id="tooltip-hint"></div>
</div>

<!-- ADD TOWN MODAL -->
<div id="addtown-overlay">
  <div id="addtown-box">
    <h3 class="display">Add Location</h3>
    <input id="addtown-name" type="text" placeholder="Location nameג€¦">
    <div id="addtown-hint">Enter the name of the new location. Click on the map to place it.</div>
    <div id="addtown-actions">
      <button class="btn btn-gold" id="btn-submit-addtown">Add Location</button>
      <button class="btn"          id="btn-cancel-addtown">Cancel</button>
    </div>
  </div>
</div>

<script>
// ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•
//  NOCROPI REGIONAL MAP  ג€”  main application script
// ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•ג•

// IS_DM is resolved from the server (same logic as map_tool.html).
// Direct localhost access ג†’ DM; Cloudflare tunnel ג†’ player.
// ?player_test in the URL forces player mode for local testing.
let IS_DM = false;
const PLAYER_TEST = new URLSearchParams(location.search).has('player_test');

// Defaults ג€” overridden by DB content on load
let REGION_NAME          = 'Nocropi';
let MAP_IMAGE_FILENAME   = 'locations/nocropi.webp';
let LOCATION_MAP_DEFAULT = {};
let LOCATIONS            = [];

// Town slugs that have actual content in the DB (populated on init)
let townsWithContent = new Set();
let npcCountByTown = {};

// ג”€ג”€ STATE ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
let mapW = 1200, mapH = 800;   // set properly when image loads
let scale   = 1;
let panX    = 0, panY    = 0;
let minScale = 0.05, maxScale = 6;
let isPanning = false;
let panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
let editMode    = false;
let labelsVisible = true;
let activeId    = null;
let positions   = {};          // live copy, may differ from LOCATION_MAP_DEFAULT
let pendingUploadLocId = null;
let draggingMarker = null;
let partyDragging = false;
let _partyPosTimer = null;
let placementMode   = false;
let pendingTownName = null;
let pendingType     = 'Location';
let ghostMarkerEl   = null;
let pendingClick    = false;
let clickStartX     = 0, clickStartY = 0;
let showCoords      = false;

// ג”€ג”€ ELEMENTS ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
const mapArea       = document.getElementById('map-area');
const viewport      = document.getElementById('map-viewport');
const markersLayer  = document.getElementById('markers-layer');
const tooltip       = document.getElementById('tooltip');
const zoomLabel     = document.getElementById('zoom-label');
const tooltipType   = document.getElementById('tooltip-type');
const tooltipName   = document.getElementById('tooltip-name');
const tooltipDesc   = document.getElementById('tooltip-desc');
const tooltipHint   = document.getElementById('tooltip-hint');
const coordsDisplay = document.getElementById('coords-display');
const locationCount = document.getElementById('location-count');

// ג”€ג”€ BOOT ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('compass-needle').classList.add('loading');
  // Start loading the map image immediately so it fetches in parallel with the API
  document.getElementById('map-img').src = MAP_IMAGE_FILENAME;

  // Resolve DM status, location visibility, and content in one round-trip
  try {
    const [auth, regionData] = await Promise.all([
      fetch('/api/whoami').then(r => r.json()),
      fetch('/api/region/nocropi').then(r => r.json())
    ]);
    IS_DM = auth.isDM && !PLAYER_TEST;
    if (window.DiceRoll) DiceRoll.setDM(IS_DM);   // only the DM may right-click a roll ג†’ hidden
    townsWithContent = new Set(regionData.townsWithContent || []);
    npcCountByTown = regionData.npcCountByTown || {};
    // Location visibility (and party/hexgrid state) always comes from the database.
    locVisibility = regionData.locPositions || {};
    if (regionData.content) {
      applyRegionContentFromDB(regionData.content);
      // Update src in case DB has a different filename than the default
      document.getElementById('map-img').src = MAP_IMAGE_FILENAME;
    } else {
      showFatalBanner('Region content not found in database.');
      return;
    }
  } catch(e) {
    console.error('Failed to connect to server:', e);
    showFatalBanner('Cannot reach the map server ג€” make sure server.js is running.');
    return;
  }

  // Merge any user-added towns saved in localStorage
  loadCustomLocations();
  // Visibility lives in the DB; keep every tab (DM + players) in sync via SSE.
  // Polling is a players-only fallback for tunnels where SSE can be buffered.
  connectAtlasSSE();
  // The combat panels (initiative + attacks) live in the town map tool, not the atlas.
  if (!IS_DM) startAtlasPolling();
  if (IS_DM) {
    document.getElementById('dmViewBadge').style.display       = '';
    positionDmBadge();
    window.addEventListener('resize', positionDmBadge);
    // NPC tool + Edit DB buttons (DM only) ג€” carry the DM key so the new tab is DM too.
    const openDmTool = (path) => {
      const q = new URLSearchParams();
      const dmkey = new URLSearchParams(location.search).get('dmkey');
      if (dmkey) q.set('dmkey', dmkey);
      q.set('_', Date.now());
      window.open(path + '?' + q.toString(), '_blank');
    };
    const npcTool2 = document.getElementById('btn-npc-tool-2');
    npcTool2.style.display = '';
    npcTool2.addEventListener('click', () => openDmTool('/npcs/npc_tool.html'));
    const creationBtn = document.getElementById('btn-creation');
    creationBtn.style.display = '';
    creationBtn.addEventListener('click', () => openDmTool('/creation.html'));
    document.getElementById('btn-edit').style.display           = '';
    document.getElementById('add-dropdown-wrap').style.display  = '';
    document.getElementById('hexgrid-wrap').style.display       = '';
    document.getElementById('btn-party-loc').style.display      = '';
    // Sync players: hard-refresh every open tool (atlas + NPC tool) for all players + DM,
    // restarting their SSE + polling from a clean state to recover from any drift.
    const syncBtn = document.getElementById('btn-sync-players');
    syncBtn.style.display = '';
    syncBtn.addEventListener('click', async () => {
      await fetch('/api/sync-players', { method: 'POST' }).catch(() => {});
      const orig = syncBtn.textContent;
      syncBtn.classList.add('copied');
      syncBtn.textContent = 'Synced!';
      setTimeout(() => { syncBtn.textContent = orig; syncBtn.classList.remove('copied'); }, 2000);
    });
    fetchTunnelUrl();
    setInterval(fetchTunnelUrl, 10 * 60 * 1000);
    // Player Links button (replaces the raw tunnel link) ג†’ roster + Discord delivery
    document.getElementById('playerLinkBar')?.classList.add('visible');
    document.getElementById('playerLinksBtn')?.addEventListener('click', openPlayerLinks);
    document.getElementById('plkClose')?.addEventListener('click', closePlayerLinks);
    document.getElementById('plkBackdrop')?.addEventListener('click', closePlayerLinks);
    document.getElementById('plkAdd')?.addEventListener('click', addPlayer);
    document.getElementById('plkSend')?.addEventListener('click', sendPlayerLinks);
  }

  // Deep-copy default positions (includes any custom ones just loaded)
  positions = {};
  Object.entries(LOCATION_MAP_DEFAULT).forEach(([k,v]) => {
    positions[+k] = { x: v.x, y: v.y };
  });

  // Ensure every listed location has a position; default to map centre if missing
  LOCATIONS.forEach(loc => {
    if (!positions[loc.id]) {
      positions[loc.id]              = { x: 50, y: 50 };
      LOCATION_MAP_DEFAULT[loc.id]   = { x: 50, y: 50 };
    }
  });

  buildSidebar();
  initPartyMarker();
  refreshPartyLocBtn();
  loadHexGridFromVis();
  // If the image loaded from cache before DOMContentLoaded ran, onMapLoad fired
  // before positions were populated and rendered nothing.  Re-run it now so the
  // viewport is properly sized first, then markers are placed inside it.
  const mapImg = document.getElementById('map-img');
  if (mapImg.complete) {
    if (mapImg.naturalWidth > 0) onMapLoad(mapImg);
    else onMapError(mapImg);
  }
  applyTransform();

  // Give map area a moment to measure itself, then fit
  setTimeout(fitView, 80);
});

// ג”€ג”€ FATAL BANNER ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function showFatalBanner(message) {
  document.getElementById('compass-needle').classList.remove('loading');
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:10px;background:#8b2020;color:#f2e8cc;text-align:center;z-index:9999;font-family:Cinzel,serif;font-size:0.85rem';
  banner.textContent = message;
  document.body.prepend(banner);
}

// ג”€ג”€ MAP LOAD / ERROR ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function finalizeMapSetup() {
  document.getElementById('compass-needle').classList.remove('loading');
  viewport.style.width  = mapW + 'px';
  viewport.style.height = mapH + 'px';
  renderMarkers();
  fitView();
}

function onMapLoad(img) {
  mapW = img.naturalWidth  || 1200;
  mapH = img.naturalHeight || 800;
  img.style.width  = mapW + 'px';
  img.style.height = mapH + 'px';
  finalizeMapSetup();
}

function onMapError(img) {
  img.style.display = 'none';
  // Show a styled fallback canvas
  const fb = document.createElement('div');
  fb.id = 'map-img-fallback';
  fb.style.width  = mapW + 'px';
  fb.style.height = mapH + 'px';
  fb.innerHTML = `<div>${escHtml(REGION_NAME)}</div><div class="fallback-sub">Upload a map image using the DM controls</div>`;
  viewport.insertBefore(fb, markersLayer);
  finalizeMapSetup();
}

// ג”€ג”€ FIT VIEW ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function fitView() {
  const areaW = mapArea.clientWidth;
  const areaH = mapArea.clientHeight;
  if (!areaW || !areaH) return;
  const scaleX = areaW / mapW;
  const scaleY = areaH / mapH;
  scale = Math.min(scaleX, scaleY) * 0.92;
  scale = clampScale(scale);
  panX = (areaW - mapW * scale) / 2;
  panY = (areaH - mapH * scale) / 2;
  applyTransform();
}

// ג”€ג”€ TRANSFORM ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function applyTransform() {
  viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  zoomLabel.textContent = Math.round(scale * 100) + '%';
}

function clampScale(s) {
  return Math.max(minScale, Math.min(maxScale, s));
}

// ג”€ג”€ ZOOM ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function zoomStep(delta) {
  const areaW = mapArea.clientWidth;
  const areaH = mapArea.clientHeight;
  const cx = areaW / 2, cy = areaH / 2;
  zoomAt(cx, cy, delta);
}

function zoomAt(cx, cy, delta) {
  const newScale = clampScale(scale + delta * scale);
  const ratio = newScale / scale;
  panX = cx - ratio * (cx - panX);
  panY = cy - ratio * (cy - panY);
  scale = newScale;
  applyTransform();
}

function resetView() {
  fitView();
}

// ג”€ג”€ MOUSE WHEEL ZOOM ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
mapArea.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = mapArea.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 0.12 : -0.12;
  zoomAt(cx, cy, delta);
}, { passive: false });

// ג”€ג”€ PAN (mouse) ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
mapArea.addEventListener('mousedown', e => {
  if (draggingMarker) return;
  if (editMode && e.target.closest('.marker')) return;
  if (placementMode) {
    pendingClick = true;
    clickStartX  = e.clientX;
    clickStartY  = e.clientY;
  }
  isPanning = true;
  panStartX  = e.clientX;
  panStartY  = e.clientY;
  panOriginX = panX;
  panOriginY = panY;
  mapArea.classList.add('grabbing');
});

window.addEventListener('mousemove', e => {
  if (isPanning) {
    panX = panOriginX + (e.clientX - panStartX);
    panY = panOriginY + (e.clientY - panStartY);
    applyTransform();
  }
  if (draggingMarker) {
    handleMarkerDrag(e);
  }

  if (partyDragging && IS_DM) {
    const raw = clientToMapPct(e.clientX, e.clientY);
    locVisibility['__party__'] = { x: +raw.x.toFixed(3), y: +raw.y.toFixed(3) };
    renderPartyMarker();
    clearTimeout(_partyPosTimer);
    _partyPosTimer = setTimeout(saveLocVisibility, 300);
  }

  // Update ghost marker or coords display only when cursor is over the map area
  const mapRect = mapArea.getBoundingClientRect();
  const overMap = e.clientX >= mapRect.left && e.clientX <= mapRect.right &&
                  e.clientY >= mapRect.top  && e.clientY <= mapRect.bottom;

  if (overMap) {
    const raw = clientToMapPct(e.clientX, e.clientY);

    if (placementMode && ghostMarkerEl) {
      const pos = clientToMarkerPos(e.clientX, e.clientY);
      ghostMarkerEl.style.left = pos.x + '%';
      ghostMarkerEl.style.top  = pos.y + '%';
    }

    if (showCoords) {
      coordsDisplay.textContent = 'X: ' + raw.x.toFixed(1) + '  Y: ' + raw.y.toFixed(1);
    }
  } else if (showCoords) {
    coordsDisplay.textContent = 'ג€” ֲ· ג€”';
  }
});

window.addEventListener('mouseup', e => {
  if (placementMode && pendingClick) {
    const dx = e.clientX - clickStartX;
    const dy = e.clientY - clickStartY;
    if (Math.hypot(dx, dy) < 6) {
      const pos = clientToMarkerPos(e.clientX, e.clientY);
      finalizePlacement(pos.x, pos.y);
    }
    pendingClick = false;
  }
  isPanning = false;
  mapArea.classList.remove('grabbing');
  if (draggingMarker) {
    const draggedId = draggingMarker.id;
    draggingMarker.el.classList.remove('edit-dragging');
    draggingMarker = null;
    LOCATION_MAP_DEFAULT[draggedId] = positions[draggedId];
    debouncedSavePositions();
  }

  if (partyDragging) {
    partyDragging = false;
    partyMarkerEl?.classList.remove('dragging');
    clearTimeout(_partyPosTimer);
    saveLocVisibility();
  }
});

// Reset all drag state if mouse is released outside the browser window
window.addEventListener('blur', () => {
  if (isPanning)      { isPanning = false; mapArea.classList.remove('grabbing'); }
  if (draggingMarker) { draggingMarker.el.classList.remove('edit-dragging'); draggingMarker = null; }
  if (partyDragging)  { partyDragging = false; partyMarkerEl?.classList.remove('dragging'); clearTimeout(_partyPosTimer); saveLocVisibility(); }
});

// ג”€ג”€ TOUCH PAN / PINCH ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
let lastTouches = null;

mapArea.addEventListener('touchstart', e => {
  lastTouches = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
}, { passive: true });

mapArea.addEventListener('touchmove', e => {
  e.preventDefault();
  const touches = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
  if (!lastTouches) { lastTouches = touches; return; }

  if (touches.length === 1 && lastTouches.length === 1) {
    // Pan
    panX += touches[0].x - lastTouches[0].x;
    panY += touches[0].y - lastTouches[0].y;
    applyTransform();
  } else if (touches.length === 2 && lastTouches.length === 2) {
    // Pinch zoom
    const rect = mapArea.getBoundingClientRect();
    const d0 = dist(lastTouches[0], lastTouches[1]);
    const d1 = dist(touches[0], touches[1]);
    const cx = ((touches[0].x + touches[1].x) / 2) - rect.left;
    const cy = ((touches[0].y + touches[1].y) / 2) - rect.top;
    const newScale = clampScale(scale * (d1 / d0));
    const ratio = newScale / scale;
    panX = cx - ratio * (cx - panX);
    panY = cy - ratio * (cy - panY);
    scale = newScale;
    applyTransform();
  }
  lastTouches = touches;
}, { passive: false });

mapArea.addEventListener('touchend', () => { lastTouches = null; }, { passive: true });

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// ג”€ג”€ SIDEBAR BUILD ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
// ג”€ג”€ LOCATION VISIBILITY (DM) ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
let locVisibility = {};

let _visSaveTimer = null;
function saveLocVisibility() {
  // Persist to the database only ג€” no browser cache.
  if (!IS_DM) return;
  clearTimeout(_visSaveTimer);
  _visSaveTimer = setTimeout(() => {
    fetch('/api/town/nocropi_atlas', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ locPositions: locVisibility })
    }).catch(() => {});
  }, 300);
}

function isLocVisible(id) {
  return locVisibility[id] === true;
}

function toggleLocVisibility(id) {
  if (isLocVisible(id)) {
    delete locVisibility[id];   // hide: remove the key
  } else {
    locVisibility[id] = true;   // reveal: set to true
  }
  saveLocVisibility();
  updateLocVisUI();
}

function updateLocVisUI() {
  document.querySelectorAll('.loc-entry').forEach(el => {
    const id = +el.dataset.id;
    if (!Number.isFinite(id)) return;
    const vis = isLocVisible(id);
    el.classList.toggle('dm-hidden', !vis);
    const btn = el.querySelector('.loc-vis-btn');
    if (btn) {
      btn.textContent = vis ? 'ג— Visible' : 'ג—‹ Hidden';
      btn.classList.toggle('hidden-state', !vis);
    }
  });
  renderMarkers();
}

function buildSidebar() {
  const list = document.getElementById('location-list');
  list.innerHTML = '';
  const locs = IS_DM ? LOCATIONS : LOCATIONS.filter(l => isLocVisible(l.id));
  locs.forEach(loc => {
    const el = document.createElement('div');
    el.className = 'loc-entry';
    el.dataset.id = loc.id;
    if (IS_DM && !isLocVisible(loc.id)) el.classList.add('dm-hidden');

    const isTextMarker = loc.type === 'Marker';
    const pageUrl = loc.page || null;
    const townSlug = townSlugOf(loc);
    const hasTownContent = townSlug ? townsWithContent.has(townSlug) : false;
    // Show "Open Town Map" only when the town has content seeded in the DB.
    // DM additionally sees "Add a location map" for locations not yet set up.
    // Text-only markers (Marker type) never have a town map link.
    const showLink   = !isTextMarker && pageUrl && hasTownContent;
    const showAddMap = !isTextMarker && IS_DM && !hasTownContent;
    el.innerHTML = `
      <div class="loc-type display">${escHtml(loc.type)}</div>
      ${IS_DM
        ? `<input class="loc-name-input display" value="${escHtml(loc.name)}" title="Click to rename">`
        : `<div class="loc-name display">${escHtml(loc.name)}</div>`}
      <div class="loc-desc">${escHtml(loc.desc)}</div>
      ${IS_DM && townSlug && npcCountByTown[townSlug] ? `<div class="loc-npc-count">${escHtml(plural(npcCountByTown[townSlug], 'NPC'))}</div>` : ''}
      ${isTextMarker
        ? ''
        : showLink
          ? `<a class="loc-link display" href="${!/^(javascript|data|vbscript):/i.test(pageUrl) ? escHtml(pageUrl + (PLAYER_TEST ? '&player_test' : '')) : '#'}" target="_blank" rel="noopener"
                onclick="event.stopPropagation()">Open Town Map ג†’</a>`
          : showAddMap
            ? `<button class="loc-link display" data-addmap="${loc.id}">Add a location map</button>`
            : `<span class="loc-link no-page display">No town map yet</span>`}
    `;
    if (IS_DM) {
      const nameInput = el.querySelector('.loc-name-input');
      nameInput.addEventListener('click', e => e.stopPropagation());
      nameInput.addEventListener('change', () => {
        const newName = nameInput.value.trim();
        if (!newName) { nameInput.value = loc.name; return; }
        loc.name = newName;
        renderMarkers();
        saveCustomLocations();
        debouncedSavePositions();
      });
      const addMapBtn = el.querySelector('[data-addmap]');
      if (addMapBtn) addMapBtn.addEventListener('click', e => { e.stopPropagation(); startMapUpload(loc.id); });

      const vis = isLocVisible(loc.id);
      const visBtn = document.createElement('button');
      visBtn.className = 'loc-vis-btn' + (vis ? '' : ' hidden-state');
      visBtn.textContent = vis ? 'ג— Visible' : 'ג—‹ Hidden';
      visBtn.onclick = e => { e.stopPropagation(); toggleLocVisibility(loc.id); };
      el.appendChild(visBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'loc-remove-btn';
      delBtn.textContent = 'ֳ—';
      delBtn.title = 'Remove location';
      delBtn.onclick = e => {
        e.stopPropagation();
        if (confirm(`Remove "${loc.name}"?\nThis cannot be undone.`)) removeMarker(loc.id);
      };
      el.appendChild(delBtn);
    }

    el.addEventListener('click', () => activateLocation(loc.id, true));
    list.appendChild(el);
  });
  updateCount(locs.length, LOCATIONS.length);
}

function updateCount(visible, total) {
  const totalNpcs = IS_DM ? Object.values(npcCountByTown).reduce((s, n) => s + n, 0) : 0;
  const locPart = IS_DM
    ? (visible === total ? plural(total, 'location') : `${visible} of ${total} shown`)
    : plural(visible, 'location');
  locationCount.textContent = totalNpcs > 0 ? `${locPart} ֲ· ${totalNpcs} NPCs` : locPart;
}

// ג”€ג”€ FILTER ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function filterList(q) {
  q = q.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.loc-entry').forEach(el => {
    const id  = +el.dataset.id;
    const loc = LOCATIONS.find(l => l.id === id);
    if (!loc) return;
    const match = !q ||
      loc.name.toLowerCase().includes(q) ||
      loc.type.toLowerCase().includes(q) ||
      loc.desc.toLowerCase().includes(q);
    el.classList.toggle('hidden', !match);
    if (match) visible++;
  });
  updateCount(visible, LOCATIONS.length);
}

// ג”€ג”€ PARTY MARKER ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
let partyMarkerEl = null;

function getPartyPos() {
  const p = locVisibility['__party__'];
  return (p && Number.isFinite(p.x) && Number.isFinite(p.y)) ? p : null;
}

function renderPartyMarker() {
  if (!partyMarkerEl) return;
  const pos = getPartyPos();
  if (!pos) { partyMarkerEl.style.display = 'none'; return; }
  partyMarkerEl.style.display = 'block';
  partyMarkerEl.style.left = pos.x + '%';
  partyMarkerEl.style.top  = pos.y + '%';
}

// Keep the Map-Tools "Party Location" row in sync: "Setג€¦" (click-to-place) when unset,
// jump-to when set. Hidden for players until a position exists (they can't place one).
function refreshPartyLocBtn() {
  const btn = document.getElementById('btn-party-loc');
  if (!btn) return;
  const set = !!getPartyPos();
  if (!set && !IS_DM) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  btn.textContent = set ? 'Party Location' : 'Set Party Location';
  btn.title = set ? 'Jump to the party on the map' : 'Click, then click the map to place the party';
}

function initPartyMarker() {
  partyMarkerEl = document.createElement('div');
  partyMarkerEl.id = 'party-marker';
  // Interlaced 8-point star ({8/3} octagram): 8 equal-width chords that weave over/under.
  // Each <line> is a separate stroke so it can run its own staggered hue animation.
  partyMarkerEl.innerHTML = `
    <div class="party-label party-label-top">Party</div>
    <div class="party-star-wrap">
      <svg class="party-svg" viewBox="0 0 40 40" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
        <line class="oct-line" x1="20"    y1="3"     x2="32.02" y2="32.02"/>
        <line class="oct-line" x1="32.02" y1="7.98"  x2="20"    y2="37"   />
        <line class="oct-line" x1="37"    y1="20"    x2="7.98"  y2="32.02"/>
        <line class="oct-line" x1="32.02" y1="32.02" x2="3"     y2="20"   />
        <line class="oct-line" x1="20"    y1="37"    x2="7.98"  y2="7.98" />
        <line class="oct-line" x1="7.98"  y1="32.02" x2="20"    y2="3"    />
        <line class="oct-line" x1="3"     y1="20"    x2="32.02" y2="7.98" />
        <line class="oct-line" x1="7.98"  y1="7.98"  x2="37"    y2="20"   />
      </svg>
    </div>
    <div class="party-label party-label-bot">Location</div>`;

  if (IS_DM) {
    partyMarkerEl.classList.add('dm-movable');
    partyMarkerEl.addEventListener('mousedown', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      partyDragging = true;
      partyMarkerEl.classList.add('dragging');
    });
  }

  partyMarkerEl.addEventListener('mouseenter', ev => {
    tooltipType.textContent = '';
    tooltipName.textContent = 'Party Location';
    tooltipDesc.textContent = IS_DM ? 'Drag to reposition' : '';
    tooltipHint.textContent = '';
    tooltip.classList.add('visible');
    positionTooltip(ev);
  });
  partyMarkerEl.addEventListener('mouseleave', hideTooltip);

  viewport.appendChild(partyMarkerEl);
  renderPartyMarker();
}

// ג”€ג”€ MARKERS RENDER ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function renderMarkers() {
  markersLayer.innerHTML = '';
  LOCATIONS.forEach(loc => {
    const pos = positions[loc.id];
    if (!pos) return;
    if (!IS_DM && !isLocVisible(loc.id)) return;

    const el = document.createElement('div');
    el.dataset.id = loc.id;
    el.style.left = pos.x + '%';
    el.style.top  = pos.y + '%';
    if (IS_DM && !isLocVisible(loc.id)) el.style.opacity = '0.35';

    if (loc.type === 'Marker') {
      el.className = 'marker marker-text';
      el.innerHTML = `<div class="marker-label">${escHtml(loc.name)}</div>`;
    } else {
      el.className = 'marker';
      const color = typeColor(loc.type);
      el.innerHTML = `
        <svg class="marker-seal" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="12" fill="${color.bg}" stroke="${color.ring}" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="8"  fill="none"        stroke="${color.ring}" stroke-width=".8" stroke-dasharray="2 1.5"/>
          <text x="14" y="18" text-anchor="middle"
                font-family="Cinzel,serif" font-size="10" font-weight="700"
                fill="${color.text}">${escHtml((loc.type || '?')[0])}</text>
        </svg>
        <div class="marker-label">${escHtml(loc.name)}</div>
      `;
    }

    el.addEventListener('mouseenter', ev => showTooltip(loc, ev));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      if (editMode) return;
      activateLocation(loc.id, true);
      const _slug = townSlugOf(loc);
      const canOpen = loc.page && !/^(javascript|data|vbscript):/i.test(loc.page) &&
                      (IS_DM || (_slug && townsWithContent.has(_slug)));
      if (canOpen) window.open(loc.page + (PLAYER_TEST ? '&player_test' : ''), '_blank', 'noopener');
    });

    // Edit-mode drag
    el.addEventListener('mousedown', ev => {
      if (!editMode) return;
      ev.stopPropagation();
      ev.preventDefault();
      draggingMarker = { id: loc.id, el };
      el.classList.add('edit-dragging');
    });

    markersLayer.appendChild(el);
  });

  // Re-attach ghost marker if placement mode is active
  if (placementMode && ghostMarkerEl) markersLayer.appendChild(ghostMarkerEl);

  updateMarkerLabels();
}

function updateMarkerLabels() {
  document.querySelectorAll('.marker-label').forEach(el => {
    if (el.closest('.marker-text')) return; // text-only markers always visible
    el.classList.toggle('show', labelsVisible);
  });
}

function typeColor(type) {
  const t = type.toLowerCase();
  if (t === 'city')     return { bg: '#8b2020', ring: '#c8922a', text: '#f2e8d0' };
  if (t === 'town')     return { bg: '#3b2a14', ring: '#c8922a', text: '#f2e8d0' };
  if (t === 'ruin')     return { bg: '#2a2a2a', ring: '#888',    text: '#ccc'    };
  if (t === 'dungeon')  return { bg: '#1a1a2e', ring: '#6666aa', text: '#ccccff' };
  if (t === 'landmark') return { bg: '#1c3a1c', ring: '#5a8a5a', text: '#c0e0c0' };
  return { bg: '#3b2a14', ring: '#c8922a', text: '#f2e8d0' };
}

// ג”€ג”€ ACTIVATE LOCATION ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function activateLocation(id, panToIt) {
  activeId = id;

  // Sidebar highlight
  document.querySelectorAll('.loc-entry').forEach(el => {
    el.classList.toggle('highlighted', +el.dataset.id === id);
  });
  // Scroll entry into view
  const entry = document.querySelector(`.loc-entry[data-id="${id}"]`);
  if (entry) entry.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  // Marker highlight
  document.querySelectorAll('.marker').forEach(el => {
    el.classList.toggle('active', +el.dataset.id === id);
  });

  // Pan map to marker (unless in edit mode or explicitly skipped)
  if (panToIt && !editMode) {
    const pos = positions[id];
    if (pos) {
      const areaW = mapArea.clientWidth;
      const areaH = mapArea.clientHeight;
      const targetX = (pos.x / 100) * mapW * scale;
      const targetY = (pos.y / 100) * mapH * scale;
      panX = areaW / 2 - targetX;
      panY = areaH / 2 - targetY;
      applyTransform();
    }
  }
}

// ג”€ג”€ TOOLTIP ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function showTooltip(loc, ev) {
  tooltipType.textContent = loc.type;
  tooltipName.textContent = loc.name;
  tooltipDesc.textContent = loc.desc;
  const _tSlug = townSlugOf(loc);
  const _hasMap = _tSlug ? townsWithContent.has(_tSlug) : false;
  tooltipHint.textContent = (IS_DM ? !!loc.page : _hasMap) ? 'Click to open town map ג†’' : '';
  tooltip.classList.add('visible');
  positionTooltip(ev);
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

document.addEventListener('mousemove', ev => {
  if (tooltip.classList.contains('visible')) positionTooltip(ev);
});

function positionTooltip(ev) {
  const pad = 14;
  const tw  = tooltip.offsetWidth  || 240;
  const th  = tooltip.offsetHeight || 100;
  let x = ev.clientX + pad;
  let y = ev.clientY + pad;
  if (x + tw > window.innerWidth  - 16) x = ev.clientX - tw - pad;
  if (y + th > window.innerHeight - 16) y = ev.clientY - th - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

// ג”€ג”€ MARKER BOUNDS CLAMP ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
// Keeps the 28ֳ—28 seal fully inside the map image at all times.
function clientToMarkerPos(clientX, clientY) {
  const { x, y } = clientToMapPct(clientX, clientY);
  return clampMarkerPos(x, y);
}

function clampMarkerPos(x, y) {
  const halfW = mapW > 0 ? (14 / mapW) * 100 : 0;
  const sealH = mapH > 0 ? (28 / mapH) * 100 : 0;
  return {
    x: Math.max(halfW, Math.min(100 - halfW, x)),
    y: Math.max(sealH, Math.min(100, y))
  };
}

// ג”€ג”€ HANDLE MARKER DRAG ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function handleMarkerDrag(e) {
  if (!draggingMarker) return;
  const pos = clientToMarkerPos(e.clientX, e.clientY);
  positions[draggingMarker.id] = pos;
  draggingMarker.el.style.left = pos.x + '%';
  draggingMarker.el.style.top  = pos.y + '%';
}

// ג”€ג”€ HEX GRID (DM-controlled, synced to players) ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
// State piggybacks on locVisibility['__hexgrid__'] so it travels through
// the same save ג†’ broadcast pipeline as the party marker. { on, scale }
// where `scale` is the grid cell size in pixels (map space).
let hexGrid = { on: true, scale: 112 };
let _hexSaveTimer = null;

function applyHexGrid() {
  const overlay = document.getElementById('hex-grid-overlay');
  const pattern = document.getElementById('hex-pattern');
  if (overlay) overlay.classList.toggle('hidden', !hexGrid.on);
  // Base pattern tile is 28px wide; scale so one tile ג‰ˆ hexGrid.scale px.
  // Base hex tile is 34.641px wide; scale so one hex ג‰ˆ hexGrid.scale px across.
  if (pattern) pattern.setAttribute('patternTransform', 'scale(' + (hexGrid.scale / 34.641) + ')');
  const btn = document.getElementById('btn-hexgrid');
  if (btn) btn.classList.toggle('active', hexGrid.on);
  const inline = document.getElementById('hexgrid-inline');
  if (inline) inline.classList.toggle('show', hexGrid.on);   // cell-size field only when grid on
  const inp = document.getElementById('hexgrid-scale');
  if (inp && document.activeElement !== inp) inp.value = hexGrid.scale;
}

// Read state pushed from the server (players) or restored locally (DM).
function loadHexGridFromVis() {
  const g = locVisibility['__hexgrid__'];
  if (g && typeof g === 'object') {
    hexGrid.on    = !!g.on;
    if (Number.isFinite(g.scale) && g.scale > 0) hexGrid.scale = Math.min(g.scale, 2000);
  }
  applyHexGrid();
}

// DM only ג€” persist + broadcast so players update.
function saveHexGrid() {
  locVisibility['__hexgrid__'] = { on: hexGrid.on, scale: hexGrid.scale };
  saveLocVisibility();
}

function toggleHexGrid() {
  hexGrid.on = !hexGrid.on;
  applyHexGrid();
  saveHexGrid();
}

function setHexScale(px) {
  const n = parseFloat(px);
  if (!Number.isFinite(n) || n <= 0) return;
  const v = Math.max(10, Math.min(2000, Math.round(n)));
  hexGrid.scale = v;
  applyHexGrid();
  clearTimeout(_hexSaveTimer);
  _hexSaveTimer = setTimeout(saveHexGrid, 300);   // debounce while scrubbing
}

function plural(n, word) { return `${n} ${word}${n !== 1 ? 's' : ''}`; }

function townSlugOf(loc) {

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ג”€ג”€ CUSTOM LOCATIONS (localStorage) ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
const CUSTOM_LOC_KEY = 'nocropi_custom_locations';

function loadCustomLocations() {
  try {
    const stored = localStorage.getItem(CUSTOM_LOC_KEY);
    if (!stored) return;
    const data = JSON.parse(stored);
    if (Array.isArray(data.locs)) {
      data.locs.forEach(loc => {
        loc.custom = true;
        if (!LOCATIONS.find(l => l.id === loc.id)) LOCATIONS.push(loc);
      });
    }
    if (data.pos && typeof data.pos === 'object') {
      Object.entries(data.pos).forEach(([k, v]) => {
        if (!LOCATION_MAP_DEFAULT[+k]) LOCATION_MAP_DEFAULT[+k] = v;
      });
    }
  } catch(e) {}
}

function saveCustomLocations() {
  const custom = LOCATIONS.filter(l => l.custom === true);
  const pos = {};
  custom.forEach(l => { if (positions[l.id]) pos[l.id] = positions[l.id]; });
  try { localStorage.setItem(CUSTOM_LOC_KEY, JSON.stringify({ locs: custom, pos })); } catch(e) {}
}

function removeMarker(id) {
  const idx = LOCATIONS.findIndex(l => l.id === id);
  if (idx === -1) return;
  LOCATIONS.splice(idx, 1);
  delete positions[id];
  delete LOCATION_MAP_DEFAULT[id];
  saveAfterEdit();
  rebuildView();
}

// Unset ג†’ click-to-place on the map (like Add Location). Set ג†’ pan the map to it.
function partyLocationAction() {
  closeMapTools();
  const pos = getPartyPos();
  if (pos) {
    jumpToMapPct(pos.x, pos.y);
  } else if (IS_DM) {
    enterPlacementMode('Party', 'Party');   // finalizePlacement handles the 'Party' type
  }
}

// Pan/center the map on a percentage position (mirrors activateLocation's pan math).
function jumpToMapPct(xPct, yPct) {
  const areaW = mapArea.clientWidth;
  const areaH = mapArea.clientHeight;
  panX = areaW / 2 - (xPct / 100) * mapW * scale;
  panY = areaH / 2 - (yPct / 100) * mapH * scale;
  applyTransform();
}

// ג”€ג”€ ADD LOCATION MODAL ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function capitaliseFirst(input) {
  const v = input.value;
  if (v.length > 0) input.value = v[0].toUpperCase() + v.slice(1);
}

// ג”€ג”€ PLACEMENT MODE ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function clientToMapPct(clientX, clientY) {
  const rect = mapArea.getBoundingClientRect();
  const mx   = (clientX - rect.left - panX) / scale;
  const my   = (clientY - rect.top  - panY) / scale;
  return {
    x: Math.max(0, Math.min(100, (mx / mapW) * 100)),
    y: Math.max(0, Math.min(100, (my / mapH) * 100))
  };
}

function enterPlacementMode(name, type) {
  pendingTownName = name;
  pendingType     = type || 'Location';
  placementMode   = true;
  mapArea.classList.add('placement-mode');

  ghostMarkerEl = document.createElement('div');
  ghostMarkerEl.style.left         = '-9999px';
  ghostMarkerEl.style.top          = '-9999px';
  ghostMarkerEl.style.opacity      = '0.72';
  ghostMarkerEl.style.pointerEvents = 'none';

  if (pendingType === 'Marker') {
    ghostMarkerEl.className = 'marker marker-text';
    ghostMarkerEl.innerHTML = `<div class="marker-label">${escHtml(name)}</div>`;
  } else {
    ghostMarkerEl.className = 'marker';
    const color = typeColor('Town');
    ghostMarkerEl.innerHTML = `
      <svg class="marker-seal" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="12" fill="${color.bg}" stroke="${color.ring}" stroke-width="1.5"/>
        <circle cx="14" cy="14" r="8"  fill="none" stroke="${color.ring}" stroke-width=".8" stroke-dasharray="2 1.5"/>
        <text x="14" y="18" text-anchor="middle" font-family="Cinzel,serif" font-size="10" font-weight="700" fill="${color.text}">T</text>
      </svg>
      <div class="marker-label">${escHtml(name)}</div>`;
  }
  markersLayer.appendChild(ghostMarkerEl);

  document.getElementById('placement-banner').textContent =
    'Click on the map to place "' + name + '"  ֲ·  Esc to cancel';
}

function exitPlacementMode() {
  if (!placementMode) return;
  placementMode   = false;
  pendingTownName = null;
  pendingClick    = false;
  mapArea.classList.remove('placement-mode');
  if (ghostMarkerEl) { ghostMarkerEl.remove(); ghostMarkerEl = null; }
  document.getElementById('placement-banner').textContent = '';
}

function finalizePlacement(x, y) {
  const name   = pendingTownName;
  const type   = pendingType;

  // Party marker: not a location ג€” store the position + save/broadcast, then jump to it.
  if (type === 'Party') {
    locVisibility['__party__'] = { x: +x.toFixed(3), y: +y.toFixed(3) };
    saveLocVisibility();
    exitPlacementMode();
    renderPartyMarker();
    refreshPartyLocBtn();
    jumpToMapPct(x, y);
    return;
  }

  const nextId = LOCATIONS.reduce((m, l) => Math.max(m, l.id), 10) + 1;

  let newLoc;
  if (type === 'Marker') {
    newLoc = { id: nextId, name, type: 'Marker', desc: '', page: null, custom: true };
  } else {
    const slug = name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
    newLoc = { id: nextId, name, type, desc: 'A new settlement awaiting its story.', page: 'map_tool.html?town=' + slug, custom: true };
  }

  LOCATIONS.push(newLoc);
  LOCATION_MAP_DEFAULT[nextId] = { x, y };
  positions[nextId]            = { x, y };

  saveAfterEdit();
  exitPlacementMode();
  rebuildView();
  activateLocation(nextId, false);
}

let _plkPlayers = [];
let _plkSheets  = [];
let _plkMeta    = { hasTunnel: false, discordConfigured: false };
function _plkEscAttr(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

async function loadPlayerRoster() {
  try {
    const [pl, sh] = await Promise.all([
      fetch('/api/players').then(r => r.json()),
      fetch('/api/npc-sheets').then(r => r.json()).catch(() => ({ sheets: [] }))

    _plkSheets  = sh.sheets || [];
    renderPlayerRoster();
  } catch (_) {}
}

function renderPlayerRoster() {
  const status = document.getElementById('plkStatus');
  const statusParts = [
    _plkMeta.hasTunnel ? '<span class="ok">ג“ Tunnel active ג€” links are publicly reachable.</span>'
                       : '<span class="warn">ג  No tunnel yet ג€” links use localhost and won\'t work for remote players.</span>',
    _plkMeta.discordConfigured ? '<span class="ok">ג“ Discord bot secret configured.</span>'
                               : '<span class="warn">ג  Discord not configured ג€” set DISCORD_BOT_SECRET in specificUser.js to enable sending.</span>'
  ];
  if (_plkMeta.dmLink) {
    // The tunnel domain changes on every tunnel restart and the DM cookie is
    // per-domain ג€” open this once on the new domain to stay DM there.
    statusParts.push('<span class="warn">נ”‘ DM link for the current tunnel (open once after a tunnel restart): '
      + `<a href="${_plkEscAttr(_plkMeta.dmLink)}" target="_blank" rel="noopener">${_plkEscAttr(_plkMeta.dmLink)}</a></span>`);
  }
  status.innerHTML = statusParts.join('<br>');

  const opts = ['<option value="">ג€” none ג€”</option>']
    .concat(_plkSheets.map(s => `<option value="${_plkEscAttr(s.npcId)}">${_plkEscAttr(s.name || s.npcId)}</option>`))
    .join('');

  const rows = document.getElementById('plkRows');
  rows.innerHTML = '';
  _plkPlayers.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="plk-dot ${p.online ? 'on' : ''}" title="${p.online ? 'online' : 'offline'}"></span></td>
      <td><input class="plk-name" value="${_plkEscAttr(p.name)}"></td>
      <td><input class="plk-chan" value="${_plkEscAttr(p.discordChannel)}" placeholder="Channel ID (link goes here)"></td>
      <td><input class="plk-dc" value="${_plkEscAttr(p.discordTarget)}" placeholder="Discord user ID"></td>
      <td><select class="plk-char">${opts}</select></td>
      <td style="white-space:nowrap"><button type="button" class="plk-mini plk-copy-char" title="Copy the character (NPC tool) link">character</button> <button type="button" class="plk-mini plk-copy-map" title="Copy the maps (atlas) link">map</button></td>
      <td style="white-space:nowrap"><button type="button" class="plk-mini plk-regen" title="New link (revoke old)">ג†»</button> <button type="button" class="plk-mini danger plk-del" title="Remove">ג•</button></td>`;
    tr.querySelector('.plk-char').value = p.characterId || '';
    tr.querySelector('.plk-name').addEventListener('change', e => updatePlayer(p.pid, { name: e.target.value }));
    tr.querySelector('.plk-chan').addEventListener('change', e => updatePlayer(p.pid, { discordChannel: e.target.value }));
    tr.querySelector('.plk-dc').addEventListener('change', e => updatePlayer(p.pid, { discordTarget: e.target.value }));
    tr.querySelector('.plk-char').addEventListener('change', e => updatePlayer(p.pid, { characterId: e.target.value }));
    const _flash = (b) => { const o = b.textContent; b.textContent = 'ג“ copied'; setTimeout(() => b.textContent = o, 1200); };
    tr.querySelector('.plk-copy-char').addEventListener('click', e => {
      navigator.clipboard?.writeText(p.link || ''); _flash(e.currentTarget);
    });
    tr.querySelector('.plk-copy-map').addEventListener('click', e => {
      navigator.clipboard?.writeText(p.mapLink || ''); _flash(e.currentTarget);
    });
    tr.querySelector('.plk-regen').addEventListener('click', async () => {
      if (!confirm('Generate a new link for ' + (p.name || 'this player') + '? Their old link will stop working.')) return;
      await fetch(`/api/players/${p.pid}/regen`, { method: 'POST' }).catch(() => {}); loadPlayerRoster();
    });
    tr.querySelector('.plk-del').addEventListener('click', async () => {
      if (!confirm('Remove ' + (p.name || 'this player') + '?')) return;
      await fetch(`/api/players/${p.pid}`, { method: 'DELETE' }).catch(() => {}); loadPlayerRoster();
    });
    rows.appendChild(tr);
  });
}

async function updatePlayer(pid, patch) {
  try { await fetch(`/api/players/${pid}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) }); } catch (_) {}
}
async function addPlayer() {
  await fetch('/api/players', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'New Player' }) }).catch(() => {});
  loadPlayerRoster();
}
async function sendPlayerLinks() {
  const msg = document.getElementById('plkSendMsg');
  msg.textContent = 'Sendingג€¦';
  try {
    const r = await fetch('/api/players/send-links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
    const d = await r.json();
    if (!r.ok) { msg.textContent = d.error || 'Failed.'; return; }
    let t = `Queued ${d.queued} link(s) for the bot to deliver.`;
    if (d.skipped && d.skipped.length) t += ` Skipped (no Channel ID): ${d.skipped.join(', ')}.`;
    if (!d.hasTunnel) t += ' ג  No tunnel ג€” links point to localhost.';
    msg.textContent = t;
  } catch (_) { msg.textContent = 'Failed to reach server.'; }
}

// ג”€ג”€ REGION CONTENT SYNC ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function applyRegionContentFromDB(c) {
  if (c.name)     REGION_NAME        = c.name;
  if (c.mapImage) MAP_IMAGE_FILENAME = c.mapImage;
  if (c.locations && c.locations.length > 0) LOCATIONS = c.locations;
  if (c.locationMapDefault && Object.keys(c.locationMapDefault).length > 0) {
    Object.assign(LOCATION_MAP_DEFAULT, c.locationMapDefault);
    // Mirror into the live positions map so renderMarkers uses updated coordinates.
    Object.entries(c.locationMapDefault).forEach(([k, v]) => { positions[+k] = { x: v.x, y: v.y }; });
  }
  const h1 = document.querySelector('h1.display');
  if (h1) h1.innerHTML = `${escHtml(REGION_NAME)} <span class="atlas-sub">Regional Atlas</span>`;
  positionDmBadge();
}

// Center the DM View badge horizontally under the "Regional Atlas" subtitle span only
// (not the whole title), keeping it directly beneath. Recomputed on show, region rename,
// and window resize since the subtitle's position depends on the region name's width.
function positionDmBadge() {
  const badge = document.getElementById('dmViewBadge');
  const sub   = document.querySelector('.atlas-sub');
  const col   = document.querySelector('.atlas-title-col');
  if (!badge || !sub || !col || badge.style.display === 'none') return;
  const colRect = col.getBoundingClientRect();
  const subRect = sub.getBoundingClientRect();
  badge.style.left = (subRect.left - colRect.left + subRect.width / 2) + 'px';
  document.title = `${REGION_NAME} ג€” Regional Atlas`;
}


// ג”€ג”€ LIVE SYNC ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function applyVisUpdate(newVis) {
  // Ignore no-op updates (e.g. the SSE echo of our own save).
  if (JSON.stringify(newVis) === JSON.stringify(locVisibility)) return;
  locVisibility = newVis;
  buildSidebar();
  renderMarkers();
  renderPartyMarker();
  refreshPartyLocBtn();
  loadHexGridFromVis();
}

// SSE for real players via Cloudflare: server pushes visibility updates.
function connectAtlasSSE() {
  function attach() {
    const es = new EventSource('/api/events/nocropi_atlas');
    es.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        // Dice rolls ride this stream ג†’ hand to the roll log and STOP (never fall through to
        // reload / visibility handling, which would otherwise refresh the whole atlas).
        if (d.type === 'dr-roll') { if (window.DiceRoll) DiceRoll.ingestRemote(d.entry); return; }
        if (d.type === 'dr-reload') { location.reload(); return; }  // live-reload rides this stream
        if (d.locPositions !== undefined && d.locPositions !== null && typeof d.locPositions === 'object') {
          applyVisUpdate(d.locPositions);
        }
      } catch(_) {}
    };
    es.onerror = () => { es.close(); setTimeout(attach, 3000); };
  }
  attach();
}

// Polling fallback ג€” guards against Cloudflare SSE buffering / dropped connections.
function startAtlasPolling() {
  if (IS_DM) return;
  const tick = async () => {
    try {
      const resp = await fetch('/api/region/nocropi');
      if (!resp.ok) return;
      const data = await resp.json();
      const newVis  = data.locPositions || {};
      const newNames = (data.content?.locations || []).map(l => l.name);
      const newLmd   = data.content?.locationMapDefault || {};
      const oldJson  = JSON.stringify({ lp: locVisibility, ln: LOCATIONS.map(l => l.name), lmd: LOCATION_MAP_DEFAULT });
      if (JSON.stringify({ lp: newVis, ln: newNames, lmd: newLmd }) !== oldJson) {
        if (data.content) applyRegionContentFromDB(data.content);
        applyVisUpdate(newVis);
      }
    } catch(_) {}
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 3000);
}

// Cross-tab / cross-device sync now happens through the database via SSE
// (connectAtlasSSE), so no localStorage listener is needed.

// ג”€ג”€ LOCATION MAP UPLOAD ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€ג”€
function startMapUpload(locId) {
  pendingUploadLocId = locId;
  const inp = document.getElementById('map-img-upload');
  inp.value = '';
  inp.click();
}

document.getElementById('map-img-upload').addEventListener('cancel', function() {
  pendingUploadLocId = null;
});

document.getElementById('map-img-upload').addEventListener('change', async function() {
  const file  = this.files[0];
  const locId = pendingUploadLocId;
  pendingUploadLocId = null;
  if (!file || locId == null) return;

  const loc = LOCATIONS.find(l => l.id === locId);
  if (!loc) return;

  // Derive slug from the existing page URL or from the location name
  let townSlug = townSlugOf(loc) || loc.name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');

  // Show uploading feedback
  const btn = document.querySelector(`[data-addmap="${locId}"]`);
  if (btn) { btn.textContent = 'Uploadingג€¦'; btn.disabled = true; }

  const dataUrl = await new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });

  try {
    const resp = await fetch('/api/location-map/image', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ dataUrl, filename: file.name, slug: townSlug, name: loc.name })
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Upload failed');

    // If the location had no page URL, assign one now and save to DB
    if (!loc.page) {
      loc.page = 'map_tool.html?town=' + townSlug;
      savePositionsToServer();
    }

    // Mark town as having content so the sidebar shows "Open Town Map ג†’"
    townsWithContent.add(townSlug);
    buildSidebar();

    // Open the new map tool in a new tab
    window.open('map_tool.html?town=' + townSlug + (PLAYER_TEST ? '&player_test' : ''), '_blank');
  } catch(e) {
    console.error('Map upload failed:', e);
    if (btn) { btn.textContent = 'Add a location map'; btn.disabled = false; }
    alert('Map upload failed: ' + e.message);
  }
});

// The old offline service worker cached this page stale. Remove any registered
// worker and purge all caches so pages always load fresh from the server. The
// retired nocropi-sw.js (if a stale page re-registers it) unregisters itself too.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
if (window.caches) { caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {}); }

// Wire the static control buttons (converted from inline onclick= handlers). This runs
// independently of the main DOMContentLoaded init above so the controls work even if the

// handler functions only need to be global by the time a button is clicked.
(function () {

    wire('btn-maptools',       () => toggleMapTools());
    wire('btn-labels',         () => toggleLabels());

    wire('btn-party-loc',      () => partyLocationAction());

    wire('btn-zoom-in',        () => zoomStep(0.25));
    wire('btn-zoom-out',       () => zoomStep(-0.25));
    wire('btn-zoom-reset',     () => resetView());
    wire('btn-submit-addtown', () => submitAddTown());
    wire('btn-cancel-addtown', () => closeAddTown());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wireControls);
  else wireControls();
})();
</script>
