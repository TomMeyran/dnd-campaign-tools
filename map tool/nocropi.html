// ── PLAYER LINKS ROSTER + DISCORD DELIVERY ────────────────────
let _plkPlayers = [];
let _plkSheets  = [];
let _plkMeta    = { hasTunnel: false, discordConfigured: false };
function _plkEscAttr(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function openPlayerLinks() { document.getElementById('plkModal').classList.add('open'); loadPlayerRoster(); }
function closePlayerLinks() { document.getElementById('plkModal').classList.remove('open'); }

async function loadPlayerRoster() {
  try {
    const [pl, sh] = await Promise.all([
      fetch('/api/players').then(r => r.json()),
      fetch('/api/npc-sheets').then(r => r.json()).catch(() => ({ sheets: [] }))
    ]);
    _plkPlayers = pl.players || [];
    _plkMeta    = { hasTunnel: !!pl.hasTunnel, discordConfigured: !!pl.discordConfigured, dmLink: pl.dmLink || null };
    _plkSheets  = sh.sheets || [];
    renderPlayerRoster();
  } catch (_) {}
}

function renderPlayerRoster() {
  const status = document.getElementById('plkStatus');
  const statusParts = [
    _plkMeta.hasTunnel ? '<span class="ok">✓ Tunnel active — links are publicly reachable.</span>'
                       : '<span class="warn">⚠ No tunnel yet — links use localhost and won\'t work for remote players.</span>',
    _plkMeta.discordConfigured ? '<span class="ok">✓ Discord bot secret configured.</span>'
                               : '<span class="warn">⚠ Discord not configured — set DISCORD_BOT_SECRET in specificUser.js to enable sending.</span>'
  ];
  if (_plkMeta.dmLink) {
    // The tunnel domain changes on every tunnel restart and the DM cookie is
    // per-domain — open this once on the new domain to stay DM there.
    statusParts.push('<span class="warn">🔑 DM link for the current tunnel (open once after a tunnel restart): '
      + `<a href="${_plkEscAttr(_plkMeta.dmLink)}" target="_blank" rel="noopener">${_plkEscAttr(_plkMeta.dmLink)}</a></span>`);
  }
  status.innerHTML = statusParts.join('<br>');

  const opts = ['<option value="">— none —</option>']
    .concat(_plkSheets.map(s => `<option value="${_plkEscAttr(s.npcId)}">${_plkEscAttr(s.name || s.npcId)}</option>`))
    .join('');

  const rows = document.getElementById('plkRows');
  rows.innerHTML = '';
  _plkPlayers.forEach(p => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><span class="plk-dot ${p.online ? 'on' : ''}" title="${p.online ? 'online' : 'offline'}"></span></td>
      <td><input class="plk-name" value="${_plkEscAttr(p.name)}"></td>
      <td><input class="plk-chan" value="${_plkEscAttr(p.discordChannel)}" placeholder="Channel ID (link goes here)"></td>
      <td><input class="plk-dc" value="${_plkEscAttr(p.discordTarget)}" placeholder="Discord user ID"></td>
      <td><select class="plk-char">${opts}</select></td>
      <td style="white-space:nowrap"><button type="button" class="plk-mini plk-copy-char" title="Copy the character (NPC tool) link">character</button> <button type="button" class="plk-mini plk-copy-map" title="Copy the maps (atlas) link">map</button></td>
      <td style="white-space:nowrap"><button type="button" class="plk-mini plk-regen" title="New link (revoke old)">↻</button> <button type="button" class="plk-mini danger plk-del" title="Remove">✕</button></td>`;
    tr.querySelector('.plk-char').value = p.characterId || '';
    tr.querySelector('.plk-name').addEventListener('change', e => updatePlayer(p.pid, { name: e.target.value }));
    tr.querySelector('.plk-chan').addEventListener('change', e => updatePlayer(p.pid, { discordChannel: e.target.value }));
    tr.querySelector('.plk-dc').addEventListener('change', e => updatePlayer(p.pid, { discordTarget: e.target.value }));
    tr.querySelector('.plk-char').addEventListener('change', e => updatePlayer(p.pid, { characterId: e.target.value }));
    const _flash = (b) => { const o = b.textContent; b.textContent = '✓ copied'; setTimeout(() => b.textContent = o, 1200); };
    tr.querySelector('.plk-copy-char').addEventListener('click', e => {
      navigator.clipboard?.writeText(p.link || ''); _flash(e.currentTarget);
    });
    tr.querySelector('.plk-copy-map').addEventListener('click', e => {
      navigator.clipboard?.writeText(p.mapLink || ''); _flash(e.currentTarget);
    });
    tr.querySelector('.plk-regen').addEventListener('click', async () => {
      if (!confirm('Generate a new link for ' + (p.name || 'this player') + '? Their old link will stop working.')) return;
      await fetch(`/api/players/${p.pid}/regen`, { method: 'POST' }).catch(() => {}); loadPlayerRoster();
    });
    tr.querySelector('.plk-del').addEventListener('click', async () => {
      if (!confirm('Remove ' + (p.name || 'this player') + '?')) return;
      await fetch(`/api/players/${p.pid}`, { method: 'DELETE' }).catch(() => {}); loadPlayerRoster();
    });
    rows.appendChild(tr);
  });
}

async function updatePlayer(pid, patch) {
  try { await fetch(`/api/players/${pid}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(patch) }); } catch (_) {}
}
async function addPlayer() {
  await fetch('/api/players', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ name: 'New Player' }) }).catch(() => {});
  loadPlayerRoster();
}
async function sendPlayerLinks() {
  const msg = document.getElementById('plkSendMsg');
  msg.textContent = 'Sending…';
  try {
    const r = await fetch('/api/players/send-links', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({}) });
    const d = await r.json();
    if (!r.ok) { msg.textContent = d.error || 'Failed.'; return; }
    let t = `Queued ${d.queued} link(s) for the bot to deliver.`;
    if (d.skipped && d.skipped.length) t += ` Skipped (no Channel ID): ${d.skipped.join(', ')}.`;
    if (!d.hasTunnel) t += ' ⚠ No tunnel — links point to localhost.';
    msg.textContent = t;
  } catch (_) { msg.textContent = 'Failed to reach server.'; }
}

// ── REGION CONTENT SYNC ───────────────────────────────────────
function applyRegionContentFromDB(c) {
  if (c.name)     REGION_NAME        = c.name;
  if (c.mapImage) MAP_IMAGE_FILENAME = c.mapImage;
  if (c.locations && c.locations.length > 0) LOCATIONS = c.locations;
  if (c.locationMapDefault && Object.keys(c.locationMapDefault).length > 0) {
    Object.assign(LOCATION_MAP_DEFAULT, c.locationMapDefault);
    // Mirror into the live positions map so renderMarkers uses updated coordinates.
    Object.entries(c.locationMapDefault).forEach(([k, v]) => { positions[+k] = { x: v.x, y: v.y }; });
  }
  const h1 = document.querySelector('h1.display');
  if (h1) h1.innerHTML = `${escHtml(REGION_NAME)} <span class="atlas-sub">Regional Atlas</span>`;
  positionDmBadge();
}

// Center the DM View badge horizontally under the "Regional Atlas" subtitle span only
// (not the whole title), keeping it directly beneath. Recomputed on show, region rename,
// and window resize since the subtitle's position depends on the region name's width.
function positionDmBadge() {
  const badge = document.getElementById('dmViewBadge');
  const sub   = document.querySelector('.atlas-sub');
  const col   = document.querySelector('.atlas-title-col');
  if (!badge || !sub || !col || badge.style.display === 'none') return;
  const colRect = col.getBoundingClientRect();
  const subRect = sub.getBoundingClientRect();
  badge.style.left = (subRect.left - colRect.left + subRect.width / 2) + 'px';
  document.title = `${REGION_NAME} — Regional Atlas`;
}


// ── LIVE SYNC ─────────────────────────────────────────────────
function applyVisUpdate(newVis) {
  // Ignore no-op updates (e.g. the SSE echo of our own save).
  if (JSON.stringify(newVis) === JSON.stringify(locVisibility)) return;
  locVisibility = newVis;
  buildSidebar();
  renderMarkers();
  renderPartyMarker();
  refreshPartyLocBtn();
  loadHexGridFromVis();

// SSE for real players via Cloudflare: server pushes visibility updates.
function connectAtlasSSE() {
  function attach() {
    const es = new EventSource('/api/events/nocropi_atlas');
    es.onmessage = e => {
      try {
        const d = JSON.parse(e.data);
        // Dice rolls ride this stream → hand to the roll log and STOP (never fall through to
        // reload / visibility handling, which would otherwise refresh the whole atlas).
        if (d.type === 'dr-roll') { if (window.DiceRoll) DiceRoll.ingestRemote(d.entry); return; }
        if (d.type === 'dr-reload') { location.reload(); return; }  // live-reload rides this stream
        if (d.locPositions !== undefined && d.locPositions !== null && typeof d.locPositions === 'object') {
          applyVisUpdate(d.locPositions);
        }
      } catch(_) {}
    };
    es.onerror = () => { es.close(); setTimeout(attach, 3000); };
  }
  attach();
}

// Polling fallback — guards against Cloudflare SSE buffering / dropped connections.
function startAtlasPolling() {
  if (IS_DM) return;
  const tick = async () => {
    try {
      const resp = await fetch('/api/region/nocropi');
      if (!resp.ok) return;
      const data = await resp.json();
      const newVis  = data.locPositions || {};
      const newNames = (data.content?.locations || []).map(l => l.name);
      const newLmd   = data.content?.locationMapDefault || {};
      const oldJson  = JSON.stringify({ lp: locVisibility, ln: LOCATIONS.map(l => l.name), lmd: LOCATION_MAP_DEFAULT });
      if (JSON.stringify({ lp: newVis, ln: newNames, lmd: newLmd }) !== oldJson) {
        if (data.content) applyRegionContentFromDB(data.content);
        applyVisUpdate(newVis);
      }
    } catch(_) {}
    setTimeout(tick, 3000);
  };
  setTimeout(tick, 3000);
}

// Cross-tab / cross-device sync now happens through the database via SSE
// (connectAtlasSSE), so no localStorage listener is needed.

// ── LOCATION MAP UPLOAD ───────────────────────────────────────
function startMapUpload(locId) {
  pendingUploadLocId = locId;
  const inp = document.getElementById('map-img-upload');
  inp.value = '';
  inp.click();
}

document.getElementById('map-img-upload').addEventListener('cancel', function() {
  pendingUploadLocId = null;
});

document.getElementById('map-img-upload').addEventListener('change', async function() {
  const file  = this.files[0];
  const locId = pendingUploadLocId;
  pendingUploadLocId = null;
  if (!file || locId == null) return;

  const loc = LOCATIONS.find(l => l.id === locId);
  if (!loc) return;

  // Derive slug from the existing page URL or from the location name
  let townSlug = townSlugOf(loc) || loc.name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');

  // Show uploading feedback
  const btn = document.querySelector(`[data-addmap="${locId}"]`);
  if (btn) { btn.textContent = 'Uploading…'; btn.disabled = true; }

  const dataUrl = await new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });

  try {
    const resp = await fetch('/api/location-map/image', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ dataUrl, filename: file.name, slug: townSlug, name: loc.name })
    });
    const data = await resp.json();
    if (!resp.ok || !data.ok) throw new Error(data.error || 'Upload failed');

    // If the location had no page URL, assign one now and save to DB
    if (!loc.page) {
      loc.page = 'map_tool.html?town=' + townSlug;
      savePositionsToServer();
    }

    // Mark town as having content so the sidebar shows "Open Town Map →"
    townsWithContent.add(townSlug);
    buildSidebar();

    // Open the new map tool in a new tab
    window.open('map_tool.html?town=' + townSlug + (PLAYER_TEST ? '&player_test' : ''), '_blank');
  } catch(e) {
    console.error('Map upload failed:', e);
    if (btn) { btn.textContent = 'Add a location map'; btn.disabled = false; }
    alert('Map upload failed: ' + e.message);
  }
});

// The old offline service worker cached this page stale. Remove any registered
// worker and purge all caches so pages always load fresh from the server. The
// retired nocropi-sw.js (if a stale page re-registers it) unregisters itself too.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => r.unregister())).catch(() => {});
}
if (window.caches) { caches.keys().then(ks => ks.forEach(k => caches.delete(k))).catch(() => {}); }

<script>
// Wire the static control buttons (converted from inline onclick= handlers). This runs
// independently of the main DOMContentLoaded init above so the controls work even if the
// server fetch there bails. Arrow wrappers defer name lookup to click time, so the
// handler functions only need to be global by the time a button is clicked.
(function () {
  function wire(id, fn) { const el = document.getElementById(id); if (el) el.addEventListener('click', fn); }
  function wireControls() {
    wire('btn-maptools',       () => toggleMapTools());
    wire('btn-labels',         () => toggleLabels());
    wire('btn-hexgrid',        () => toggleHexGrid());
    wire('btn-coords',         () => toggleCoords());
    wire('btn-edit',           () => toggleEdit());
    wire('btn-party-loc',      () => partyLocationAction());
    wire('btn-addtown',        () => toggleAddDropdown());
    wire('btn-zoom-in',        () => zoomStep(0.25));
    wire('btn-zoom-out',       () => zoomStep(-0.25));
    wire('btn-zoom-reset',     () => resetView());
    wire('btn-submit-addtown', () => submitAddTown());
    wire('btn-cancel-addtown', () => closeAddTown());
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', wireControls);
  else wireControls();
})();
</script>
