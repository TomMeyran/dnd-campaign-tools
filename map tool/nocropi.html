<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Regional Atlas</title>
<style>
/* ── TOKENS ─────────────────────────────────────────────── */
:root {
  --ink:        #1c1208;
  --ink-mid:    #3b2a14;
  --ink-faint:  #6b4f2e;
  --parchment:  #f2e8d0;
  --parchment-dark: #e0cfa8;
  --parchment-deep: #c9b47e;
  --seal-red:   #8b2020;
  --seal-red-h: #a82828;
  --seal-gold:  #c8922a;
  --seal-glow:  rgba(200,146,42,0.35);
  --shadow:     rgba(28,18,8,0.55);
  --sidebar-w:  300px;
  --header-h:   54px;
}

/* ── RESET ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--ink); }

/* ── TYPOGRAPHY ──────────────────────────────────────────── */
@import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=IM+Fell+English:ital@0;1&display=swap');
/* On-map label face (Tribal Garamond, served locally). */
@font-face {
  font-family: 'Tribal Garamond';
  src: url('TribalGaramond.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
/* Blue fill + gold border in Tribal Garamond is applied directly to the on-map label
   classes below: .marker-label (location names), .marker-text .marker-label (text markers),
   and .party-label (the party marker's "Party"/"Location"). */

body {
  font-family: 'IM Fell English', Georgia, serif;
  color: var(--ink);
}
.display { font-family: 'Cinzel', 'Trajan Pro', serif; }

/* ── INKED BORDER FRAME (signature element) ──────────────── */
#frame {
  position: fixed; inset: 0;
  pointer-events: none;
  z-index: 200;
}
#frame::before {
  content: '';
  position: absolute; inset: 8px;
  border: 3px solid var(--ink-mid);
  box-shadow:
    inset 0 0 0 2px var(--parchment-deep),
    inset 0 0 0 5px var(--ink-faint),
    0 0 0 2px var(--ink-mid);
  pointer-events: none;
}
/* corner ornaments */
#frame::after {
  content: '✦';
  position: absolute;
  top: 4px; left: 4px;
  font-size: 18px;
  color: var(--seal-gold);
  line-height: 1;
  pointer-events: none;
}
.corner { position: fixed; font-size: 18px; color: var(--seal-gold); z-index: 201; pointer-events: none; line-height:1; }
.corner.tr { top: 4px; right: 6px; }
.corner.bl { bottom: 6px; left: 4px; }
.corner.br { bottom: 6px; right: 6px; }

/* ── LAYOUT ──────────────────────────────────────────────── */
#layout {
  display: flex;
  flex-direction: column;
  width: 100%; height: 100%;
  padding: 11px; /* inset to sit inside the decorative frame border */
}

/* ── HEADER ──────────────────────────────────────────────── */
#header {
  height: var(--header-h);
  background: var(--ink);
  border-bottom: 2px solid var(--ink-faint);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 22px 0 20px;
  flex-shrink: 0;
  position: relative; z-index: 100;
}
#header h1 {
  font-family: 'Cinzel', serif;
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .18em;
  color: var(--seal-gold);
  text-shadow: 0 0 18px var(--seal-glow);
  text-transform: uppercase;
}
#header h1 span {
  font-size: 11px;
  font-weight: 400;
  letter-spacing: .22em;
  color: var(--parchment-deep);
  margin-left: 14px;
  vertical-align: middle;
  font-family: 'IM Fell English', serif;
  font-style: italic;
}
/* Controls fill the space to the right of the title so the first group (NPC tool, Edit DB,
   Players) sits on the left while Map Tools is pushed to the far right (margin-left:auto). */
#header-controls { display: flex; gap: 8px; align-items: center; flex: 1; margin-left: 22px; }
#maptools-wrap { margin-left: auto; }
/* Atlas title; the DM View badge is absolutely positioned beneath it, centered under
   the "Regional Atlas" subtitle span (positioned in JS by positionDmBadge). */
.atlas-title-col { position: relative; display: flex; flex-direction: column; justify-content: center; }
.atlas-title-col h1 { margin: 0; }

/* ── BUTTONS ─────────────────────────────────────────────── */
.btn {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 5px 12px;
  border: 1.5px solid var(--ink-faint);
  background: transparent;
  color: var(--parchment-deep);
  cursor: pointer;
  transition: background .15s, color .15s, border-color .15s;
}
.btn:hover { background: var(--ink-faint); color: var(--parchment); border-color: var(--parchment-deep); }
.btn.active { background: var(--seal-red); color: var(--parchment); border-color: var(--seal-red-h); }
.btn-gold {
  background: var(--seal-gold);
  color: var(--ink);
  border-color: var(--seal-gold);
  font-weight: 600;
}
.btn-gold:hover { background: #e0a430; border-color: #e0a430; }

/* ── BODY ROW ────────────────────────────────────────────── */
#body-row {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* ── SIDEBAR ─────────────────────────────────────────────── */
#sidebar {
  width: var(--sidebar-w);
  background: var(--parchment);
  border-right: 2px solid var(--ink-mid);
  display: flex; flex-direction: column;
  flex-shrink: 0;
  overflow: hidden;
  position: relative;
  z-index: 10;
}
#sidebar-head {
  padding: 14px 16px 10px;
  background: var(--parchment-dark);
  border-bottom: 1.5px solid var(--parchment-deep);
  flex-shrink: 0;
}
#sidebar-head h2 {
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 8px;
}
#search {
  width: 100%;
  padding: 6px 10px;
  border: 1.5px solid var(--parchment-deep);
  background: var(--parchment);
  font-family: 'IM Fell English', serif;
  font-size: 13px;
  color: var(--ink);
  outline: none;
}
#search:focus { border-color: var(--ink-faint); }
#search::placeholder { color: var(--ink-faint); font-style: italic; }

#location-count {
  font-size: 10px;
  font-family: 'Cinzel', serif;
  letter-spacing: .1em;
  color: var(--ink-faint);
  margin-top: 6px;
}

#location-list {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
}
#location-list::-webkit-scrollbar { width: 6px; }
#location-list::-webkit-scrollbar-track { background: var(--parchment-dark); }
#location-list::-webkit-scrollbar-thumb { background: var(--parchment-deep); }

/* ── LOCATION ENTRY ──────────────────────────────────────── */
.loc-entry {
  padding: 10px 16px;
  border-bottom: 1px solid var(--parchment-dark);
  cursor: pointer;
  transition: background .12s;
  position: relative;
}
.loc-entry:hover { background: var(--parchment-dark); }
.loc-entry.highlighted { background: #f5e8c0; border-left: 3px solid var(--seal-gold); padding-left: 13px; }
.loc-entry.hidden { display: none; }

.loc-type {
  font-family: 'Cinzel', serif;
  font-size: 8.5px;
  letter-spacing: .16em;
  text-transform: uppercase;
  color: var(--ink-faint);
  margin-bottom: 2px;
}
.loc-name {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-mid);
  margin-bottom: 3px;
}
.loc-desc {
  font-size: 11.5px;
  font-style: italic;
  color: var(--ink-faint);
  line-height: 1.4;
}
.loc-npc-count {
  font-size: 10px;
  font-family: 'Cinzel', serif;
  color: var(--seal-gold, #b89040);
  margin-top: 2px;
  letter-spacing: 0.05em;
}
.loc-link {
  display: inline-block;
  margin-top: 6px;
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--seal-red);
  text-decoration: none;
  border-bottom: 1px solid transparent;
  transition: border-color .12s;
}
.loc-link:hover { border-bottom-color: var(--seal-red); }
.loc-link.no-page { color: var(--ink-faint); pointer-events: none; }
button.loc-link { background: none; border: none; border-bottom: 1px solid transparent; padding: 0; cursor: pointer; }
button.loc-link:hover { border-bottom-color: var(--seal-red); }
button.loc-link:disabled { color: var(--ink-faint); cursor: wait; }

/* ── DM VIEW ─────────────────────────────────────────────── */
.loc-name-input {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-mid);
  margin-bottom: 3px;
  background: transparent;
  border: 1px solid transparent;
  padding: 0 2px;
  width: 100%;
  outline: none;
  display: block;
}
.loc-name-input:hover { border-color: rgba(100,80,40,0.35); background: rgba(255,252,220,0.6); }
.loc-name-input:focus { border-color: var(--seal-gold); background: rgba(255,252,220,0.9); }

.loc-remove-btn {
  position: absolute;
  bottom: 8px; right: 10px;
  border: 1px solid rgba(180,60,60,0.45);
  background: rgba(180,60,60,0.1);
  color: #c06060;
  font-size: 13px;
  line-height: 1;
  padding: 1px 5px 2px;
  cursor: pointer;
  border-radius: 2px;
  z-index: 1;
  opacity: 0;
  transition: opacity 0.15s, background 0.15s, color 0.15s;
}
.loc-entry:hover .loc-remove-btn { opacity: 1; }
.loc-remove-btn:hover { background: rgba(180,60,60,0.28); color: #f09090; border-color: rgba(200,80,80,0.8); }

.loc-vis-btn {
  position: absolute;
  top: 8px; right: 10px;
  border: 1px solid rgba(60,180,80,0.7);
  background: rgba(60,180,80,0.22);
  color: #80f080;
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  padding: 2px 7px;
  border-radius: 2px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  z-index: 1;
}
.loc-vis-btn.hidden-state {
  border-color: rgba(180,80,80,0.6);
  background: rgba(180,80,80,0.18);
  color: #f0a0a0;
}
.loc-entry.dm-hidden {
  opacity: 0.45;
  background: rgba(180,30,30,0.06);
}
.loc-entry.dm-hidden:hover { background: rgba(180,30,30,0.1); }

/* ── MAP AREA ────────────────────────────────────────────── */
#map-area {
  flex: 1;
  overflow: hidden;
  position: relative;
  background: var(--ink);
  cursor: grab;
}
#map-area.grabbing { cursor: grabbing; }
#map-area.edit-mode { cursor: crosshair; }

/* ── ZOOM/PAN VIEWPORT ───────────────────────────────────── */
#map-viewport {
  position: absolute;
  top: 0; left: 0;
  transform-origin: 0 0;
  /* transform set by JS */
}

/* ── MAP IMAGE ───────────────────────────────────────────── */
#map-img {
  display: block;
  /* actual size set by JS once image loads */
  image-rendering: pixelated;
  image-rendering: -webkit-optimize-contrast;
  user-select: none;
  -webkit-user-drag: none;
}
/* fallback parchment when map.png missing */
#map-img-fallback {
  display: flex;
  align-items: center;
  justify-content: center;
  background:
    repeating-linear-gradient(0deg,   transparent, transparent 39px, rgba(28,18,8,.06) 40px),
    repeating-linear-gradient(90deg,  transparent, transparent 39px, rgba(28,18,8,.06) 40px),
    radial-gradient(ellipse at 30% 40%, #e8d9aa 0%, #d4b96a 40%, #b8943a 100%);
  font-family: 'Cinzel', serif;
  font-size: 22px;
  letter-spacing: .14em;
  color: var(--ink-faint);
  text-align: center;
  flex-direction: column;
  gap: 10px;
}
#map-img-fallback .fallback-sub {
  font-family: 'IM Fell English', serif;
  font-size: 13px;
  font-style: italic;
  letter-spacing: .04em;
}

/* ── PARTY MARKER ────────────────────────────────────────── */
#party-marker {
  position: absolute;
  /* Centred on the point: "Party" above, the star on it, "Location" below. */
  transform: translate(-50%, -50%);
  z-index: 25;
  pointer-events: none;
  text-align: center;
  transition: filter .15s;
  display: none;
}
.party-star-wrap { display: flex; justify-content: center; }
#party-marker.dm-movable {
  pointer-events: all;
  cursor: grab;
}
#party-marker.dm-movable:hover { filter: drop-shadow(0 0 6px rgba(80,200,40,.9)); }
#party-marker.dragging { cursor: grabbing !important; filter: drop-shadow(0 0 8px rgba(80,200,40,1)); }
/* Interlaced 8-pointed star (octagram): 8 equal-width chords that weave over/under.
   A single gold "hot-spot" travels LEFT around the ring: one line is full gold, the two
   beside it are half-gold (one rising red→orange→gold, one falling), and the rest trail
   off as red at 50→40→30→20→10 brightness, then a fully-black line before the gold returns.
   One keyframe walks a line through the whole 8-slot profile; the 8 chords are staggered by
   1/8 of the loop each (via negative delay) so together they cover every slot at all times. */
@keyframes party-gold-sweep {
  /* slot 0 — the gold peak */
  0%,   100% { stroke: #ffd23a; }                 /* full gold */
  /* falling side (just left of peak in the timeline = the line the peak just passed) */
  12.5%      { stroke: #f0a028; }                 /* half gold, warm, fading */
  /* the red trail, dimming 50 → 10 */
  25%        { stroke: hsl(0 90% 50%); }          /* red 50 */
  37.5%      { stroke: hsl(0 90% 40%); }          /* red 40 */
  50%        { stroke: hsl(0 90% 30%); }          /* red 30 */
  62.5%      { stroke: hsl(0 90% 20%); }          /* red 20 */
  75%        { stroke: hsl(0 88% 10%); }          /* red 10 */
  81%        { stroke: #000; }                    /* the black line */
  /* rising side — red → orange → gold as the peak approaches */
  87.5%      { stroke: #c33010; }                 /* deep red, warming */
  93.75%     { stroke: #e8781c; }                 /* orange */
}
.party-svg { display: block; overflow: visible; }
.party-svg .oct-line {
  fill: none;
  stroke: #ffd23a;
  stroke-width: 2.4;
  stroke-linecap: round;
  animation: party-gold-sweep 1.867s linear infinite;
}
/* Stagger the 8 chords by 1/8 loop each so the gold peak sweeps around the star. The delay
   order follows the chords' physical position around the centre (by midpoint angle), NOT their
   draw order — that keeps the gold peak and its two half-gold neighbours spatially adjacent.
   Spatial ring order = children 2,3,4,5,6,7,8,1 (going leftward). 1.867s / 8 ≈ 0.233s per slot. */
.party-svg .oct-line:nth-child(2) { animation-delay: 0s;      }
.party-svg .oct-line:nth-child(3) { animation-delay: -0.233s; }
.party-svg .oct-line:nth-child(4) { animation-delay: -0.467s; }
.party-svg .oct-line:nth-child(5) { animation-delay: -0.7s;   }
.party-svg .oct-line:nth-child(6) { animation-delay: -0.933s; }
.party-svg .oct-line:nth-child(7) { animation-delay: -1.167s; }
.party-svg .oct-line:nth-child(8) { animation-delay: -1.4s;   }
.party-svg .oct-line:nth-child(1) { animation-delay: -1.633s; }
.party-label {
  white-space: nowrap;
  /* Blue fill + gold border in Tribal Garamond, matching the other on-map labels. */
  font-family: 'Tribal Garamond', 'Cinzel', serif;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: #122a6b;
  -webkit-text-stroke: 0.5px #c8922a;
  text-stroke: 0.5px #c8922a;
  paint-order: stroke fill;
  text-shadow: 0 0 4px rgba(0,0,0,.9), 0 0 8px rgba(0,0,0,.7);
  pointer-events: none;
  user-select: none;
  line-height: 1.15;
}
.party-label-top { margin-bottom: 1px; }      /* "Party"    — above the star */
.party-label-bot { margin-top: 1px; }         /* "Location" — below the star */

/* ── MARKERS LAYER ───────────────────────────────────────── */
#markers-layer {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
}

/* ── HEX GRID OVERLAY ────────────────────────────────────── */
/* Animated hexagonal travel grid drawn over the map image but
   beneath the markers.  Fill (the hex outline colour) cycles
   black → red over 10s, then back. */
#hex-grid-overlay {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 5;
  opacity: 0.55;
}
#hex-grid-overlay.hidden { display: none; }
#hex-grid-overlay path {
  animation: hex-grid-color 10s ease-in-out infinite alternate;
}
@keyframes hex-grid-color {
  from { stroke: #000000; }
  to   { stroke: #e01818; }
}

/* ── MAP TOOLS DROPDOWN (DM) ─────────────────────────────── */
.maptools-wrap { position: relative; display: inline-block; }
#maptools-menu {
  display: none;
  position: absolute;
  top: calc(100% + 4px);
  right: 0;
  min-width: 172px;
  background: var(--parchment);
  border: 1px solid var(--ink-mid);
  box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  z-index: 200;
  padding: 3px 0;
}
#maptools-menu.open { display: block; }
.maptools-item {
  display: block;
  width: 100%;
  padding: 8px 14px;
  background: none;
  border: none;
  border-bottom: 1px solid rgba(100,70,30,0.12);
  text-align: left;
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink);
  cursor: pointer;
  transition: background .12s, color .12s;
}
.maptools-item:hover { background: var(--parchment-deep); }
/* An active toggle (grid on, coords on, edit on, locations hidden) reads as a filled row */
.maptools-item.active { background: var(--seal-red); color: var(--parchment); }
.maptools-sub { position: relative; border-bottom: 1px solid rgba(100,70,30,0.12); }
.maptools-sub > .maptools-item { border-bottom: none; }
/* Inline hex-grid cell-size field, revealed only when the grid is on */
.maptools-inline { display: none; padding: 6px 14px 9px; background: rgba(100,70,30,0.06); }
.maptools-inline.show { display: block; }
.maptools-inline label {
  display: block;
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: .1em;
  text-transform: uppercase;
  color: var(--ink-mid);
  margin-bottom: 4px;
}
.maptools-inline input {
  width: 100%;
  background: #fffdf6;
  border: 1px solid var(--ink-faint);
  color: var(--ink);
  font-family: 'Cinzel', serif;
  font-size: 13px;
  padding: 4px 6px;
  border-radius: 3px;
  outline: none;
}
.maptools-inline input:focus { border-color: var(--seal-gold, #c8922a); }
.maptools-inline-hint { margin-top: 5px; font-size: 9px; font-style: italic; color: var(--ink-mid); }
/* Nested "Add" submenu, opens to the left of the parent menu */
.maptools-item-caret { display: flex !important; align-items: center; justify-content: space-between; }
.maptools-caret { font-size: 9px; opacity: .7; }
.maptools-submenu {
  display: none;
  position: absolute;
  top: 0;
  right: 100%;
  margin-right: 1px;
  min-width: 148px;
  background: var(--parchment);
  border: 1px solid var(--ink-mid);
  box-shadow: 0 4px 16px rgba(0,0,0,0.45);
  z-index: 210;
  padding: 3px 0;
}
.maptools-submenu.open { display: block; }
/* Gold variant of the NPC-tool pill, used for the "Edit DB" button */
.npc-tool-btn-gold {
  background: rgba(200,146,42,0.22);
  border-color: rgba(200,146,42,0.55);
  color: #e8c96a;
}
.npc-tool-btn-gold:hover { background: rgba(200,146,42,0.45); color: #fff; }

/* ── INDIVIDUAL MARKER ───────────────────────────────────── */
.marker {
  position: absolute;
  transform: translate(-50%, -100%);
  pointer-events: none;       /* invisible + non-interactive outside edit mode */
  cursor: pointer;
  z-index: 10;
  transition: filter .15s;
}

/* wax-seal SVG marker */
.marker-seal {
  width: 28px; height: 28px;
  display: block;
  opacity: 0;
  transition: opacity .15s;
}
.marker-label {
  position: absolute;
  left: 50%; top: calc(100% + 2px);
  transform: translateX(-50%);
  white-space: nowrap;
  /* Blue fill + gold border in Tribal Garamond (on-map label styling). */
  font-family: 'Tribal Garamond', 'Cinzel', serif;
  font-size: 26px;
  font-weight: 600;
  letter-spacing: .08em;
  color: #122a6b;
  -webkit-text-stroke: 0.7px #c8922a;
  text-stroke: 0.7px #c8922a;
  paint-order: stroke fill;
  text-shadow: 0 0 5px rgba(242,232,208,0.9);      /* soft parchment halo for legibility */
  pointer-events: none;
  user-select: none;
  opacity: 0;
  transition: opacity .15s;
}

/* Edit mode: show everything and restore interactivity */
#map-area.edit-mode .marker                     { pointer-events: all; }
#map-area.edit-mode .marker .marker-seal        { opacity: 1; }
#map-area.edit-mode .marker:hover               { filter: drop-shadow(0 0 6px var(--seal-gold)); z-index: 20; }
#map-area.edit-mode .marker.active              { filter: drop-shadow(0 0 10px var(--seal-gold)); z-index: 30; }
#map-area.edit-mode .marker.edit-dragging       { cursor: move !important; z-index: 50; }

.marker-label.show { opacity: 1; }

/* ── TOOLTIP ─────────────────────────────────────────────── */
#tooltip {
  position: fixed;
  z-index: 150;
  background: var(--ink);
  border: 1.5px solid var(--ink-faint);
  padding: 10px 14px;
  max-width: 240px;
  pointer-events: none;
  opacity: 0;
  transition: opacity .15s;
}
#tooltip.visible { opacity: 1; }
#tooltip-type {
  font-family: 'Cinzel', serif;
  font-size: 8px;
  letter-spacing: .18em;
  text-transform: uppercase;
  color: var(--seal-gold);
  margin-bottom: 3px;
}
#tooltip-name {
  font-family: 'Cinzel', serif;
  font-size: 14px;
  font-weight: 600;
  color: var(--parchment);
  margin-bottom: 5px;
}
#tooltip-desc {
  font-size: 11.5px;
  font-style: italic;
  color: var(--parchment-deep);
  line-height: 1.45;
}
#tooltip-hint {
  margin-top: 7px;
  font-family: 'Cinzel', serif;
  font-size: 8.5px;
  letter-spacing: .1em;
  color: var(--seal-gold);
}

/* ── ZOOM CONTROLS ───────────────────────────────────────── */
#zoom-controls {
  position: absolute;
  bottom: 22px; right: 18px;
  display: flex; flex-direction: column; gap: 4px;
  z-index: 50;
}
.zoom-btn {
  width: 32px; height: 32px;
  background: var(--ink-mid);
  border: 1.5px solid var(--ink-faint);
  color: var(--parchment-deep);
  font-size: 18px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Cinzel', serif;
  transition: background .12s, color .12s;
  user-select: none;
}
.zoom-btn:hover { background: var(--ink-faint); color: var(--parchment); }
#zoom-label {
  text-align: center;
  font-family: 'Cinzel', serif;
  font-size: 9px;
  letter-spacing: .1em;
  color: var(--parchment-deep);
  user-select: none;
}

/* ── COMPASS ROSE ─────────────────────────────────────────── */
#compass {
  position: absolute;
  bottom: 22px; left: 18px;
  z-index: 50;
  opacity: .75;
  pointer-events: none;
}

/* ── PLAYER LINK BAR ─────────────────────────────────────── */
.player-link-bar {
  display: none;
  align-items: center;
  gap: 0.5rem;
  background: rgba(20,60,20,0.5);
  border: 1px solid rgba(60,160,60,0.4);
  border-radius: 4px;
  padding: 4px 10px;
  max-width: 380px;
}
.player-link-bar.visible { display: flex; }
.player-link-label {
  font-family: 'Cinzel', serif;
  font-size: 0.6rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: #80c880;
  white-space: nowrap;
  flex-shrink: 0;
}
.player-link-url {
  font-size: 0.68rem;
  color: #a8e0a8;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
  min-width: 0;
}
.player-link-copy {
  background: rgba(60,160,60,0.2);
  border: 1px solid rgba(60,160,60,0.4);
  color: #80c880;
  font-size: 0.65rem;
  padding: 2px 8px;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  font-family: 'Cinzel', serif;
  transition: background 0.12s;
}
.player-link-copy:hover { background: rgba(60,160,60,0.4); color: #fff; }
.player-link-copy.copied { background: rgba(60,160,60,0.6); color: #fff; }
/* NPC Tool button — standalone, left of the Players field, red like the DM-view accents */
.npc-tool-btn {
  background: rgba(180,30,30,0.2);
  border: 1px solid rgba(200,50,50,0.45);
  color: #e07070;
  font-size: 0.65rem;
  padding: 2px 10px;
  border-radius: 3px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  font-family: 'Cinzel', serif;
  transition: background 0.12s;
}
.npc-tool-btn:hover { background: rgba(200,50,50,0.4); color: #fff; }

/* ── PLAYER LINKS MODAL ─────────────────────────────────── */
#plkModal { position: fixed; inset: 0; z-index: 9000; display: none; align-items: center; justify-content: center; }
#plkModal.open { display: flex; }
.plk-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,0.6); }
.plk-dialog { position: relative; background: #161b22; color: #cdd9e5; border: 1px solid #30363d; border-radius: 8px; width: min(660px,94vw); max-height: 88vh; display: flex; flex-direction: column; box-shadow: 0 12px 48px rgba(0,0,0,0.6); font-family: system-ui,'Segoe UI',sans-serif; }
.plk-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid #30363d; }
.plk-title { font-size: 1rem; font-weight: 600; color: #e8c96a; }
.plk-close { background: none; border: none; color: #8b949e; font-size: 1.1rem; cursor: pointer; }
.plk-body { padding: 12px 16px; overflow-y: auto; }
.plk-status { font-size: 0.76rem; color: #8b949e; margin-bottom: 10px; line-height: 1.6; }
.plk-status .warn { color: #d29922; }
.plk-status .ok { color: #3fb950; }
.plk-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }
.plk-table th { text-align: left; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.07em; color: #8b949e; padding: 4px 6px; border-bottom: 1px solid #30363d; }
.plk-table td { padding: 4px 6px; border-bottom: 1px solid #21262d; vertical-align: middle; }
.plk-table input, .plk-table select { width: 100%; background: #0d1117; border: 1px solid #30363d; color: #cdd9e5; border-radius: 3px; padding: 3px 5px; font-size: 0.78rem; }
.plk-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #545d68; }
.plk-dot.on { background: #3fb950; }
.plk-mini { background: #21262d; border: 1px solid #30363d; color: #cdd9e5; border-radius: 3px; font-size: 0.68rem; padding: 3px 8px; cursor: pointer; }
.plk-mini:hover { background: #2d333b; }
.plk-mini.danger:hover { background: #8b2020; border-color: #c04040; color: #fff; }
.plk-foot { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-top: 1px solid #30363d; flex-wrap: wrap; }
.plk-btn { background: #2a1e0c; color: #e8c96a; border: 1px solid #6a4a10; border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 0.82rem; }
.plk-btn:hover { background: #3a2a10; color: #fff; }
.plk-btn.prim { background: #b8860b; color: #000; border-color: #d4a017; font-weight: 600; }
.plk-btn.prim:hover { background: #d4a017; }
.plk-send-msg { font-size: 0.76rem; color: #8b949e; }

/* ── SCROLLBAR (sidebar) ─────────────────────────────────── */
* { scrollbar-width: thin; scrollbar-color: var(--parchment-deep) var(--parchment-dark); }

/* ── COMPASS LOADING ANIMATION ───────────────────────────── */
@keyframes compass-loading {
  0%   { transform: rotate(0deg);    }
  18%  { transform: rotate(320deg);  }   /* fast burst */
  28%  { transform: rotate(340deg);  }   /* brief slow */
  46%  { transform: rotate(660deg);  }   /* fast burst */
  56%  { transform: rotate(680deg);  }   /* brief slow */
  74%  { transform: rotate(1000deg); }   /* fast burst */
  84%  { transform: rotate(1020deg); }   /* brief slow */
  100% { transform: rotate(1360deg); }   /* fast to end */
}
#compass-needle {
  transform-box:    fill-box;
  transform-origin: 50% 50%;
}
#compass-needle.loading {
  animation: compass-loading 2.4s linear infinite;
}

/* ── COORDS DISPLAY ─────────────────────────────────────── */
#coords-display {
  display: none;
  position: absolute;
  bottom: 22px; left: 96px;   /* right of the compass */
  background: rgba(28,18,8,.88);
  border: 1px solid var(--ink-faint);
  padding: 5px 10px;
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: .1em;
  color: var(--parchment-deep);
  z-index: 50;
  pointer-events: none;
  white-space: nowrap;
  min-width: 110px;
  text-align: center;
}
#map-area.show-coords #coords-display { display: block; }

/* ── PLACEMENT MODE ─────────────────────────────────────── */
#map-area.placement-mode { cursor: crosshair !important; }
#placement-banner {
  display: none;
  position: absolute;
  top: 12px; left: 50%; transform: translateX(-50%);
  background: var(--seal-gold);
  color: var(--ink);
  font-family: 'Cinzel', serif;
  font-size: 11px;
  letter-spacing: .12em;
  text-transform: uppercase;
  padding: 7px 20px;
  z-index: 60;
  pointer-events: none;
  white-space: nowrap;
  box-shadow: 0 2px 12px var(--shadow);
}
#map-area.placement-mode #placement-banner { display: block; }

/* ── TEXT-ONLY MARKER ───────────────────────────────────── */
.marker.marker-text { pointer-events: none; }
#map-area.edit-mode .marker.marker-text { pointer-events: all; }
.marker.marker-text .marker-label {
  position: relative;
  top: auto; left: auto;
  transform: none;
  opacity: 1 !important;
  /* Blue fill + gold border in Tribal Garamond, on a parchment chip. */
  font-family: 'Tribal Garamond', 'IM Fell English', serif;
  font-size: 12px;
  font-style: normal;
  color: #122a6b;
  -webkit-text-stroke: 0.4px #c8922a;
  text-stroke: 0.4px #c8922a;
  paint-order: stroke fill;
  text-shadow: none;
  background: rgba(242,232,204,0.88);
  padding: 1px 6px;
  border-radius: 2px;
  white-space: nowrap;
  pointer-events: none;
  box-shadow: 0 1px 4px rgba(0,0,0,0.2);
}
#map-area.edit-mode .marker.marker-text .marker-label { pointer-events: auto; }

/* ── ADD LOCATION MODAL ─────────────────────────────────── */
#addtown-overlay {
  display: none;
  position: fixed; inset: 0;
  background: rgba(28,18,8,.82);
  z-index: 300;
  align-items: center; justify-content: center;
}
#addtown-overlay.open { display: flex; }
#addtown-box {
  background: var(--parchment);
  border: 2px solid var(--ink-mid);
  padding: 28px 32px;
  max-width: 420px; width: 90%;
}
#addtown-box h3 {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--ink);
  margin-bottom: 16px;
}
#addtown-name {
  width: 100%;
  padding: 8px 12px;
  border: 1.5px solid var(--parchment-deep);
  background: var(--parchment);
  font-family: 'Cinzel', serif;
  font-size: 14px;
  color: var(--ink);
  outline: none;
  margin-bottom: 8px;
  box-sizing: border-box;
}
#addtown-name:focus { border-color: var(--ink-faint); }
#addtown-hint {
  font-family: 'IM Fell English', serif;
  font-size: 11px;
  font-style: italic;
  color: var(--ink-faint);
  margin-bottom: 16px;
  line-height: 1.5;
}
#addtown-actions { display: flex; gap: 8px; }
</style>
</head>
<body>

<input type="file" id="map-img-upload" accept="image/*" style="display:none">

<!-- corner ornaments -->
<div class="corner tr">✦</div>
<div class="corner bl">✦</div>
<div class="corner br">✦</div>
<div id="frame"></div>

<div id="layout">

  <!-- HEADER -->
  <div id="header">
    <div class="atlas-title-col">
      <h1 class="display"><span class="atlas-sub">Regional Atlas</span></h1>
      <span id="dmViewBadge" style="display:none;position:absolute;top:100%;left:0;transform:translateX(-50%);margin-top:2px;background:rgba(180,30,30,0.15);border:1px solid rgba(200,50,50,0.4);color:#e07070;font-size:7.5px;letter-spacing:.1em;padding:1px 6px;border-radius:2px;font-family:'Cinzel',serif;text-transform:uppercase;white-space:nowrap">DM View</span>
    </div>
    <div id="header-controls">
      <button type="button" class="npc-tool-btn" id="btn-npc-tool-2" style="display:none">NPC tool</button>
      <button type="button" class="npc-tool-btn npc-tool-btn-gold" id="btn-creation" style="display:none">Edit DB</button>
      <div class="player-link-bar" id="playerLinkBar">
        <span class="player-link-label">Players</span>
        <button type="button" class="player-link-copy" id="playerLinksBtn">Player Links</button>
        <button type="button" class="player-link-copy" id="btn-sync-players" style="display:none" title="Refresh every open player tool and re-sync all views">Sync players</button>
      </div>

      <!-- MAP TOOLS DROPDOWN — collects every map-editing control -->
      <div class="maptools-wrap" id="maptools-wrap">
        <button class="btn btn-gold" id="btn-maptools" type="button">Map Tools ▾</button>
        <div id="maptools-menu">
          <button class="maptools-item active" id="btn-labels" type="button">Hide Locations</button>

          <!-- Hex Grid: toggle row + inline cell-size field shown when on (DM only) -->
          <div class="maptools-sub" id="hexgrid-wrap" style="display:none">
            <button class="maptools-item" id="btn-hexgrid" type="button">Hex Grid</button>
            <div class="maptools-inline" id="hexgrid-inline">
              <label for="hexgrid-scale">Cell size (px)</label>
              <input type="number" id="hexgrid-scale" min="10" max="2000" step="1" value="112">
              <div class="maptools-inline-hint">Smaller = finer grid</div>
            </div>
          </div>

          <button class="maptools-item" id="btn-coords" type="button">Coords</button>
          <button class="maptools-item" id="btn-edit" type="button" style="display:none">Edit Positions</button>

          <!-- Party Location: set (click-to-place) when unset, jump-to when set -->
          <button class="maptools-item" id="btn-party-loc" type="button" style="display:none">Party Location</button>

          <!-- Add: nested submenu (DM only) -->
          <div class="maptools-sub maptools-submenu-wrap" id="add-dropdown-wrap" style="display:none">
            <button class="maptools-item maptools-item-caret" id="btn-addtown" type="button">Add<span class="maptools-caret">▸</span></button>
            <div id="add-dropdown-menu" class="maptools-submenu">
              <button class="maptools-item" id="btn-add-location" type="button">Add Location</button>
              <button class="maptools-item" id="btn-add-marker" type="button">Add Marker</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div id="body-row">

    <!-- SIDEBAR -->
    <div id="sidebar">
      <div id="sidebar-head">
        <h2 class="display">Locations</h2>
        <input id="search" type="text" placeholder="Search towns &amp; places…">
        <div id="location-count"></div>
      </div>
      <div id="location-list"></div>
    </div>

    <!-- MAP AREA -->
    <div id="map-area">
      <div id="map-viewport">
        <!-- map image OR fallback -->
        <img id="map-img" alt="Nocropi regional map"
             draggable="false"
             onload="onMapLoad(this)"
             onerror="onMapError(this)">
        <!-- animated hexagonal travel grid (above image, below markers) -->
        <svg id="hex-grid-overlay" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
          <defs>
            <!-- Two pointy-top hexagons per tile (34.641 × 60) that tile into a
                 seamless honeycomb. Circumradius 20 → neighbour distance √3·20. -->
            <pattern id="hex-pattern" width="34.641" height="60" patternUnits="userSpaceOnUse" patternTransform="scale(3.2)">
              <path fill="none" stroke="#000000" stroke-width="1.4" stroke-linejoin="round"
                    d="M17.3205 0L34.641 10L34.641 30L17.3205 40L0 30L0 10Z
                       M0 30L17.3205 40L17.3205 60L0 70L-17.3205 60L-17.3205 40Z"/>
            </pattern>
          </defs>
          <rect width="100%" height="100%" fill="url(#hex-pattern)"/>
        </svg>
        <!-- markers go here, positioned absolutely over the image -->
        <div id="markers-layer"></div>
      </div>

      <!-- Zoom controls -->
      <div id="zoom-controls">
        <button class="zoom-btn" id="btn-zoom-in" title="Zoom in">+</button>
        <div id="zoom-label">100%</div>
        <button class="zoom-btn" id="btn-zoom-out" title="Zoom out">−</button>
        <button class="zoom-btn" id="btn-zoom-reset" style="font-size:12px" title="Reset view">⌂</button>
      </div>

      <!-- Compass rose (SVG) -->
      <div id="compass">
        <svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
          <!-- Static outer ring -->
          <circle cx="32" cy="32" r="30" fill="none" stroke="#6b4f2e" stroke-width="1.2" opacity=".7"/>
          <!-- Rotating cross — gets .loading class while map image is loading -->
          <g id="compass-needle">
            <polygon points="32,4 29,32 32,28 35,32" fill="#8b2020"/>
            <polygon points="32,60 29,32 32,36 35,32" fill="#6b4f2e"/>
            <polygon points="60,32 32,29 36,32 32,35" fill="#6b4f2e"/>
            <polygon points="4,32 32,29 28,32 32,35"  fill="#6b4f2e"/>
            <circle cx="32" cy="32" r="3.5" fill="#c8922a"/>
            <text x="32" y="18" text-anchor="middle" font-family="Cinzel,serif" font-size="8" fill="#8b2020" font-weight="700">N</text>
            <text x="32" y="58" text-anchor="middle" font-family="Cinzel,serif" font-size="7" fill="#6b4f2e">S</text>
            <text x="55" y="35" text-anchor="middle" font-family="Cinzel,serif" font-size="7" fill="#6b4f2e">E</text>
            <text x="9"  y="35" text-anchor="middle" font-family="Cinzel,serif" font-size="7" fill="#6b4f2e">W</text>
          </g>
        </svg>
      </div>
      <!-- Placement mode instruction banner -->
      <div id="placement-banner"></div>
      <!-- Real-time position readout -->
      <div id="coords-display">— · —</div>
    </div>

  </div><!-- /body-row -->
</div><!-- /layout -->

<!-- TOOLTIP -->
<div id="tooltip">
  <div id="tooltip-type"></div>
  <div id="tooltip-name"></div>
  <div id="tooltip-desc"></div>
  <div id="tooltip-hint"></div>
</div>

<!-- ADD TOWN MODAL -->
<div id="addtown-overlay">
  <div id="addtown-box">
    <h3 class="display">Add Location</h3>
    <input id="addtown-name" type="text" placeholder="Location name…">
    <div id="addtown-hint">Enter the name of the new location. Click on the map to place it.</div>
    <div id="addtown-actions">
      <button class="btn btn-gold" id="btn-submit-addtown">Add Location</button>
      <button class="btn"          id="btn-cancel-addtown">Cancel</button>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
//  NOCROPI REGIONAL MAP  —  main application script
// ══════════════════════════════════════════════════════════════

// IS_DM is resolved from the server (same logic as map_tool.html).
// Direct localhost access → DM; Cloudflare tunnel → player.
// ?player_test in the URL forces player mode for local testing.
let IS_DM = false;
const PLAYER_TEST = new URLSearchParams(location.search).has('player_test');

// Defaults — overridden by DB content on load
let REGION_NAME          = 'Nocropi';
let MAP_IMAGE_FILENAME   = 'locations/nocropi.webp';
let LOCATION_MAP_DEFAULT = {};
let LOCATIONS            = [];

// Town slugs that have actual content in the DB (populated on init)
let townsWithContent = new Set();
let npcCountByTown = {};

// ── STATE ─────────────────────────────────────────────────────
let mapW = 1200, mapH = 800;   // set properly when image loads
let scale   = 1;
let panX    = 0, panY    = 0;
let minScale = 0.05, maxScale = 6;
let isPanning = false;
let panStartX = 0, panStartY = 0, panOriginX = 0, panOriginY = 0;
let editMode    = false;
let labelsVisible = true;
let activeId    = null;
let positions   = {};          // live copy, may differ from LOCATION_MAP_DEFAULT
let pendingUploadLocId = null;
let draggingMarker = null;
let partyDragging = false;
let _partyPosTimer = null;
let placementMode   = false;
let pendingTownName = null;
let pendingType     = 'Location';
let ghostMarkerEl   = null;
let pendingClick    = false;
let clickStartX     = 0, clickStartY = 0;
let showCoords      = false;

// ── ELEMENTS ──────────────────────────────────────────────────
const mapArea       = document.getElementById('map-area');
const viewport      = document.getElementById('map-viewport');
const markersLayer  = document.getElementById('markers-layer');
const tooltip       = document.getElementById('tooltip');
const zoomLabel     = document.getElementById('zoom-label');
const tooltipType   = document.getElementById('tooltip-type');
const tooltipName   = document.getElementById('tooltip-name');
const tooltipDesc   = document.getElementById('tooltip-desc');
const tooltipHint   = document.getElementById('tooltip-hint');
const coordsDisplay = document.getElementById('coords-display');
const locationCount = document.getElementById('location-count');

// ── BOOT ──────────────────────────────────────────────────────
window.addEventListener('DOMContentLoaded', async () => {
  document.getElementById('compass-needle').classList.add('loading');
  // Start loading the map image immediately so it fetches in parallel with the API
  document.getElementById('map-img').src = MAP_IMAGE_FILENAME;

  // Resolve DM status, location visibility, and content in one round-trip
  try {
    const [auth, regionData] = await Promise.all([
      fetch('/api/whoami').then(r => r.json()),
      fetch('/api/region/nocropi').then(r => r.json())
    ]);
    IS_DM = auth.isDM && !PLAYER_TEST;
    if (window.DiceRoll) DiceRoll.setDM(IS_DM);   // only the DM may right-click a roll → hidden
    townsWithContent = new Set(regionData.townsWithContent || []);
    npcCountByTown = regionData.npcCountByTown || {};
    // Location visibility (and party/hexgrid state) always comes from the database.
    locVisibility = regionData.locPositions || {};
    if (regionData.content) {
      applyRegionContentFromDB(regionData.content);
      // Update src in case DB has a different filename than the default
      document.getElementById('map-img').src = MAP_IMAGE_FILENAME;
    } else {
      showFatalBanner('Region content not found in database.');
      return;
    }
  } catch(e) {
    console.error('Failed to connect to server:', e);
    showFatalBanner('Cannot reach the map server — make sure server.js is running.');
    return;
  }

  // Merge any user-added towns saved in localStorage
  loadCustomLocations();
  // Visibility lives in the DB; keep every tab (DM + players) in sync via SSE.
  // Polling is a players-only fallback for tunnels where SSE can be buffered.
  connectAtlasSSE();
  // The combat panels (initiative + attacks) live in the town map tool, not the atlas.
  if (!IS_DM) startAtlasPolling();
  if (IS_DM) {
    document.getElementById('dmViewBadge').style.display       = '';
    positionDmBadge();
    window.addEventListener('resize', positionDmBadge);
    // NPC tool + Edit DB buttons (DM only) — carry the DM key so the new tab is DM too.
    const openDmTool = (path) => {
      const q = new URLSearchParams();
      const dmkey = new URLSearchParams(location.search).get('dmkey');
      if (dmkey) q.set('dmkey', dmkey);
      q.set('_', Date.now());
      window.open(path + '?' + q.toString(), '_blank');
    };
    const npcTool2 = document.getElementById('btn-npc-tool-2');
    npcTool2.style.display = '';
    npcTool2.addEventListener('click', () => openDmTool('/npcs/npc_tool.html'));
    const creationBtn = document.getElementById('btn-creation');
    creationBtn.style.display = '';
    creationBtn.addEventListener('click', () => openDmTool('/creation.html'));
    document.getElementById('btn-edit').style.display           = '';
    document.getElementById('add-dropdown-wrap').style.display  = '';
    document.getElementById('hexgrid-wrap').style.display       = '';
    document.getElementById('btn-party-loc').style.display      = '';
    // Sync players: hard-refresh every open tool (atlas + NPC tool) for all players + DM,
    // restarting their SSE + polling from a clean state to recover from any drift.
    const syncBtn = document.getElementById('btn-sync-players');
    syncBtn.style.display = '';
    syncBtn.addEventListener('click', async () => {
      await fetch('/api/sync-players', { method: 'POST' }).catch(() => {});
      const orig = syncBtn.textContent;
      syncBtn.classList.add('copied');
      syncBtn.textContent = 'Synced!';
      setTimeout(() => { syncBtn.textContent = orig; syncBtn.classList.remove('copied'); }, 2000);
    });
    fetchTunnelUrl();
    setInterval(fetchTunnelUrl, 10 * 60 * 1000);
    // Player Links button (replaces the raw tunnel link) → roster + Discord delivery
    document.getElementById('playerLinkBar')?.classList.add('visible');
    document.getElementById('playerLinksBtn')?.addEventListener('click', openPlayerLinks);
    document.getElementById('plkClose')?.addEventListener('click', closePlayerLinks);
    document.getElementById('plkBackdrop')?.addEventListener('click', closePlayerLinks);
    document.getElementById('plkAdd')?.addEventListener('click', addPlayer);
    document.getElementById('plkSend')?.addEventListener('click', sendPlayerLinks);
  }

  // Deep-copy default positions (includes any custom ones just loaded)
  positions = {};
  Object.entries(LOCATION_MAP_DEFAULT).forEach(([k,v]) => {
    positions[+k] = { x: v.x, y: v.y };
  });

  // Ensure every listed location has a position; default to map centre if missing
  LOCATIONS.forEach(loc => {
    if (!positions[loc.id]) {
      positions[loc.id]              = { x: 50, y: 50 };
      LOCATION_MAP_DEFAULT[loc.id]   = { x: 50, y: 50 };
    }
  });

  buildSidebar();
  initPartyMarker();
  refreshPartyLocBtn();
  loadHexGridFromVis();
  // If the image loaded from cache before DOMContentLoaded ran, onMapLoad fired
  // before positions were populated and rendered nothing.  Re-run it now so the
  // viewport is properly sized first, then markers are placed inside it.
  const mapImg = document.getElementById('map-img');
  if (mapImg.complete) {
    if (mapImg.naturalWidth > 0) onMapLoad(mapImg);
    else onMapError(mapImg);
  }
  applyTransform();

  // Give map area a moment to measure itself, then fit
  setTimeout(fitView, 80);
});

// ── FATAL BANNER ──────────────────────────────────────────────
function showFatalBanner(message) {
  document.getElementById('compass-needle').classList.remove('loading');
  const banner = document.createElement('div');
  banner.style.cssText = 'position:fixed;top:0;left:0;right:0;padding:10px;background:#8b2020;color:#f2e8cc;text-align:center;z-index:9999;font-family:Cinzel,serif;font-size:0.85rem';
  banner.textContent = message;
  document.body.prepend(banner);
}

// ── MAP LOAD / ERROR ──────────────────────────────────────────
function finalizeMapSetup() {
  document.getElementById('compass-needle').classList.remove('loading');
  viewport.style.width  = mapW + 'px';
  viewport.style.height = mapH + 'px';
  renderMarkers();
  fitView();
}

function onMapLoad(img) {
  mapW = img.naturalWidth  || 1200;
  mapH = img.naturalHeight || 800;
  img.style.width  = mapW + 'px';
  img.style.height = mapH + 'px';
  finalizeMapSetup();
}

function onMapError(img) {
  img.style.display = 'none';
  // Show a styled fallback canvas
  const fb = document.createElement('div');
  fb.id = 'map-img-fallback';
  fb.style.width  = mapW + 'px';
  fb.style.height = mapH + 'px';
  fb.innerHTML = `<div>${escHtml(REGION_NAME)}</div><div class="fallback-sub">Upload a map image using the DM controls</div>`;
  viewport.insertBefore(fb, markersLayer);
  finalizeMapSetup();
}

// ── FIT VIEW ──────────────────────────────────────────────────
function fitView() {
  const areaW = mapArea.clientWidth;
  const areaH = mapArea.clientHeight;
  if (!areaW || !areaH) return;
  const scaleX = areaW / mapW;
  const scaleY = areaH / mapH;
  scale = Math.min(scaleX, scaleY) * 0.92;
  scale = clampScale(scale);
  panX = (areaW - mapW * scale) / 2;
  panY = (areaH - mapH * scale) / 2;
  applyTransform();
}

// ── TRANSFORM ─────────────────────────────────────────────────
function applyTransform() {
  viewport.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
  zoomLabel.textContent = Math.round(scale * 100) + '%';
}

function clampScale(s) {
  return Math.max(minScale, Math.min(maxScale, s));
}

// ── ZOOM ──────────────────────────────────────────────────────
function zoomStep(delta) {
  const areaW = mapArea.clientWidth;
  const areaH = mapArea.clientHeight;
  const cx = areaW / 2, cy = areaH / 2;
  zoomAt(cx, cy, delta);
}

function zoomAt(cx, cy, delta) {
  const newScale = clampScale(scale + delta * scale);
  const ratio = newScale / scale;
  panX = cx - ratio * (cx - panX);
  panY = cy - ratio * (cy - panY);
  scale = newScale;
  applyTransform();
}

function resetView() {
  fitView();
}

// ── MOUSE WHEEL ZOOM ──────────────────────────────────────────
mapArea.addEventListener('wheel', e => {
  e.preventDefault();
  const rect = mapArea.getBoundingClientRect();
  const cx = e.clientX - rect.left;
  const cy = e.clientY - rect.top;
  const delta = e.deltaY < 0 ? 0.12 : -0.12;
  zoomAt(cx, cy, delta);
}, { passive: false });

// ── PAN (mouse) ───────────────────────────────────────────────
mapArea.addEventListener('mousedown', e => {
  if (draggingMarker) return;
  if (editMode && e.target.closest('.marker')) return;
  if (placementMode) {
    pendingClick = true;
    clickStartX  = e.clientX;
    clickStartY  = e.clientY;
  }
  isPanning = true;
  panStartX  = e.clientX;
  panStartY  = e.clientY;
  panOriginX = panX;
  panOriginY = panY;
  mapArea.classList.add('grabbing');
});

window.addEventListener('mousemove', e => {
  if (isPanning) {
    panX = panOriginX + (e.clientX - panStartX);
    panY = panOriginY + (e.clientY - panStartY);
    applyTransform();
  }
  if (draggingMarker) {
    handleMarkerDrag(e);
  }

  if (partyDragging && IS_DM) {
    const raw = clientToMapPct(e.clientX, e.clientY);
    locVisibility['__party__'] = { x: +raw.x.toFixed(3), y: +raw.y.toFixed(3) };
    renderPartyMarker();
    clearTimeout(_partyPosTimer);
    _partyPosTimer = setTimeout(saveLocVisibility, 300);
  }

  // Update ghost marker or coords display only when cursor is over the map area
  const mapRect = mapArea.getBoundingClientRect();
  const overMap = e.clientX >= mapRect.left && e.clientX <= mapRect.right &&
                  e.clientY >= mapRect.top  && e.clientY <= mapRect.bottom;

  if (overMap) {
    const raw = clientToMapPct(e.clientX, e.clientY);

    if (placementMode && ghostMarkerEl) {
      const pos = clientToMarkerPos(e.clientX, e.clientY);
      ghostMarkerEl.style.left = pos.x + '%';
      ghostMarkerEl.style.top  = pos.y + '%';
    }

    if (showCoords) {
      coordsDisplay.textContent = 'X: ' + raw.x.toFixed(1) + '  Y: ' + raw.y.toFixed(1);
    }
  } else if (showCoords) {
    coordsDisplay.textContent = '— · —';
  }
});

window.addEventListener('mouseup', e => {
  if (placementMode && pendingClick) {
    const dx = e.clientX - clickStartX;
    const dy = e.clientY - clickStartY;
    if (Math.hypot(dx, dy) < 6) {
      const pos = clientToMarkerPos(e.clientX, e.clientY);
      finalizePlacement(pos.x, pos.y);
    }
    pendingClick = false;
  }
  isPanning = false;
  mapArea.classList.remove('grabbing');
  if (draggingMarker) {
    const draggedId = draggingMarker.id;
    draggingMarker.el.classList.remove('edit-dragging');
    draggingMarker = null;
    LOCATION_MAP_DEFAULT[draggedId] = positions[draggedId];
    debouncedSavePositions();
  }

  if (partyDragging) {
    partyDragging = false;
    partyMarkerEl?.classList.remove('dragging');
    clearTimeout(_partyPosTimer);
    saveLocVisibility();
  }
});

// Reset all drag state if mouse is released outside the browser window
window.addEventListener('blur', () => {
  if (isPanning)      { isPanning = false; mapArea.classList.remove('grabbing'); }
  if (draggingMarker) { draggingMarker.el.classList.remove('edit-dragging'); draggingMarker = null; }
  if (partyDragging)  { partyDragging = false; partyMarkerEl?.classList.remove('dragging'); clearTimeout(_partyPosTimer); saveLocVisibility(); }
});

// ── TOUCH PAN / PINCH ─────────────────────────────────────────
let lastTouches = null;

mapArea.addEventListener('touchstart', e => {
  lastTouches = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
}, { passive: true });

mapArea.addEventListener('touchmove', e => {
  e.preventDefault();
  const touches = Array.from(e.touches).map(t => ({ x: t.clientX, y: t.clientY }));
  if (!lastTouches) { lastTouches = touches; return; }

  if (touches.length === 1 && lastTouches.length === 1) {
    // Pan
    panX += touches[0].x - lastTouches[0].x;
    panY += touches[0].y - lastTouches[0].y;
    applyTransform();
  } else if (touches.length === 2 && lastTouches.length === 2) {
    // Pinch zoom
    const rect = mapArea.getBoundingClientRect();
    const d0 = dist(lastTouches[0], lastTouches[1]);
    const d1 = dist(touches[0], touches[1]);
    const cx = ((touches[0].x + touches[1].x) / 2) - rect.left;
    const cy = ((touches[0].y + touches[1].y) / 2) - rect.top;
    const newScale = clampScale(scale * (d1 / d0));
    const ratio = newScale / scale;
    panX = cx - ratio * (cx - panX);
    panY = cy - ratio * (cy - panY);
    scale = newScale;
    applyTransform();
  }
  lastTouches = touches;
}, { passive: false });

mapArea.addEventListener('touchend', () => { lastTouches = null; }, { passive: true });

function dist(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

// ── SIDEBAR BUILD ─────────────────────────────────────────────
// ── LOCATION VISIBILITY (DM) ──────────────────────────────────
let locVisibility = {};

let _visSaveTimer = null;
function saveLocVisibility() {
  // Persist to the database only — no browser cache.
  if (!IS_DM) return;
  clearTimeout(_visSaveTimer);
  _visSaveTimer = setTimeout(() => {
    fetch('/api/town/nocropi_atlas', {
      method:  'POST',
      headers: { 'Content-Type': 'application/json' },
      body:    JSON.stringify({ locPositions: locVisibility })
    }).catch(() => {});
  }, 300);
}

function isLocVisible(id) {
  return locVisibility[id] === true;
}

function toggleLocVisibility(id) {
  if (isLocVisible(id)) {
    delete locVisibility[id];   // hide: remove the key
  } else {
    locVisibility[id] = true;   // reveal: set to true
  }
  saveLocVisibility();
  updateLocVisUI();
}

function updateLocVisUI() {
  document.querySelectorAll('.loc-entry').forEach(el => {
    const id = +el.dataset.id;
    if (!Number.isFinite(id)) return;
    const vis = isLocVisible(id);
    el.classList.toggle('dm-hidden', !vis);
    const btn = el.querySelector('.loc-vis-btn');
    if (btn) {
      btn.textContent = vis ? '● Visible' : '○ Hidden';
      btn.classList.toggle('hidden-state', !vis);
    }
  });
  renderMarkers();
}

function buildSidebar() {
  const list = document.getElementById('location-list');
  list.innerHTML = '';
  const locs = IS_DM ? LOCATIONS : LOCATIONS.filter(l => isLocVisible(l.id));
  locs.forEach(loc => {
    const el = document.createElement('div');
    el.className = 'loc-entry';
    el.dataset.id = loc.id;
    if (IS_DM && !isLocVisible(loc.id)) el.classList.add('dm-hidden');

    const isTextMarker = loc.type === 'Marker';
    const pageUrl = loc.page || null;
    const townSlug = townSlugOf(loc);
    const hasTownContent = townSlug ? townsWithContent.has(townSlug) : false;
    // Show "Open Town Map" only when the town has content seeded in the DB.
    // DM additionally sees "Add a location map" for locations not yet set up.
    // Text-only markers (Marker type) never have a town map link.
    const showLink   = !isTextMarker && pageUrl && hasTownContent;
    const showAddMap = !isTextMarker && IS_DM && !hasTownContent;
    el.innerHTML = `
      <div class="loc-type display">${escHtml(loc.type)}</div>
      ${IS_DM
        ? `<input class="loc-name-input display" value="${escHtml(loc.name)}" title="Click to rename">`
        : `<div class="loc-name display">${escHtml(loc.name)}</div>`}
      <div class="loc-desc">${escHtml(loc.desc)}</div>
      ${IS_DM && townSlug && npcCountByTown[townSlug] ? `<div class="loc-npc-count">${escHtml(plural(npcCountByTown[townSlug], 'NPC'))}</div>` : ''}
      ${isTextMarker
        ? ''
        : showLink
          ? `<a class="loc-link display" href="${!/^(javascript|data|vbscript):/i.test(pageUrl) ? escHtml(pageUrl + (PLAYER_TEST ? '&player_test' : '')) : '#'}" target="_blank" rel="noopener"
                onclick="event.stopPropagation()">Open Town Map →</a>`
          : showAddMap
            ? `<button class="loc-link display" data-addmap="${loc.id}">Add a location map</button>`
            : `<span class="loc-link no-page display">No town map yet</span>`}
    `;
    if (IS_DM) {
      const nameInput = el.querySelector('.loc-name-input');
      nameInput.addEventListener('click', e => e.stopPropagation());
      nameInput.addEventListener('change', () => {
        const newName = nameInput.value.trim();
        if (!newName) { nameInput.value = loc.name; return; }
        loc.name = newName;
        renderMarkers();
        saveCustomLocations();
        debouncedSavePositions();
      });
      const addMapBtn = el.querySelector('[data-addmap]');
      if (addMapBtn) addMapBtn.addEventListener('click', e => { e.stopPropagation(); startMapUpload(loc.id); });

      const vis = isLocVisible(loc.id);
      const visBtn = document.createElement('button');
      visBtn.className = 'loc-vis-btn' + (vis ? '' : ' hidden-state');
      visBtn.textContent = vis ? '● Visible' : '○ Hidden';
      visBtn.onclick = e => { e.stopPropagation(); toggleLocVisibility(loc.id); };
      el.appendChild(visBtn);

      const delBtn = document.createElement('button');
      delBtn.className = 'loc-remove-btn';
      delBtn.textContent = '×';
      delBtn.title = 'Remove location';
      delBtn.onclick = e => {
        e.stopPropagation();
        if (confirm(`Remove "${loc.name}"?\nThis cannot be undone.`)) removeMarker(loc.id);
      };
      el.appendChild(delBtn);
    }

    el.addEventListener('click', () => activateLocation(loc.id, true));
    list.appendChild(el);
  });
  updateCount(locs.length, LOCATIONS.length);
}

function updateCount(visible, total) {
  const totalNpcs = IS_DM ? Object.values(npcCountByTown).reduce((s, n) => s + n, 0) : 0;
  const locPart = IS_DM
    ? (visible === total ? plural(total, 'location') : `${visible} of ${total} shown`)
    : plural(visible, 'location');
  locationCount.textContent = totalNpcs > 0 ? `${locPart} · ${totalNpcs} NPCs` : locPart;
}

// ── FILTER ────────────────────────────────────────────────────
function filterList(q) {
  q = q.trim().toLowerCase();
  let visible = 0;
  document.querySelectorAll('.loc-entry').forEach(el => {
    const id  = +el.dataset.id;
    const loc = LOCATIONS.find(l => l.id === id);
    if (!loc) return;
    const match = !q ||
      loc.name.toLowerCase().includes(q) ||
      loc.type.toLowerCase().includes(q) ||
      loc.desc.toLowerCase().includes(q);
    el.classList.toggle('hidden', !match);
    if (match) visible++;
  });
  updateCount(visible, LOCATIONS.length);
}

// ── PARTY MARKER ──────────────────────────────────────────────
let partyMarkerEl = null;

function getPartyPos() {
  const p = locVisibility['__party__'];
  return (p && Number.isFinite(p.x) && Number.isFinite(p.y)) ? p : null;
}

function renderPartyMarker() {
  if (!partyMarkerEl) return;
  const pos = getPartyPos();
  if (!pos) { partyMarkerEl.style.display = 'none'; return; }
  partyMarkerEl.style.display = 'block';
  partyMarkerEl.style.left = pos.x + '%';
  partyMarkerEl.style.top  = pos.y + '%';
}

// Keep the Map-Tools "Party Location" row in sync: "Set…" (click-to-place) when unset,
// jump-to when set. Hidden for players until a position exists (they can't place one).
function refreshPartyLocBtn() {
  const btn = document.getElementById('btn-party-loc');
  if (!btn) return;
  const set = !!getPartyPos();
  if (!set && !IS_DM) { btn.style.display = 'none'; return; }
  btn.style.display = '';
  btn.textContent = set ? 'Party Location' : 'Set Party Location';
  btn.title = set ? 'Jump to the party on the map' : 'Click, then click the map to place the party';
}

function initPartyMarker() {
  partyMarkerEl = document.createElement('div');
  partyMarkerEl.id = 'party-marker';
  // Interlaced 8-point star ({8/3} octagram): 8 equal-width chords that weave over/under.
  // Each <line> is a separate stroke so it can run its own staggered hue animation.
  partyMarkerEl.innerHTML = `
    <div class="party-label party-label-top">Party</div>
    <div class="party-star-wrap">
      <svg class="party-svg" viewBox="0 0 40 40" width="36" height="36" xmlns="http://www.w3.org/2000/svg">
        <line class="oct-line" x1="20"    y1="3"     x2="32.02" y2="32.02"/>
        <line class="oct-line" x1="32.02" y1="7.98"  x2="20"    y2="37"   />
        <line class="oct-line" x1="37"    y1="20"    x2="7.98"  y2="32.02"/>
        <line class="oct-line" x1="32.02" y1="32.02" x2="3"     y2="20"   />
        <line class="oct-line" x1="20"    y1="37"    x2="7.98"  y2="7.98" />
        <line class="oct-line" x1="7.98"  y1="32.02" x2="20"    y2="3"    />
        <line class="oct-line" x1="3"     y1="20"    x2="32.02" y2="7.98" />
        <line class="oct-line" x1="7.98"  y1="7.98"  x2="37"    y2="20"   />
      </svg>
    </div>
    <div class="party-label party-label-bot">Location</div>`;

  if (IS_DM) {
    partyMarkerEl.classList.add('dm-movable');
    partyMarkerEl.addEventListener('mousedown', ev => {
      ev.stopPropagation();
      ev.preventDefault();
      partyDragging = true;
      partyMarkerEl.classList.add('dragging');
    });
  }

  partyMarkerEl.addEventListener('mouseenter', ev => {
    tooltipType.textContent = '';
    tooltipName.textContent = 'Party Location';
    tooltipDesc.textContent = IS_DM ? 'Drag to reposition' : '';
    tooltipHint.textContent = '';
    tooltip.classList.add('visible');
    positionTooltip(ev);
  });
  partyMarkerEl.addEventListener('mouseleave', hideTooltip);

  viewport.appendChild(partyMarkerEl);
  renderPartyMarker();
}

// ── MARKERS RENDER ────────────────────────────────────────────
function renderMarkers() {
  markersLayer.innerHTML = '';
  LOCATIONS.forEach(loc => {
    const pos = positions[loc.id];
    if (!pos) return;
    if (!IS_DM && !isLocVisible(loc.id)) return;

    const el = document.createElement('div');
    el.dataset.id = loc.id;
    el.style.left = pos.x + '%';
    el.style.top  = pos.y + '%';
    if (IS_DM && !isLocVisible(loc.id)) el.style.opacity = '0.35';

    if (loc.type === 'Marker') {
      el.className = 'marker marker-text';
      el.innerHTML = `<div class="marker-label">${escHtml(loc.name)}</div>`;
    } else {
      el.className = 'marker';
      const color = typeColor(loc.type);
      el.innerHTML = `
        <svg class="marker-seal" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
          <circle cx="14" cy="14" r="12" fill="${color.bg}" stroke="${color.ring}" stroke-width="1.5"/>
          <circle cx="14" cy="14" r="8"  fill="none"        stroke="${color.ring}" stroke-width=".8" stroke-dasharray="2 1.5"/>
          <text x="14" y="18" text-anchor="middle"
                font-family="Cinzel,serif" font-size="10" font-weight="700"
                fill="${color.text}">${escHtml((loc.type || '?')[0])}</text>
        </svg>
        <div class="marker-label">${escHtml(loc.name)}</div>
      `;
    }

    el.addEventListener('mouseenter', ev => showTooltip(loc, ev));
    el.addEventListener('mouseleave', hideTooltip);
    el.addEventListener('click', ev => {
      ev.stopPropagation();
      if (editMode) return;
      activateLocation(loc.id, true);
      const _slug = townSlugOf(loc);
      const canOpen = loc.page && !/^(javascript|data|vbscript):/i.test(loc.page) &&
                      (IS_DM || (_slug && townsWithContent.has(_slug)));
      if (canOpen) window.open(loc.page + (PLAYER_TEST ? '&player_test' : ''), '_blank', 'noopener');
    });

    // Edit-mode drag
    el.addEventListener('mousedown', ev => {
      if (!editMode) return;
      ev.stopPropagation();
      ev.preventDefault();
      draggingMarker = { id: loc.id, el };
      el.classList.add('edit-dragging');
    });

    markersLayer.appendChild(el);
  });

  // Re-attach ghost marker if placement mode is active
  if (placementMode && ghostMarkerEl) markersLayer.appendChild(ghostMarkerEl);

  updateMarkerLabels();
}

function updateMarkerLabels() {
  document.querySelectorAll('.marker-label').forEach(el => {
    if (el.closest('.marker-text')) return; // text-only markers always visible
    el.classList.toggle('show', labelsVisible);
  });
}

function typeColor(type) {
  const t = type.toLowerCase();
  if (t === 'city')     return { bg: '#8b2020', ring: '#c8922a', text: '#f2e8d0' };
  if (t === 'town')     return { bg: '#3b2a14', ring: '#c8922a', text: '#f2e8d0' };
  if (t === 'ruin')     return { bg: '#2a2a2a', ring: '#888',    text: '#ccc'    };
  if (t === 'dungeon')  return { bg: '#1a1a2e', ring: '#6666aa', text: '#ccccff' };
  if (t === 'landmark') return { bg: '#1c3a1c', ring: '#5a8a5a', text: '#c0e0c0' };
  return { bg: '#3b2a14', ring: '#c8922a', text: '#f2e8d0' };
}

// ── ACTIVATE LOCATION ─────────────────────────────────────────
function activateLocation(id, panToIt) {
  activeId = id;

  // Sidebar highlight
  document.querySelectorAll('.loc-entry').forEach(el => {
    el.classList.toggle('highlighted', +el.dataset.id === id);
  });
  // Scroll entry into view
  const entry = document.querySelector(`.loc-entry[data-id="${id}"]`);
  if (entry) entry.scrollIntoView({ block: 'nearest', behavior: 'smooth' });

  // Marker highlight
  document.querySelectorAll('.marker').forEach(el => {
    el.classList.toggle('active', +el.dataset.id === id);
  });

  // Pan map to marker (unless in edit mode or explicitly skipped)
  if (panToIt && !editMode) {
    const pos = positions[id];
    if (pos) {
      const areaW = mapArea.clientWidth;
      const areaH = mapArea.clientHeight;
      const targetX = (pos.x / 100) * mapW * scale;
      const targetY = (pos.y / 100) * mapH * scale;
      panX = areaW / 2 - targetX;
      panY = areaH / 2 - targetY;
      applyTransform();
    }
  }
}

// ── TOOLTIP ───────────────────────────────────────────────────
function showTooltip(loc, ev) {
  tooltipType.textContent = loc.type;
  tooltipName.textContent = loc.name;
  tooltipDesc.textContent = loc.desc;
  const _tSlug = townSlugOf(loc);
  const _hasMap = _tSlug ? townsWithContent.has(_tSlug) : false;
  tooltipHint.textContent = (IS_DM ? !!loc.page : _hasMap) ? 'Click to open town map →' : '';
  tooltip.classList.add('visible');
  positionTooltip(ev);
}

function hideTooltip() {
  tooltip.classList.remove('visible');
}

document.addEventListener('mousemove', ev => {
  if (tooltip.classList.contains('visible')) positionTooltip(ev);
});

function positionTooltip(ev) {
  const pad = 14;
  const tw  = tooltip.offsetWidth  || 240;
  const th  = tooltip.offsetHeight || 100;
  let x = ev.clientX + pad;
  let y = ev.clientY + pad;
  if (x + tw > window.innerWidth  - 16) x = ev.clientX - tw - pad;
  if (y + th > window.innerHeight - 16) y = ev.clientY - th - pad;
  tooltip.style.left = x + 'px';
  tooltip.style.top  = y + 'px';
}

// ── MARKER BOUNDS CLAMP ───────────────────────────────────────
// Keeps the 28×28 seal fully inside the map image at all times.
function clientToMarkerPos(clientX, clientY) {
  const { x, y } = clientToMapPct(clientX, clientY);
  return clampMarkerPos(x, y);
}

function clampMarkerPos(x, y) {
  const halfW = mapW > 0 ? (14 / mapW) * 100 : 0;
  const sealH = mapH > 0 ? (28 / mapH) * 100 : 0;
  return {
    x: Math.max(halfW, Math.min(100 - halfW, x)),
    y: Math.max(sealH, Math.min(100, y))
  };
}

// ── HANDLE MARKER DRAG ────────────────────────────────────────
function handleMarkerDrag(e) {
  if (!draggingMarker) return;
  const pos = clientToMarkerPos(e.clientX, e.clientY);
  positions[draggingMarker.id] = pos;
  draggingMarker.el.style.left = pos.x + '%';
  draggingMarker.el.style.top  = pos.y + '%';
}

// ── HEX GRID (DM-controlled, synced to players) ───────────────
// State piggybacks on locVisibility['__hexgrid__'] so it travels through
// the same save → broadcast pipeline as the party marker. { on, scale }
// where `scale` is the grid cell size in pixels (map space).
let hexGrid = { on: true, scale: 112 };
let _hexSaveTimer = null;

function applyHexGrid() {
  const overlay = document.getElementById('hex-grid-overlay');
  const pattern = document.getElementById('hex-pattern');
  if (overlay) overlay.classList.toggle('hidden', !hexGrid.on);
  // Base pattern tile is 28px wide; scale so one tile ≈ hexGrid.scale px.
  // Base hex tile is 34.641px wide; scale so one hex ≈ hexGrid.scale px across.
  if (pattern) pattern.setAttribute('patternTransform', 'scale(' + (hexGrid.scale / 34.641) + ')');
  const btn = document.getElementById('btn-hexgrid');
  if (btn) btn.classList.toggle('active', hexGrid.on);
  const inline = document.getElementById('hexgrid-inline');
  if (inline) inline.classList.toggle('show', hexGrid.on);   // cell-size field only when grid on
  const inp = document.getElementById('hexgrid-scale');
  if (inp && document.activeElement !== inp) inp.value = hexGrid.scale;
}

// Read state pushed from the server (players) or restored locally (DM).
function loadHexGridFromVis() {
  const g = locVisibility['__hexgrid__'];
  if (g && typeof g === 'object') {
    hexGrid.on    = !!g.on;
    if (Number.isFinite(g.scale) && g.scale > 0) hexGrid.scale = Math.min(g.scale, 2000);
  }
  applyHexGrid();
}

// DM only — persist + broadcast so players update.
function saveHexGrid() {
  locVisibility['__hexgrid__'] = { on: hexGrid.on, scale: hexGrid.scale };
  saveLocVisibility();
}

function toggleHexGrid() {
  hexGrid.on = !hexGrid.on;
  applyHexGrid();
  saveHexGrid();
}

function setHexScale(px) {
  const n = parseFloat(px);
  if (!Number.isFinite(n) || n <= 0) return;
  const v = Math.max(10, Math.min(2000, Math.round(n)));
  hexGrid.scale = v;
  applyHexGrid();
  clearTimeout(_hexSaveTimer);
  _hexSaveTimer = setTimeout(saveHexGrid, 300);   // debounce while scrubbing
}

// ── UTILITY ───────────────────────────────────────────────────
function plural(n, word) { return `${n} ${word}${n !== 1 ? 's' : ''}`; }

function saveAfterEdit() {

  savePositionsToServer();
}

function rebuildView() {
  buildSidebar();

}

function townSlugOf(loc) {
  return loc.page ? (loc.page.match(/[?&]town=([^&]+)/) || [])[1] || null : null;
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#39;');
}

// ── CUSTOM LOCATIONS (localStorage) ───────────────────────────
const CUSTOM_LOC_KEY = 'nocropi_custom_locations';

function loadCustomLocations() {
  try {
    const stored = localStorage.getItem(CUSTOM_LOC_KEY);
    if (!stored) return;
    const data = JSON.parse(stored);
    if (Array.isArray(data.locs)) {
      data.locs.forEach(loc => {
        loc.custom = true;
        if (!LOCATIONS.find(l => l.id === loc.id)) LOCATIONS.push(loc);
      });
    }
    if (data.pos && typeof data.pos === 'object') {
      Object.entries(data.pos).forEach(([k, v]) => {
        if (!LOCATION_MAP_DEFAULT[+k]) LOCATION_MAP_DEFAULT[+k] = v;
      });
    }
  } catch(e) {}
}

function saveCustomLocations() {
  const custom = LOCATIONS.filter(l => l.custom === true);
  const pos = {};
  custom.forEach(l => { if (positions[l.id]) pos[l.id] = positions[l.id]; });
  try { localStorage.setItem(CUSTOM_LOC_KEY, JSON.stringify({ locs: custom, pos })); } catch(e) {}
}

function removeMarker(id) {
  const idx = LOCATIONS.findIndex(l => l.id === id);
  if (idx === -1) return;
  LOCATIONS.splice(idx, 1);
  delete positions[id];
  delete LOCATION_MAP_DEFAULT[id];
  saveAfterEdit();
  rebuildView();
}

  }

// Pan/center the map on a percentage position (mirrors activateLocation's pan math).
function jumpToMapPct(xPct, yPct) {
  const areaW = mapArea.clientWidth;
  const areaH = mapArea.clientHeight;
  panX = areaW / 2 - (xPct / 100) * mapW * scale;
  panY = areaH / 2 - (yPct / 100) * mapH * scale;
  applyTransform();
}

function capitaliseFirst(input) {
  const v = input.value;
  if (v.length > 0) input.value = v[0].toUpperCase() + v.slice(1);
}

function openAddLocation() {

// ── PLACEMENT MODE ─────────────────────────────────────────────
function clientToMapPct(clientX, clientY) {
  const rect = mapArea.getBoundingClientRect();
  const mx   = (clientX - rect.left - panX) / scale;
  const my   = (clientY - rect.top  - panY) / scale;
  return {
    x: Math.max(0, Math.min(100, (mx / mapW) * 100)),
    y: Math.max(0, Math.min(100, (my / mapH) * 100))
  };
}

function enterPlacementMode(name, type) {
  pendingTownName = name;
  pendingType     = type || 'Location';
  placementMode   = true;
  mapArea.classList.add('placement-mode');

  ghostMarkerEl = document.createElement('div');
  ghostMarkerEl.style.left         = '-9999px';
  ghostMarkerEl.style.top          = '-9999px';
  ghostMarkerEl.style.opacity      = '0.72';
  ghostMarkerEl.style.pointerEvents = 'none';

  if (pendingType === 'Marker') {
    ghostMarkerEl.className = 'marker marker-text';
    ghostMarkerEl.innerHTML = `<div class="marker-label">${escHtml(name)}</div>`;
  } else {
    ghostMarkerEl.className = 'marker';
    const color = typeColor('Town');
    ghostMarkerEl.innerHTML = `
      <svg class="marker-seal" viewBox="0 0 28 28" xmlns="http://www.w3.org/2000/svg">
        <circle cx="14" cy="14" r="12" fill="${color.bg}" stroke="${color.ring}" stroke-width="1.5"/>
        <circle cx="14" cy="14" r="8"  fill="none" stroke="${color.ring}" stroke-width=".8" stroke-dasharray="2 1.5"/>
        <text x="14" y="18" text-anchor="middle" font-family="Cinzel,serif" font-size="10" font-weight="700" fill="${color.text}">T</text>
      </svg>
      <div class="marker-label">${escHtml(name)}</div>`;
  }
  markersLayer.appendChild(ghostMarkerEl);

  document.getElementById('placement-banner').textContent =
    'Click on the map to place "' + name + '"  ·  Esc to cancel';
}

function exitPlacementMode() {
  if (!placementMode) return;
  placementMode   = false;
  pendingTownName = null;
  pendingClick    = false;
  mapArea.classList.remove('placement-mode');
  if (ghostMarkerEl) { ghostMarkerEl.remove(); ghostMarkerEl = null; }
  document.getElementById('placement-banner').textContent = '';
}

function finalizePlacement(x, y) {
  const name   = pendingTownName;
  const type   = pendingType;

  // Party marker: not a location — store the position + save/broadcast, then jump to it.
  if (type === 'Party') {
    locVisibility['__party__'] = { x: +x.toFixed(3), y: +y.toFixed(3) };
    saveLocVisibility();
    exitPlacementMode();
    renderPartyMarker();
    refreshPartyLocBtn();
    jumpToMapPct(x, y);
    return;
  }

  const nextId = LOCATIONS.reduce((m, l) => Math.max(m, l.id), 10) + 1;

  let newLoc;
  if (type === 'Marker') {
    newLoc = { id: nextId, name, type: 'Marker', desc: '', page: null, custom: true };
  } else {
    const slug = name.toLowerCase().replace(/\s+/g, '_').replace(/[^a-z0-9_]/g, '');
    newLoc = { id: nextId, name, type, desc: 'A new settlement awaiting its story.', page: 'map_tool.html?town=' + slug, custom: true };
  }

  LOCATIONS.push(newLoc);
  LOCATION_MAP_DEFAULT[nextId] = { x, y };
  positions[nextId]            = { x, y };

  saveAfterEdit();
  exitPlacementMode();
  rebuildView();
  activateLocation(nextId, false);
}
